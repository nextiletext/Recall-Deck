<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - OCR GCSE Computer Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: var(--accent-ink); }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">OCR GCSE Computer Science (J277)</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subjects"></div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="setTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="setTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="setTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unitSelect">Unit:</label>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'comp1';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var shuffledCards = [];
      var shuffledQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      var DATA = {
        comp1: {
          title: "Component 1: Computer Systems",
          units: [
            {
              id: "c1_1",
              name: "1.1 Systems Architecture",
              notes: [
                { t: "The Central Processing Unit (CPU) Architecture", content: "The CPU fetches, decodes, and executes instructions to process data.", points: ["Arithmetic Logic Unit (ALU): Executes arithmetic operations (+, -, *, /) and logical comparisons (AND, OR, NOT, <, >, =).", "Control Unit (CU): Coordinates the F-D-E cycle, decodes machine instructions, and sends control signals along buses.", "Cache Memory: Small, extremely fast static RAM located on or very close to the CPU chip, storing frequently used data/instructions to minimize slow RAM access delays.", "Registers: Tiny, lightning-fast storage locations inside the CPU holding data currently being processed."] },
                { t: "Von Neumann Architecture & Registers", content: "Von Neumann architecture stores both program instructions and data together in the same primary memory storage.", points: ["Memory Address Register (MAR): Holds the memory address of the instruction or data currently needed to be read from or written to.", "Memory Data Register (MDR): Holds the actual data or instruction fetched from memory, or waiting to be written.", "Program Counter (PC): Holds the exact memory address of the very next instruction to be fetched.", "Accumulator (ACC): Temporarily stores the intermediate results of ALU calculations."] },
                { t: "CPU Performance Factors", content: "Three core hardware factors dictate overall microprocessor performance and throughput.", points: ["Clock Speed: Measured in Gigahertz (GHz), representing billions of processing cycles per second. Higher clock speed means faster instruction execution.", "Cache Size: Larger cache capacity holds more active instructions locally, reducing latency caused by fetching from main memory.", "Number of Cores: Multi-core processors allow independent tasks or parallelized threads to run simultaneously, multiplying processing capability if software supports it."] }
              ],
              cards: [
                { q: "What is the function of the Program Counter (PC)?", a: "It stores the memory address of the next instruction to be fetched during the F-D-E cycle." },
                { q: "What does von Neumann architecture store in main memory?", a: "Both program instructions and data share the same unified main memory space." },
                { q: "What is the function of the ALU?", a: "Performs arithmetic calculations and logical comparisons." },
                { q: "What is the role of the Control Unit (CU)?", a: "Decodes instructions and controls the flow of data through the CPU." },
                { q: "What does the MAR hold?", a: "The memory address of the location currently being read from or written to." },
                { q: "What does the MDR hold?", a: "The actual data or instruction fetched from or being sent to memory." },
                { q: "What does the Accumulator (ACC) store?", a: "The intermediate results of ALU calculations." },
                { q: "Why is cache memory used in a CPU?", a: "To store frequently accessed instructions and reduce RAM fetch delay." },
                { q: "What is clock speed measured in?", a: "Gigahertz (GHz) — billions of cycles per second." },
                { q: "What is a CPU core?", a: "An independent processing unit within the CPU capable of executing cycles." },
                { q: "What occurs during the Fetch stage of the F-D-E cycle?", a: "The CPU retrieves an instruction from main memory (RAM) using the address in the PC." },
                { q: "What occurs during the Decode stage?", a: "The Control Unit interprets the instruction to determine what actions are required." },
                { q: "What occurs during the Execute stage?", a: "The instruction is carried out by components like the ALU or data is moved between registers." },
                { q: "What is an embedded system?", a: "A dedicated computer system built into a larger device to perform a specific function." },
                { q: "Give two examples of embedded systems.", a: "Washing machines, microwave ovens, digital cameras, traffic lights." },
                { q: "What is Cache Level 1 (L1)?", a: "The fastest, smallest cache memory located directly inside the CPU core." },
                { q: "What is Cache Level 3 (L3)?", a: "Slower than L1/L2 cache but shared across all CPU cores with a larger capacity." },
                { q: "What is overclocking?", a: "Increasing CPU clock speed beyond factory defaults, increasing heat and power consumption." },
                { q: "Why might doubling CPU cores not double overall performance?", a: "Software must be written to support parallel processing; some tasks cannot be split." },
                { q: "What bus carries memory addresses from the CPU to RAM?", a: "The Address Bus." },
                { q: "What bus transfers actual data between CPU registers and memory?", a: "The Data Bus." },
                { q: "What bus carries signals controlling operations like read/write?", a: "The Control Bus." },
                { q: "What is the main characteristic of a general-purpose computer?", a: "It can run many different programs to perform various tasks (e.g., laptop, smartphone)." },
                { q: "How does larger cache size improve performance?", a: "More data is available at ultra-fast speeds, reducing slow fetches from RAM." },
                { q: "What register updates automatically after an instruction is fetched?", a: "The Program Counter (PC increments to point to the next memory address)." }
              ],
              quiz: [
                { q: "Which CPU component carries out arithmetic operations and logical comparisons?", opts: ["Control Unit", "Cache", "ALU", "MAR"], ans: 2 },
                { q: "What is the main role of the Control Unit (CU)?", opts: ["Perform addition and subtraction", "Coordinate the F-D-E cycle and decode instructions", "Hold intermediate ALU results", "Store boot-up instructions"], ans: 1 },
                { q: "Where is Cache memory located relative to the CPU?", opts: ["On a remote cloud server", "Inside secondary solid state storage", "On or very close to the CPU chip", "Inside the optical drive"], ans: 2 },
                { q: "Which register holds the memory address of data about to be read or written?", opts: ["MDR", "PC", "MAR", "ACC"], ans: 2 },
                { q: "What is stored inside the Program Counter (PC)?", opts: ["The memory address of the NEXT instruction to be fetched", "The output of an AND logic operation", "The current clock frequency in GHz", "The total size of physical RAM"], ans: 0 },
                { q: "What does the Accumulator (ACC) temporarily hold?", opts: ["Unread network data packets", "The intermediate results of ALU calculations", "Deleted browser history", "Device driver configuration settings"], ans: 1 },
                { q: "How is Clock Speed measured?", opts: ["Megabytes (MB)", "Gigahertz (GHz)", "Bits per second (bps)", "Pixels per inch"], ans: 1 },
                { q: "How does having multiple CPU cores improve processing capability?", opts: ["It doubles the speed of light", "It allows independent tasks or parallelized threads to run simultaneously", "It replaces the need for RAM", "It prevents malware infections"], ans: 1 },
                { q: "What defines an embedded system?", opts: ["A computer built into a larger device to perform a dedicated task", "A server with multiple GPUs", "A desktop tower PC", "A gaming laptop"], ans: 0 },
                { q: "Which component decodes instructions during the F-D-E cycle?", opts: ["ALU", "Control Unit", "RAM", "Hard Drive"], ans: 1 },
                { q: "Which level of Cache memory is fastest?", opts: ["L1", "L2", "L3", "Virtual Memory"], ans: 0 },
                { q: "What happens to CPU temperature during overclocking?", opts: ["Decreases", "Increases significantly", "Remains unchanged", "Drops to absolute zero"], ans: 1 },
                { q: "Which bus transfers memory addresses from the CPU to RAM?", opts: ["Data Bus", "Address Bus", "Control Bus", "USB"], ans: 1 },
                { q: "Which register receives data fetched directly from RAM memory?", opts: ["MAR", "MDR", "PC", "ALU"], ans: 1 },
                { q: "Why doesn't doubling CPU cores always double computer speed?", opts: ["Software may not support parallel execution", "Cores slow each other down automatically", "RAM is disabled", "Cache turns off"], ans: 0 },
                { q: "Which device is an example of an embedded system?", opts: ["Microwave oven", "MacBook Pro", "Mainframe server", "Custom desktop PC"], ans: 0 },
                { q: "What holds data currently being fetched from or written to memory?", opts: ["MDR", "MAR", "PC", "Cache"], ans: 0 },
                { q: "What happens to the Program Counter after fetching an instruction?", opts: ["Resets to zero", "Increments to point to the next address", "Clears its contents", "Turns off"], ans: 1 },
                { q: "Which bus carries read/write control signals?", opts: ["Address Bus", "Control Bus", "Data Bus", "PCIe Bus"], ans: 1 },
                { q: "Von Neumann architecture stores instructions and data in:", opts: ["Separate physical chips", "The same unified memory space", "Cloud storage only", "Optical discs"], ans: 1 },
                { q: "What is the primary drawback of increasing clock speed via overclocking?", opts: ["Slows down boot time", "May cause overheating and system instability", "Erases ROM", "Reduces RAM capacity"], ans: 1 },
                { q: "What does GHz represent in CPU specs?", opts: ["Gigabytes of RAM", "Billions of CPU clock cycles per second", "Graphics speed", "Hard drive RPM"], ans: 1 },
                { q: "Which register stores the location in RAM currently being targeted?", opts: ["MAR", "MDR", "ACC", "ALU"], ans: 0 },
                { q: "What type of computer is designed to perform a wide range of user tasks?", opts: ["Embedded System", "General Purpose System", "ASIC", "Microcontroller"], ans: 1 },
                { q: "In the F-D-E cycle, what executes instructions?", opts: ["CPU components like ALU/CU", "Hard Drive", "Power Supply", "Monitor"], ans: 0 }
              ]
            },
            {
              id: "c1_2",
              name: "1.2 Memory and Storage",
              notes: [
                { t: "Primary Storage (RAM & ROM)", content: "Primary storage is directly accessible by the CPU, essential for running active applications.", points: ["RAM (Random Access Memory): Volatile primary storage holding open applications, files, and parts of the OS currently in use. Data is lost when power is cut.", "ROM (Read-Only Memory): Non-volatile memory containing immutable boot-up code (BIOS/firmware) needed to initialize hardware upon startup.", "Virtual Memory: A designated portion of secondary storage utilized as overflow RAM when physical RAM is fully saturated. Slower due to disk read/write latency."] },
                { t: "Secondary Storage & Data Units", content: "Secondary storage provides non-volatile, permanent retention of programs and files.", points: ["Storage Media Types: Magnetic (HDDs using magnetic platters), Optical (CD/DVD/Blu-ray using lasers), and Solid State (SSDs using flash memory chips; fast, durable, silent).", "Data Storage Units: Bit (0 or 1), Nibble (4 bits), Byte (8 bits), Kilobyte (1,000 bytes), Megabyte, Gigabyte, Terabyte, Petabyte.", "File Calculations: Image size = Width × Height × Colour depth (bits). Sound size = Sample rate × Bit depth × Duration (seconds)."] }
              ],
              cards: [
                { q: "What is the difference between volatile and non-volatile memory?", a: "Volatile loses data when powered off (RAM); non-volatile retains data permanently (ROM/SSD)." },
                { q: "What is RAM used for?", a: "Holding currently running programs, open files, and the operating system." },

      function renderHeader() {
        var subHtml = '';
        var keys = ['comp1', 'comp2'];
        var labels = { comp1: 'Comp 1 (Systems)', comp2: 'Comp 2 (Programming)' };
        keys.forEach(function (k) {
          subHtml += '<button class="subj-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = isDark ? 'Dark Mode' : 'Light Mode';
      }

      window.toggleTheme = function() {
        isDark = !isDark;
        if (!isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      function initSessionData() {
        var rawCards = [];
        var rawQuiz = [];
        var units = DATA[currentSubj].units;
        var filtered = currentUnit === 'all' ? units : units.filter(function(u) { return u.id === currentUnit; });

        filtered.forEach(function(u) {
          u.cards.forEach(function(c) {
            rawCards.push({ unitName: u.name, q: c.q, a: c.a });
          });
          u.quiz.forEach(function(q) {
            rawQuiz.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });

        shuffledCards = shuffleArray(rawCards);
        shuffledQuiz = shuffleArray(rawQuiz);
      }

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        if (t === 'study' || t === 'quiz') {
          initSessionData();
          qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0;
        }
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + t);
        });
        render();
      };

      function renderNotes() {
        var units = currentUnit === 'all' ? DATA[currentSubj].units : DATA[currentSubj].units.filter(function(u) { return u.id === currentUnit; });
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">OCR GCSE J277</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (shuffledCards.length === 0) initSessionData();

        if (qIdx >= shuffledCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You have reviewed all <b>' + shuffledCards.length + '</b> unique flashcards for this selection.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = shuffledCards[qIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (qIdx + 1) + ' of ' + shuffledCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        if (e) e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      window.resetFlashcards = function () {
        qIdx = 0;
        flipped = false;
        shuffledCards = shuffleArray(shuffledCards);
        render();
      };

      function renderQuiz() {
        if (shuffledQuiz.length === 0) initSessionData();

        if (quizIdx >= shuffledQuiz.length) {
          var pct = Math.round((quizScore / shuffledQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + shuffledQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = shuffledQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + shuffledQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === shuffledQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        shuffledQuiz = shuffleArray(shuffledQuiz);
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (!main) return;
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      initSessionData();
      render();
    })();
  </script>
