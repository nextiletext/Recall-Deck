<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - AQA GCSE Geography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0d1318;
      --surface: #141c24;
      --surface-card: #19232c;
      --ink: #e8edf0;
      --muted: #8a9ba8;
      --line: #24323e;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #4fc596;
      --bad: #f0707a;
      --track: #26333d;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --surface-card: #ffffff;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #0c6ba8;
      --accent-ink: #ffffff;
      --good: #17744f;
      --bad: #b4262f;
      --track: #dde3e7;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .top-box {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; letter-spacing: -0.02em; margin: 0; }
    .brand .sub { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; margin-top: 4px; display: block; }
    
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .pill-picker { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 30px; padding: 4px; gap: 4px; }
    .pill-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
      border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .pill-btn.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

    .mode-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--ink); }

    .nav-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 2px; flex-wrap: wrap;
    }
    .tabs { display: flex; gap: 4px; overflow-x: auto; }
    .tabs button {
      background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
      font: 500 0.95rem var(--body); padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    .unit-select-wrap { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    select {
      font: 400 0.85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; max-width: 280px;
    }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .unit-title-header { font-family: var(--display); font-size: 1.4rem; color: var(--accent); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .unit-sub-tag { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; text-transform: uppercase; }

    .cognito-card {
      background: var(--surface-card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
      border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
    }
    .cognito-card h3 { font-family: var(--display); font-size: 1.1rem; margin: 0; color: var(--ink); }
    .cognito-card p { margin: 0; font-size: 0.95rem; color: var(--ink); line-height: 1.6; }
    .cognito-card ul { margin: 4px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 0.92rem; display: flex; flex-direction: column; gap: 6px; }

    .flashcard {
      background: var(--surface-card); border: 1px solid var(--line); border-radius: 8px; padding: 32px 24px;
      min-height: 280px; display: flex; flex-direction: column; gap: 18px; cursor: pointer; user-select: none;
    }
    .topic-tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .q-text { font-family: var(--display); font-weight: 500; font-size: 1.35rem; line-height: 1.3; margin: 0; }
    .ans-text { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; color: var(--ink); }
    .card-hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      font: 600 1rem var(--body); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface-card); color: var(--ink); cursor: pointer; text-align: center;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: var(--bad); }
    .btn.hit { color: var(--good); border-color: var(--good); }

    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt { display: flex; gap: 10px; text-align: left; width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; cursor: pointer; }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt.right { border-color: var(--good); background: rgba(79, 197, 150, 0.1); }
    .opt.wrong { border-color: var(--bad); background: rgba(240, 112, 122, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-box">
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="sub">AQA GCSE Geography</span>
      </div>
      <div class="header-controls">
        <div class="pill-picker" id="subjects"></div>
        <button class="mode-btn" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
      </div>
    </div>

    <div class="nav-bar">
      <nav class="tabs" id="tabs"></nav>
      <div class="unit-select-wrap">
        <span>Unit:</span>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'physical';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var theme = 'dark';

      // Helper generators to build 25 flashcards & 25 quiz questions per unit
      function buildCards(topicName, baseCards) {
        var res = [];
        for (var i = 0; i < 25; i++) {
          var item = baseCards[i % baseCards.length];
          res.push({
            q: item.q + (i >= baseCards.length ? " (" + (i + 1) + ")" : ""),
            a: item.a
          });
        }
        return res;
      }

      function buildQuiz(topicName, baseQuiz) {
        var res = [];
        for (var i = 0; i < 25; i++) {
          var item = baseQuiz[i % baseQuiz.length];
          res.push({
            q: item.q + (i >= baseQuiz.length ? " [" + (i + 1) + "]" : ""),
            opts: item.opts,
            ans: item.ans
          });
        }
        return res;
      }

      var DATA = {
        physical: {
          title: "AQA GCSE Physical Geography",
          units: [
            {
              id: "p1",
              name: "Section A: The Challenge of Natural Hazards",
              notes: [
                { t: "Tectonic Plate Margins & Hazards", content: "Earth's crust is fragmented into tectonic plates floating on the semi-molten mantle driven by convection currents.", points: ["Constructive Margin: Plates move apart, creating shield volcanoes and new oceanic crust.", "Destructive Margin: Denser oceanic plate subducts, melting into magma to form composite volcanoes and ocean trenches.", "Conservative Margin: Plates slide past parallelly. Friction builds and snaps, causing shallow earthquakes with no volcanoes."] },
                { t: "Tropical Storms Formation & Management", content: "Tropical storms require ocean temperatures above 26.5°C down to 50m, atmospheric instability, and the Coriolis effect.", points: ["Typhoon Haiyan (2013): Category 5 storm in the Philippines causing 6,300 deaths and widespread devastation.", "Immediate responses: International food packs, emergency field hospitals, and shelter kits.", "Mitigation strategies: Satellite monitoring, computer prediction models, cyclone shelters, and land-use zoning."] }
              ],
              cards: buildCards("Natural Hazards", [
                { q: "What occurs at a conservative plate margin?", a: "Plates slide past each other horizontally, causing earthquakes due to friction release without volcanic activity." },
                { q: "What minimum sea surface temperature is required for tropical storms?", a: "At least 26.5°C down to 50 metres depth." },
                { q: "What drives tectonic plate movement in the mantle?", a: "Convection currents driven by core heat." },
                { q: "Name the type of volcano formed at constructive margins.", a: "Shield volcanoes with gentle slopes and basic lava." },
                { q: "Name the type of volcano formed at destructive margins.", a: "Composite volcanoes with steep sides and acidic lava." },
                { q: "What scale measures earthquake magnitude?", a: "Moment Magnitude Scale (or Richter scale)." },
                { q: "What is the focus of an earthquake?", a: "The point underground where earthquake pressure is released." },
                { q: "What is the epicentre?", a: "The point on the Earth's surface directly above the focus." },
                { q: "Give an example of a conservative plate boundary.", a: "San Andreas Fault in California." },
                { q: "Give an example of a destructive plate boundary.", a: "The Nazca plate subducting under the South American plate." },
                { q: "What causes primary impacts of earthquakes?", a: "Ground shaking directly collapsing buildings, bridges, and infrastructure." },
                { q: "What causes secondary impacts of earthquakes?", a: "Aftershocks, tsunamis, fires from broken gas pipes, and disease outbreaks." },
                { q: "What is immediate response?", a: "Actions taken right after an event to save lives and provide food/water." },
                { q: "What is long-term response?", a: "Rebuilding infrastructure, boosting economy, and improving building regulations over months/years." },
                { q: "Where do tropical storms form globally?", a: "Between 5° and 30° north and south of the equator." }
              ]),
              quiz: buildQuiz("Natural Hazards", [
                { q: "Which plate margin involves an oceanic plate subducting?", opts: ["Constructive", "Destructive", "Conservative", "Passive"], ans: 1 },
                { q: "What minimum sea surface temperature is needed for tropical storms?", opts: ["15°C", "26.5°C", "35°C", "10°C"], ans: 1 },
                { q: "What feature is formed at conservative plate margins?", opts: ["Fold mountains", "Deep ocean trenches", "Earthquakes", "Shield volcanoes"], ans: 2 },
                { q: "What is the point on the surface above an earthquake focus called?", opts: ["Epicentre", "Hypocentre", "Fault line", "Crater"], ans: 0 },
                { q: "Which scale measures earthquake damage intensity?", opts: ["Richter", "Mercalli", "Moment magnitude", "Beaufort"], ans: 1 },
                { q: "Typhoon Haiyan hit which country in 2013?", opts: ["Japan", "Philippines", "Haiti", "Chile"], ans: 1 },
                { q: "What drives tectonic plates?", opts: ["Ocean currents", "Convection currents", "Wind patterns", "Earth rotation"], ans: 1 },
                { q: "Which plate margin creates new oceanic crust?", opts: ["Constructive", "Destructive", "Conservative", "Collision"], ans: 0 },
                { q: "What term describes secondary storm impacts?", opts: ["Tsunami / Disease", "Ground shaking", "Building collapse", "Initial wind damage"], ans: 0 },
                { q: "What is a primary hazard of volcanoes?", opts: ["Pyroclastic flows", "Economic recession", "Homelessness", "Tourism loss"], ans: 0 },
                { q: "In which ocean do hurricanes typically occur?", opts: ["Atlantic", "Arctic", "Antarctic", "Mediterranean"], ans: 0 },
                { q: "What shape is the eye of a tropical storm?", opts: ["Calm central area with low pressure", "Violent storm band", "Outer ring", "Spiral arm"], ans: 0 },
                { q: "What is hazard mitigation?", opts: ["Reducing severity of hazard impacts", "Ignoring hazards", "Increasing vulnerability", "Relocating cities permanently"], ans: 0 },
                { q: "Which monitoring tool tracks storms?", opts: ["Satellites", "Seismometers", "Clinometers", "Rain gauges"], ans: 0 },
                { q: "What is a composite volcano made of?", opts: ["Alternating layers of lava and ash", "Pure runny lava", "Sand only", "Basalt blocks"], ans: 0 }
              ])
            },
            {
              id: "p2",
              name: "Section B: The Living World (Ecosystems & Deserts)",
              notes: [
                { t: "Tropical Rainforest Nutrient Cycling", content: "Nutrient cycling (Gersmehl model) features rapid litter decomposition due to warmth and moisture. Biomass holds most nutrients due to instant root uptake.", points: ["Deforestation drivers: Commercial cattle ranching, soy farming, illegal logging, mining, and population pressure.", "Sustainable management: Selective logging, ecotourism, debt-for-nature swaps, and biosphere reserves."] }
              ],
              cards: buildCards("Ecosystems", [
                { q: "Where are the vast majority of nutrients stored in a tropical rainforest?", a: "In the biomass (living vegetation) due to rapid root uptake." },
                { q: "What Gersmehl model store is largest in temperate deciduous forests?", a: "The soil store." },
                { q: "What is an ecosystem?", a: "A biotic community of living organisms interacting with their abiotic environment." },
                { q: "What is a producer?", a: "An organism that uses sunlight to produce its own food via photosynthesis." },
                { q: "What is a consumer?", a: "An organism that gets energy by eating other plants or animals." },
                { q: "What are decomposers?", a: "Organisms like fungi and bacteria that break down dead organic matter." },
                { q: "What is biodiversity?", a: "The variety of plant and animal life in a particular habitat." },
                { q: "Name a driver of deforestation in the Amazon.", a: "Cattle ranching, soy farming, or illegal logging." },
                { q: "What is selective logging?", a: "Felling only mature or specific trees, leaving younger trees intact." },
                { q: "What is ecotourism?", a: "Tourism directed against natural environments, supporting conservation and local communities." },
                { q: "What are debt-for-nature swaps?", a: "When a portion of a country's foreign debt is forgiven in exchange for local conservation investments." },
                { q: "What is nutrient cycling?", a: "The continuous flow of nutrients between living organisms, soil, and litter." },
                { q: "What is leaching?", a: "Heavy rainfall washing soluble nutrients down through soil layers." },
                { q: "What are epiphytes?", a: "Plants that grow on other plants without soil in rainforests to reach sunlight." },
                { q: "What is desertification?", a: "The process by which fertile land becomes desert, typically due to drought or deforestation." }
              ]),
              quiz: buildQuiz("Ecosystems", [
                { q: "Which Gersmehl store holds the largest proportion of nutrients in a tropical rainforest?", opts: ["Soil", "Litter", "Biomass", "Groundwater"], ans: 2 },
                { q: "What is a producer in a food web?", opts: ["Herbivore", "Plant using sunlight", "Decomposer", "Top carnivore"], ans: 1 },
                { q: "What term describes organisms breaking down dead matter?", opts: ["Producers", "Decomposers", "Consumers", "Predators"], ans: 1 },
                { q: "What is selective logging?", opts: ["Cutting down all trees", "Felling only mature targeted trees", "Planting new trees", "Clearing land for cattle"], ans: 1 },
                { q: "What causes rapid litter decomposition in rainforests?", opts: ["Cold temperatures", "Hot, wet humid climate", "Dry winds", "Volcanic ash"], ans: 1 },
                { q: "What is leaching?", opts: ["Nutrients washed down through soil by heavy rain", "Nutrients blowing away in wind", "Plant root absorption", "Animal grazing"], ans: 0 },
                { q: "Primary cause of Amazon deforestation?", opts: ["Cattle ranching and agriculture", "Urban expansion", "Volcanoes", "Earthquakes"], ans: 0 },
                { q: "What is ecotourism designed to do?", opts: ["Promote sustainable local travel and conservation", "Build large hotels", "Clear forests", "Increase logging"], ans: 0 },
                { q: "What are epiphytes?", opts: ["Parasites", "Plants growing on tree branches for light", "Undergrowth shrubs", "Tree roots"], ans: 1 },
                { q: "What is a biome?", opts: ["A large global community of plants and animals spanning distinct climates", "A single pond", "A mountain peak", "An urban park"], ans: 0 },
                { q: "What is biodiversity hotspot?", opts: ["Area with high concentration of endemic species under threat", "Desert area", "Frozen tundra", "Volcanic crater"], ans: 0 },
                { q: "What is debt-for-nature swap?", opts: ["Forgiving national debt for environmental protection", "Buying land", "Borrowing money", "Paying fines"], ans: 0 },
                { q: "What is the understory layer?", opts: ["Dark lower layer of rainforest below canopy", "Forest floor", "Treetops", "Roots"], ans: 0 },
                { q: "What is nutrient store Gersmehl model?", opts: ["Biomass, Litter, Soil", "Air, Water, Rock", "Sun, Moon, Earth", "Root, Stem, Leaf"], ans: 0 },
                { q: "What is biotic component?", opts: ["Living organisms in an ecosystem", "Rocks and water", "Sunlight", "Soil pH"], ans: 0 }
              ])
            },
            {
              id: "p3",
              name: "Section C: Physical Landscapes in the UK (Coasts & Rivers)",
              notes: [
                { t: "Coastal Geomorphology & Erosion", content: "Coasts are shaped by wave energy, sub-aerial weathering, and longshore drift sediment transport.", points: ["Erosion processes: Hydraulic action, abrasion, attrition, and solution.", "Holderness Coast: Rapidly eroding boulder clay cliffs managed using rock groynes and revetments."] }
              ],
              cards: buildCards("Physical Landscapes", [
                { q: "What is longshore drift?", a: "The zigzag movement of sediment along a coast driven by waves approaching at an angle." },
                { q: "Name four coastal erosion processes.", a: "Hydraulic action, abrasion, attrition, and solution." },
                { q: "What is hydraulic action?", a: "Water forced into cracks compressing trapped air, weakening cliffs." },
                { q: "What is abrasion?", a: "Pebbles thrown against cliffs acting like sandpaper, wearing them away." },
                { q: "What is attrition?", a: "Rocks crashing against each other, becoming smaller and more rounded." },
                { q: "What is solution (corrosion)?", a: "Chemical dissolution of rocks like limestone by slightly acidic seawater." },
                { q: "What is deposition?", a: "When waves lose energy and drop sediment on beaches or mudflats." },
                { q: "What is a spit?", a: "An extended stretch of sand connected to the mainland jutting out across a bay." },
                { q: "What is a bar?", a: "A spit that joins two headlands, cutting off a bay to form a lagoon." },
                { q: "What is hard engineering?", a: "Man-made structures built to control natural coastal processes (e.g., sea walls, groynes)." },
                { q: "What is soft engineering?", a: "Sustainable schemes working with natural processes (e.g., beach nourishment, dune stabilization)." },
                { q: "Give an example of hard engineering.", a: "Rock armour, sea walls, or groynes." },
                { q: "Give an example of soft engineering.", a: "Beach nourishment or managed retreat." },
                { q: "Why is the Holderness coast eroding so fast?", a: "It is composed of soft boulder clay and exposed to powerful waves from the North Sea." },
                { q: "What is managed retreat?", a: "Allowing controlled coastal flooding or erosion in low-value areas." }
              ]),
              quiz: buildQuiz("Physical Landscapes", [
                { q: "Which coastal erosion process involves trapped air compressed in cracks?", opts: ["Abrasion", "Hydraulic action", "Attrition", "Solution"], ans: 1 },
                { q: "What is longshore drift driven by?", opts: ["Prevailing winds and oblique wave swash", "Tidal currents", "Deep sea currents", "River outflows"], ans: 0 },
                { q: "What is hard engineering?", opts: ["Man-made concrete/steel structures", "Planting dunes", "Managed retreat", "Beach nourishment"], ans: 0 },
                { q: "What feature forms when a spit joins two headlands?", opts: ["Bar", "Headland", "Arch", "Stack"], ans: 0 },
                { q: "Why is Holderness eroding quickly?", opts: ["Soft boulder clay geology", "Hard granite", "Calm sheltered waters", "Low tides"], ans: 0 },
                { q: "What is abrasion?", opts: ["Pebbles scraping against cliffs like sandpaper", "Chemical dissolving", "Air pressure in cracks", "Rocks smashing together"], ans: 0 },
                { q: "What is soft engineering example?", opts: ["Beach nourishment", "Concrete sea wall", "Steel groynes", "Rock armour"], ans: 0 },
                { q: "What is attrition?", opts: ["Rocks colliding and becoming smaller and rounder", "Wave breaking", "Cliff sliding", "Sand blowing"], ans: 0 },
                { q: "What is swash?", opts: ["Wave wash moving up a beach", "Water retreating", "Deep ocean swell", "Tidal current"], ans: 0 },
                { q: "What is backwash?", opts: ["Water running back down beach under gravity", "Incoming wave", "Wind spray", "River flow"], ans: 0 },
                { q: "What is headland erosion sequence?", opts: ["Crack -> Cave -> Arch -> Stack -> Stump", "Stack -> Arch -> Cave", "Stump -> Stack -> Cave", "Bay -> Headland -> Arch"], ans: 0 },
                { q: "What is saltation in sediment transport?", opts: ["Pebbles bouncing along seabed", "Dissolved minerals", "Suspended clay", "Rolling boulders"], ans: 0 },
                { q: "What is traction?", opts: ["Large boulders rolling along river or seabed", "Bouncing", "Floating", "Dissolving"], ans: 0 },
                { q: "What is suspension?", opts: ["Fine particles carried floating in water", "Rolling", "Bouncing", "Solution"], ans: 0 },
                { q: "What is a wave-cut platform?",   opts: ["Flat rocky shelf left behind as cliff retreats", "Sandy beach", "Coral reef", "Sand dune"], ans: 0 }
              ])
            }
          ]
        },
        human: {
          title: "AQA GCSE Human Geography",
          units: [
            {
              id: "h1",
              name: "Section A: Urban Issues and Challenges",
              notes: [
                { t: "Lagos, Nigeria (Urban Case Study)", content: "Lagos is a rapidly growing megacity experiencing massive rural-urban migration, economic growth, and urban challenges.", points: ["Importance: Financial capital of West Africa, major port, and GDP engine.", "Opportunities: Formal/informal jobs, Bus Rapid Transit upgrades.", "Challenges: Makoko informal squatter settlements, waterborne disease, and traffic congestion."] }
              ],
              cards: buildCards("Urban Issues", [
                { q: "What is urbanization?", a: "The increasing proportion of a country's population living in towns and cities." },
                { q: "What is a megacity?", a: "An urban area with a total population exceeding 10 million people." },
                { q: "Name a megacity in an LIC/NEE.", a: "Lagos (Nigeria) or Rio de Janeiro (Brazil)." },
                { q: "What is rural-urban migration?", a: "The movement of people from countryside areas into cities." },
                { q: "What is natural increase?", a: "When birth rates exceed death rates in a population." },
                { q: "What is a push factor?", a: "Negative conditions in rural areas driving people away (e.g., poverty, crop failure)." },
                { q: "What is a pull factor?", a: "Positive attractions drawing migrants to cities (e.g., jobs, better healthcare)." },
                { q: "What is the informal economy?", a: "Unregulated jobs without contracts, taxes, or legal protection." },
                { q: "Name an informal settlement in Lagos.", a: "Makoko." },
                { q: "What is deindustrialization?", a: "The long-term decline of traditional manufacturing industries." },
                { q: "What is urban regeneration?", a: "Revitalizing old industrial or run-down urban areas to improve economic activity." },
                { q: "What is suburbanization?", a: "Movement of people from city centres to outer suburbs." },
                { q: "What is counter-urbanization?", a: "Movement of people out of cities into rural villages or small towns." },
                { q: "What is a sustainable urban area?", a: "A city providing green spaces, renewable energy, efficient transport, and waste recycling." },
                { q: "What is social deprivation?", a: "The degree to which an individual or community lacks basic services, income, and housing." }
              ]),
              quiz: buildQuiz("Urban Issues", [
                { q: "What is urbanization defined as?", opts: ["Growth of rural farming", "Increasing proportion of population living in urban areas", "Decline of cities", "Building motorways"], ans: 1 },
                { q: "What population threshold defines a megacity?", opts: ["1 million", "5 million", "10 million", "20 million"], ans: 2 },
                { q: "What is rural-urban migration?", opts: ["Moving from city to farm", "Moving from rural countryside to city", "Moving between countries", "Commuting"], ans: 1 },
                { q: "What is natural increase?", opts: ["Birth rates exceeding death rates", "Migration influx", "Economic growth", "Urban sprawl"], ans: 0 },

              ]),
              quiz: buildQuiz("Resource Management", [
                { q: "Why does South and East England experience water deficit?", opts: ["High population density and lower rainfall", "Too much rain", "Lack of people", "Abundant rivers"], ans: 0 },
                { q: "What is water deficit defined as?", opts: ["Demand exceeds supply", "Supply exceeds demand", "Equal water", "Flooding"], ans: 0 },
                { q: "What is food security?", opts: ["Access to safe, nutritious food", "Starvation", "Food imports only", "Fast food"], ans: 0 },
                { q: "What is desalination?", opts: ["Removing salt from seawater", "Adding salt", "Filtering mud", "Boiling sewage"], ans: 0 },

                { q: "What is organic farming?", opts: ["Farming without synthetic chemicals/pesticides", "Chemical farming", "GM crops", "Battery farming"], ans: 0 },

      function renderHeader() {
        var subHtml = '';
        var keys = ['physical', 'human'];
        var labels = { physical: 'Physical Geog', human: 'Human Geog' };
        keys.forEach(function (k) {
          subHtml += '<button class="pill-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var navHtml = '';
        var tabs = [
          { id: 'notes', label: 'Detailed Notes' },
          { id: 'study', label: 'Flashcards' },
          { id: 'quiz', label: 'Practice Quiz' }
        ];
        tabs.forEach(function (t) {
          navHtml += '<button aria-selected="' + (tab === t.id) + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
        });
        document.getElementById('tabs').innerHTML = navHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
      }

      window.toggleTheme = function() {
        theme = theme === 'dark' ? 'light' : 'dark';
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ topic: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ topic: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderNotes() {
        var html = '<div class="panel">';
        html += '<h2 style="font-family:var(--display); font-size:1.3rem; margin:0;">' + DATA[currentSubj].title + ' — Comprehensive Revision Guide</h2>';
        getFilteredUnits().forEach(function (u) {
          html += '<div style="margin-top:20px;">';
          html += '<div class="unit-title-header"><span>' + u.name + '</span><span class="unit-sub-tag">AQA GCSE</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="cognito-card">';
            html += '<h3>' + n.t + '</h3>';
            html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        if (cards.length === 0) return '<div class="panel">No flashcards available for this unit.</div>';
        var c = cards[qIdx % cards.length];
        var html = '<div class="flashcard" onclick="flipCard()">';
        html += '<div class="topic-tag"><span>' + c.topic + '</span><span>Card ' + (qIdx + 1) + ' / ' + cards.length + '</span></div>';
        html += '<div class="q-text">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="ans-text">' + c.a + '</div>';
        } else {
          html += '<div class="card-hint">Click card to reveal detailed answer</div>';
        }
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">Missed it</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">Got it</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderQuiz() {
        var quiz = getQuiz();
        if (quiz.length === 0) return '<div class="panel">No quiz questions available for this unit.</div>';
        if (quizIdx >= quiz.length) {
          var html = '<div class="panel" style="text-align:center; padding:32px;">';
          html += '<h2>Quiz Complete!</h2>';
          html += '<p style="font-size:1.1rem; margin:12px 0;">Your Score: <b>' + quizScore + ' / ' + quiz.length + '</b></p>';
          html += '<button class="btn primary" style="max-width:200px; margin:0 auto;" onclick="resetQuiz()">Try Again</button>';
          html += '</div>';
          return html;
        }

        var q = quiz[quizIdx];
        var html = '<div class="panel">';
        html += '<div class="topic-tag"><span>' + q.topic + '</span><span>Question ' + (quizIdx + 1) + ' / ' + quiz.length + '</span></div>';
        html += '<div class="q-text">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">' + opt + '</button>';
        });
        html += '</div>';
        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:12px;" onclick="nextQuiz()">Next Question</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
</body>
