<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - AQA GCSE Geography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: var(--accent-ink); }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">AQA GCSE Geography (8035)</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subjects"></div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="setTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="setTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="setTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unitSelect">Unit:</label>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'physical';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var shuffledCards = [];
      var shuffledQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      var DATA = {
        physical: {
          title: "AQA GCSE Physical Geography",
          units: [
            {
              id: "p1",
              name: "Section A: The Challenge of Natural Hazards",
              notes: [
                {
                  t: "Global Hazards & Tectonic Plate Margins",
                  content: "A natural hazard is a natural event posing a threat to human life and property. Earth's lithosphere is broken into tectonic plates moving over the asthenosphere due to mantle convection, ridge push, and slab pull.",
                  points: [
                    "Constructive (Divergent) Margins: Plates pull apart (e.g., Mid-Atlantic Ridge). Magma rises creating shield volcanoes and shallow earthquakes.",
                    "Destructive (Convergent) Margins: Denser oceanic plate subducts under continental plate (e.g., Nazca under South American plate). Creates deep ocean trenches, explosive composite volcanoes, and severe earthquakes.",
                    "Collision Margins: Two continental plates collide (e.g., Indo-Australian and Eurasian forming Himalayas). Neither subducts; crumples into fold mountains with intense earthquakes but no volcanoes.",
                    "Conservative (Transform) Margins: Plates slide past horizontally in opposite directions or speeds (e.g., San Andreas Fault). High friction builds stress until it snaps, causing severe earthquakes without volcanoes."
                  ]
                },
                {
                  t: "Earthquake Case Studies: Christchurch (HIC) vs Gorkha, Nepal (LIC)",
                  content: "Contrasting impacts and responses between developed and emerging nations.",
                  points: [
                    "Christchurch, NZ (Feb 2011, Mag 6.3): Shallow focus (5km). 185 deaths, 80% water/sewerage hit. Liquefaction damaged 10,000 homes. Fast emergency plan within 2 hours, $6-7m aid, building codes upgraded.",
                    "Gorkha, Nepal (April 2015, Mag 7.8): Shallow focus (15km). 8,841 deaths, 1m homeless. Everest avalanche killed 19. Remote mountainous terrain slowed relief; $87m aid pledged, strict codes passed years later."
                  ]
                },
                {
                  t: "Tropical Storms: Formation, Structure & Typhoon Haiyan",
                  content: "Form between 5° and 30° N/S latitude where sea surface temps exceed 26.5°C down to 50m depth.",
                  points: [
                    "Structure: Central calm 'Eye' (low pressure, sinking air), surrounded by high-wind, heavy-rain 'Eye Wall' (>120 km/h).",
                    "Typhoon Haiyan (Philippines, Nov 2013, Cat 5): 6,300 dead, 5m storm surge ruined 90% of Tacloban city. 14 million affected. Immediate aid from Red Cross; long-term 'Build Back Better' coastal mangrove planting."
                  ]
                }
              ],
              cards: [
                { q: "What occurs at a conservative plate margin?", a: "Plates slide past each other horizontally, causing friction release earthquakes without volcanic activity." },
                { q: "What minimum sea surface temperature is required for tropical storms?", a: "At least 26.5°C down to a depth of 50 metres." },
                { q: "What drives tectonic plate movement in the mantle?", a: "Convection currents, ridge push, and slab pull." },
                { q: "What type of volcano is formed at constructive margins?", a: "Shield volcanoes with gentle slopes and basic, runny lava." },
                { q: "What type of volcano is formed at destructive margins?", a: "Composite (strato) volcanoes with steep sides and explosive acidic lava." },
                { q: "What scale measures earthquake magnitude based on energy released?", a: "Moment Magnitude Scale." },
                { q: "What is the focus of an earthquake?", a: "The exact underground point where geological pressure is released." },
                { q: "What is the epicentre?", a: "The point on the Earth's surface directly above the focus." },
                { q: "Give an example of a conservative plate boundary.", a: "The San Andreas Fault in California." },
                { q: "Give an example of a destructive plate boundary.", a: "The Nazca plate subducting under the South American plate." },
                { q: "What causes primary impacts of earthquakes?", a: "Direct ground shaking causing structural collapse of buildings and bridges." },
                { q: "What causes secondary impacts of earthquakes?", a: "Aftershocks, tsunamis, fires from broken gas mains, and disease outbreaks." },
                { q: "What is an immediate response to a disaster?", a: "Actions taken right after an event to save lives, provide shelter, food, and medical aid." },
                { q: "What is a long-term response?", a: "Rebuilding infrastructure, restoring the economy, and upgrading building codes over months/years." },
                { q: "Where do tropical storms form globally?", a: "Between 5° and 30° North and South of the equator." },
                { q: "What is the calm central area of a tropical storm called?", a: "The Eye." },
                { q: "What surrounds the Eye of a tropical storm with the strongest winds?", a: "The Eye Wall." },
                { q: "How many people died in the Christchurch 2011 earthquake?", a: "185 people." },
                { q: "How many people died in the Gorkha, Nepal 2015 earthquake?", a: "8,841 people." },
                { q: "What major secondary impact hit Mt Everest during the Nepal 2015 earthquake?", a: "A massive avalanche killing 19 climbers at Base Camp." },
                { q: "What is climate change mitigation?", a: "Action taken to reduce or prevent greenhouse gas emissions (e.g. afforestation, renewables)." },
                { q: "What is climate change adaptation?", a: "Adjusting practices or infrastructure to cope with climate change impacts (e.g. sea walls, drought crops)." },
                { q: "Name a proxy source of historical climate data.", a: "Ice core samples, tree rings (dendrochronology), or ocean sediment cores." },
                { q: "What storm surge height hit Tacloban in Typhoon Haiyan?", a: "5 metres high." },
                { q: "What is slab pull?", a: "Denser oceanic crust sinking into the mantle pulled by gravity, dragging the trailing plate." }
              ],
              quiz: [
                { q: "Which plate margin involves an oceanic plate subducting under a continental plate?", opts: ["Constructive", "Destructive", "Conservative", "Collision"], ans: 1 },
                { q: "What minimum sea surface temperature is needed for tropical storms to form?", opts: ["15°C", "26.5°C", "35°C", "10°C"], ans: 1 },
                { q: "What tectonic event occurs at conservative plate margins?", opts: ["Fold mountains", "Deep ocean trenches", "Earthquakes", "Shield volcanoes"], ans: 2 },
                { q: "What is the point on the surface directly above an earthquake focus called?", opts: ["Epicentre", "Hypocentre", "Fault line", "Crater"], ans: 0 },
                { q: "Which scale measures earthquake intensity based on observed structural damage?", opts: ["Richter", "Mercalli", "Moment magnitude", "Beaufort"], ans: 1 },
                { q: "Typhoon Haiyan hit which nation in November 2013?", opts: ["Japan", "Philippines", "Haiti", "Chile"], ans: 1 },
                { q: "What force drives tectonic plate motion in the mantle?", opts: ["Ocean currents", "Convection currents", "Wind patterns", "Earth rotation"], ans: 1 },
                { q: "Which plate margin continuously creates new oceanic crust?", opts: ["Constructive", "Destructive", "Conservative", "Collision"], ans: 0 },
                { q: "What is classified as a secondary impact of a tropical storm?", opts: ["Tsunami / Disease outbreak", "Immediate wind roof damage", "Building destruction", "Initial storm surge wave"], ans: 0 },
                { q: "What is a primary hazard associated with volcanic eruptions?", opts: ["Pyroclastic flow", "Economic recession", "Homelessness", "Long-term tourism loss"], ans: 0 },
                { q: "In which ocean basin do hurricanes specifically occur?", opts: ["Atlantic", "Arctic", "Indian", "Southern"], ans: 0 },
                { q: "What weather condition characterizes the eye of a tropical storm?", opts: ["Light winds and low pressure with sinking air", "Violent rain squalls", "Highest wind speeds", "Torrential hail"], ans: 0 },
                { q: "What is climate change mitigation?", opts: ["Reducing greenhouse gas emissions", "Building higher sea walls", "Relocating coastal towns", "Air conditioning installation"], ans: 0 },
                { q: "Which satellite technology tracks tropical storm pathways?", opts: ["Geostationary weather satellites", "Seismometers", "Clinometers", "Barometers"], ans: 0 },
                { q: "What layers compose a composite volcano?", opts: ["Alternating layers of ash and viscous lava", "Pure runny basalt lava", "Sand dunes", "Granite blocks"], ans: 0 },
                { q: "How many deaths resulted from the 2011 Christchurch earthquake?", opts: ["185", "10,000", "8,841", "50"], ans: 0 },
                { q: "What phenomenon turned solid soil into liquid mud in Christchurch?", opts: ["Soil liquefaction", "Landslide", "Solifluction", "Pyroclastic flow"], ans: 0 },
                { q: "What caused high casualties in Nepal's 2015 earthquake compared to New Zealand?", opts: ["Unreinforced masonry buildings and poor infrastructure", "Higher sea levels", "Better emergency planning", "Tsunami waves"], ans: 0 },
                { q: "Which landform is created when two continental plates collide?", opts: ["Fold mountains", "Ocean trench", "Shield volcano", "Rift valley"], ans: 0 },
                { q: "What is slab pull?", opts: ["Gravitational pull on subducting cold oceanic plates", "Wind pushing continents", "Magma pushing plates apart", "Tidal forces"], ans: 0 },
                { q: "What is the global latitude distribution of hot deserts?", opts: ["15° to 30° N/S of equator", "On the equator", "Polar circles", "45° to 60° N/S"], ans: 0 },
                { q: "What evidence of past climate change is extracted from ice sheets?", opts: ["Trapped oxygen isotopes and atmospheric gas bubbles", "Fossil fuels", "Tree rings", "Volcanic dust only"], ans: 0 },
                { q: "What adaptation helps plants survive in tropical rainforest canopy?", opts: ["Drip-tip leaves to shed heavy rainfall", "Thick succulent stems", "Needle leaves", "Deep taproots"], ans: 0 },
                { q: "Which international agreement aims to limit global warming below 2°C?", opts: ["Paris Agreement", "Kyoto Protocol", "Geneva Convention", "Montreal Protocol"], ans: 0 },
                { q: "What is an immediate response to Typhoon Haiyan?", opts: ["Deploying Red Cross food packages and water purification tablets", "Replanting mangroves", "Building new permanent housing", "Upgrading national warning systems"], ans: 0 }
              ]
            },
            {
              id: "p2",
              name: "Section B: The Living World (Ecosystems & Deserts)",
              notes: [
                {
                  t: "Ecosystems & Gersmehl Nutrient Models",
                  content: "An ecosystem comprises biotic organisms interacting with abiotic environment factors. The Gersmehl model tracks nutrient flows between Biomass, Litter, and Soil stores.",
                  points: [
                    "Rainforest Gersmehl Model: Biomass is the largest store. Hot, humid climate causes rapid bacterial decay of Litter into Soil. Convectional rains cause heavy leaching, leaving thin infertile soil.",
                    "Hot Desert Gersmehl Model: Litter store is tiny due to minimal plant cover. Soil is largest store but low in humus. Low rainfall prevents leaching."
                  ]
                },

      function renderHeader() {
        var subHtml = '';
        var keys = ['physical', 'human'];
        var labels = { physical: 'Physical Geog', human: 'Human Geog' };
        keys.forEach(function (k) {
          subHtml += '<button class="subj-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = isDark ? 'Dark Mode' : 'Light Mode';
      }

      window.toggleTheme = function() {
        isDark = !isDark;
        if (!isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      function initSessionData() {
        var rawCards = [];
        var rawQuiz = [];
        var units = DATA[currentSubj].units;
        var filtered = currentUnit === 'all' ? units : units.filter(function(u) { return u.id === currentUnit; });

        filtered.forEach(function(u) {
          u.cards.forEach(function(c) {
            rawCards.push({ unitName: u.name, q: c.q, a: c.a });
          });
          u.quiz.forEach(function(q) {
            rawQuiz.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });

        shuffledCards = shuffleArray(rawCards);
        shuffledQuiz = shuffleArray(rawQuiz);
      }

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        if (t === 'study' || t === 'quiz') {
          initSessionData();
          qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0;
        }
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + t);
        });
        render();
      };

      function renderNotes() {
        var units = currentUnit === 'all' ? DATA[currentSubj].units : DATA[currentSubj].units.filter(function(u) { return u.id === currentUnit; });
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">AQA GCSE 8035</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (shuffledCards.length === 0) initSessionData();

        if (qIdx >= shuffledCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You have reviewed all <b>' + shuffledCards.length + '</b> unique flashcards for this selection.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = shuffledCards[qIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (qIdx + 1) + ' of ' + shuffledCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        if (e) e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      window.resetFlashcards = function () {
        qIdx = 0;
        flipped = false;
        shuffledCards = shuffleArray(shuffledCards);
        render();
      };

      function renderQuiz() {
        if (shuffledQuiz.length === 0) initSessionData();

        if (quizIdx >= shuffledQuiz.length) {
          var pct = Math.round((quizScore / shuffledQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + shuffledQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = shuffledQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + shuffledQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === shuffledQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        shuffledQuiz = shuffleArray(shuffledQuiz);
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (!main) return;
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      initSessionData();
      render();
    })();
  </script>
