<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - OCR GCSE Information Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent-sys: #3b82f6;
      --accent-data: #10b981;
      --accent-sec: #f59e0b;
      --accent: #3b82f6;
      --accent-ink: #ffffff;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent-sys: #2563eb;
      --accent-data: #059669;
      --accent-sec: #d97706;
      --accent: #2563eb;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn[data-subj="sys"].active { background: var(--accent-sys); color: #fff; }
    .subj-btn[data-subj="data"].active { background: var(--accent-data); color: #fff; }
    .subj-btn[data-subj="sec"].active { background: var(--accent-sec); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">OCR GCSE Information Technology</span>
      </div>
      <div class="controls-top">
        <a href="index.html" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="sys" onclick="switchSubject('sys')">IT Systems</button>
          <button class="subj-btn" data-subj="data" onclick="switchSubject('data')">Data & Spreadsheets</button>
          <button class="subj-btn" data-subj="sec" onclick="switchSubject('sec')">Security & Ethics</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'sys';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var SPEC_DATA = {
        sys: {
          title: "IT Systems, Hardware & Software",
          color: "#3b82f6",
          units: [
            {
              id: "it_hardware",
              code: "IT1",
              name: "Unit 1: Hardware, Software & User Interfaces",
              notes: [
                {
                  t: "Hardware Components & Peripherals",
                  content: "Hardware is the physical, touchable components of a computer system. Examiner tip: Always distinguish between input, output, and storage devices clearly in 6-mark questions.",
                  bullets: [
                    "Input Devices: Devices used to enter data into a computer (e.g., keyboard, mouse, barcode scanner, touchscreen, microphones, and biometric sensors).",
                    "Output Devices: Devices that present processed data to the user (e.g., monitors/screens, speakers, inkjet/laser printers, and actuators in control systems).",
                    "Storage Devices: Secondary storage media required for non-volatile data retention (Magnetic hard drives, Solid State Drives (SSDs), and Optical discs like DVDs/Blu-rays)."
                  ]
                },
                {
                  t: "Systems Software vs Applications Software",
                  content: "Software consists of instructions that tell the computer hardware what to do. It is split into two major categories:",
                  bullets: [
                    "Operating Systems (OS): Manages hardware resources, provides a user interface (UI), handles multitasking via memory management, and controls peripheral devices through drivers.",
                    "Utility Software: Maintenance programs designed to configure, optimize, or safeguard the system (e.g., antivirus scanners, disk defragmenters, backup utilities, and compression tools).",
                    "Applications Software: Programs that allow users to perform specific productivity or personal tasks (e.g., word processors, spreadsheets, web browsers, and desktop publishing software)."
                  ]
                },
                {
                  t: "User Interfaces (UIs)",
                  content: "The bridge between human users and computer systems. Different interfaces suit different user expertise levels:",
                  bullets: [
                    "Graphical User Interface (GUI): Visual, menu-driven interfaces using WIMP (Windows, Icons, Menus, Pointers). Easy for beginners but resource-heavy.",
                    "Command Line Interface (CLI): Text-based interface requiring exact typed commands. Fast and lightweight for expert administrators, but has a steep learning curve.",
                    "Natural Language & Touch Interfaces: Voice-activated systems (smart assistants) or touch screens designed for intuitive mobile and accessibility use."
                  ]
                }
              ],
              cards: [
                { q: "What is hardware?", a: "The physical, touchable components of a computer system (e.g., CPU, monitor, keyboard)." },
                { q: "What is software?", a: "The programs and data instructions that tell the computer hardware what tasks to perform." },
                { q: "What is an Operating System (OS)?", a: "System software that manages hardware resources, memory, user accounts, and provides a user interface." },
                { q: "What is utility software?", a: "Maintenance software designed to keep the system running efficiently and securely (e.g., antivirus, backup tools)." },
                { q: "What is a Graphical User Interface (GUI)?", a: "A visual interface utilizing WIMP (Windows, Icons, Menus, Pointers) for user interaction." },
                { q: "What is a Command Line Interface (CLI)?", a: "A text-based interface where users type specific commands to execute tasks." },
                { q: "What is an input device?", a: "Hardware used to capture and enter data into a computer system (e.g., microphone, keyboard, scanner)." },
                { q: "What is an output device?", a: "Hardware that displays or communicates processed data back to the user (e.g., monitor, speaker, printer)." },
                { q: "What is non-volatile storage?", a: "Storage that retains data even when the computer's power is turned off (e.g., SSD, HDD, Flash memory)." },
                { q: "What is volatile storage?", a: "Temporary memory that loses all data when power is lost (e.g., RAM)." },
                { q: "What is a device driver?", a: "System software that allows the operating system to communicate with connected hardware peripherals." },
                { q: "What is applications software?", a: "Programs designed to help users complete specific everyday tasks like word processing or web browsing." },
                { q: "What is a touchscreen?", a: "A dual-purpose peripheral device functioning as both an input and an output device." },
                { q: "What is a biometric sensor?", a: "An input device used for identification by scanning physical human characteristics (e.g., fingerprint, iris scan)." },
                { q: "What is RAM?", a: "Random Access Memory; fast, volatile main memory holding currently running programs and open data." },
                { q: "What is ROM?", a: "Read-Only Memory; non-volatile memory holding essential boot-up instructions (BIOS)." },
                { q: "What is multitasking?", a: "The ability of an operating system to execute multiple programs concurrently by allocating CPU time slices." },
                { q: "What is open-source software?", a: "Software where the source code is freely available for anyone to inspect, modify, and distribute." },
                { q: "What is proprietary software?", a: "Closed-source software owned by a company where users purchase licenses and cannot modify code." },
                { q: "What is an actuator?", a: "An output device controlled by a computer to produce physical movement (e.g., valves, motors in automated systems)." },
                { q: "What is data logging?", a: "The automatic collection and recording of sensor measurements over time without continuous human supervision." },
                { q: "What is optical storage?", a: "Storage media read using lasers, such as CDs, DVDs, and Blu-ray discs." },
                { q: "What is magnetic storage?", a: "Storage media using magnetized platters, such as traditional Hard Disk Drives (HDDs)." },
                { q: "What is solid-state storage?", a: "Storage using flash memory chips with no moving parts, offering fast read/write speeds (e.g., SSDs, USB sticks)." },
                { q: "What is system maintenance?", a: "Regular tasks like disk cleanup, updates, and virus scans to ensure optimal computer performance." }
              ],
              quiz: [
                { q: "Which of the following is classified as an input device?", opts: ["Monitor", "Speaker", "Barcode scanner", "Plotter"], ans: 2, exp: "Barcode scanners capture data and input it into the system." },
                { q: "What is the primary function of an Operating System?", opts: ["To write web pages", "To manage computer hardware and software resources", "To print documents in color", "To protect against power surges"], ans: 1, exp: "The OS acts as the core manager between applications and physical hardware." },
                { q: "Which software type is designed to protect a computer against malicious viruses?", opts: ["Word processor", "Utility software", "Spreadsheet application", "Web browser"], ans: 1, exp: "Antivirus programs are utility tools used for system security and maintenance." },
                { q: "What does GUI stand for?", opts: ["General User Integration", "Graphical User Interface", "Global Utility Index", "Guided User Interaction"], ans: 1, exp: "GUI stands for Graphical User Interface, featuring visual WIMP elements." },
                { q: "Which memory type loses its contents when power is switched off?", opts: ["ROM", "Hard disk", "RAM", "Solid State Drive"], ans: 2, exp: "RAM is volatile memory; data is wiped when powered down." },
                { q: "Why would an expert IT administrator prefer a Command Line Interface?", opts: ["It is colorful and uses mouse clicks", "It requires no typing", "It is fast, lightweight, and efficient for batch tasks", "It has animated icons"], ans: 2, exp: "CLIs consume fewer system resources and execute commands rapidly." },
                { q: "Which device acts as both an input and an output device?", opts: ["Keyboard", "Touchscreen", "Projector", "Speaker"], ans: 1, exp: "Touchscreens display visual output while sensing touch input." },
                { q: "What is proprietary software?", opts: ["Software with open-source code", "Software owned exclusively by a company with restricted copyright", "Free software for public use", "Freeware games"], ans: 1, exp: "Proprietary software restricts modification and source code access." },
                { q: "What is the main advantage of Solid State Drives (SSDs) over Hard Disk Drives (HDDs)?", opts: ["Cheaper per gigabyte", "No moving parts, faster access, and durability", "Higher physical weight", "Uses magnetic platters"], ans: 1, exp: "SSDs use flash memory with no moving parts, making them faster and quieter." },
                { q: "What is a device driver?", opts: ["A person driving a delivery van", "System software enabling communication between OS and hardware", "An application for typing letters", "A graphics card cooling fan"], ans: 1, exp: "Drivers translate OS commands into instructions hardware understands." },
                { q: "Which storage medium uses microscopic pits and lands read by a laser?", opts: ["Magnetic tape", "Optical disc", "SSD", "RAM"], ans: 1, exp: "CDs, DVDs, and Blu-rays use optical laser technology." },
                { q: "What is multitasking in an operating system?", opts: ["Running only one program very slowly", "Switching CPU tasks rapidly to give the illusion of simultaneous execution", "Having multiple screens attached", "Using multiple keyboards"], ans: 1, exp: "The OS allocates time slices so multiple tasks appear to run at once." },
                { q: "Which of the following is an example of applications software?", opts: ["Windows 11", "Microsoft Excel", "Disk Defragmenter", "Device Driver"], ans: 1, exp: "Excel is productivity software used to create spreadsheets." },
                { q: "What is the purpose of ROM in a computer system?", opts: ["To store user documents", "To hold boot-up instructions (BIOS) permanently", "To speed up video games", "To run virus scans"], ans: 1, exp: "ROM is non-volatile and stores permanent startup routines." },
                { q: "What is an actuator used for in automated systems?", opts: ["To measure temperature", "To convert control signals into physical movement", "To type text documents", "To display images"], ans: 1, exp: "Actuators perform physical actions like turning valves or motors." },
                { q: "Which interface is generally most suitable for novice, everyday computer users?", opts: ["Command Line Interface", "Graphical User Interface", "Batch Interface", "Hexadecimal prompt"], ans: 1, exp: "GUIs use intuitive visual icons and menus for ease of use." },
                { q: "What does volatile memory mean?", opts: ["Memory that retains data permanently", "Memory that requires regular cleaning", "Memory that is erased when power is lost", "Memory made of glass"], ans: 2, exp: "Volatile memory requires continuous electrical power to store data." },
                { q: "Which input device is best suited for scanning automated stock prices at a supermarket checkout?", opts: ["Microphone", "Barcode reader", "Graphics tablet", "Webcam"], ans: 1, exp: "Barcode readers optically scan product codes rapidly at checkout." },

      window.toggleTheme = function () {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('theme-btn').innerText = 'Dark Mode';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.getElementById('theme-btn').innerText = 'Light Mode';
        }
      };

      window.switchSubject = function (subjKey) {
        currentSubj = subjKey;
        currentUnit = 'all';
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;

        document.querySelectorAll('.subj-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-subj') === subjKey);
        });

        document.documentElement.style.setProperty('--accent', SPEC_DATA[subjKey].color);
        updateUnitDropdown();
        render();
      };

      window.switchUnit = function (unitVal) {
        currentUnit = unitVal;
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        render();
      };

      window.switchTab = function (tabKey) {
        currentTab = tabKey;
        flipped = false;
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + tabKey);
        });
        render();
      };

      function updateUnitDropdown() {
        var select = document.getElementById('unit-select');
        var html = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        if (SPEC_DATA[currentSubj] && SPEC_DATA[currentSubj].units) {
          SPEC_DATA[currentSubj].units.forEach(function (u) {
            html += '<option value="' + u.id + '">' + u.name + '</option>';
          });
        }
        select.innerHTML = html;
        select.value = currentUnit;
      }

      function getFilteredUnits() {
        if (!SPEC_DATA[currentSubj]) return [];
        var units = SPEC_DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getFilteredCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          if (u.cards) {
            u.cards.forEach(function (c) {
              list.json ? null : list.push({ unitName: u.name, q: c.q, a: c.a });
            });
          }
        });
        return list;
      }

      function getFilteredQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          if (u.quiz) {
            u.quiz.forEach(function (q) {
              list.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
            });
          }
        });
        return list;
      }

      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">OCR GCSE IT</span></div>';
          if (u.notes) {
            u.notes.forEach(function (n) {
              html += '<div class="note-block">';
              html += '<h4>' + n.t + '</h4>';
              if (n.content) html += '<p>' + n.content + '</p>';
              if (n.bullets && n.bullets.length) {
                html += '<ul>';
                n.bullets.forEach(function (b) {
                  html += '<li>' + b + '</li>';
                });
                html += '</ul>';
              }
              html += '</div>';
            });
          }
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getFilteredCards();
        if (cards.length === 0) return '<div class="unit-panel">No flashcards available for this filter.</div>';

        var c = cards[flashIdx % cards.length];

        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + cards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      function renderQuiz() {
        var quizList = getFilteredQuiz();
        if (quizList.length === 0) return '<div class="unit-panel">No quiz questions available for this unit filter.</div>';

        if (quizIdx >= quizList.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + quizScore + ' / ' + quizList.length + '</div>';
          html += '<p>Fantastic job revising your OCR GCSE Information Technology material!</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = quizList[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + quizList.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === getFilteredQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (!main) return;
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      updateUnitDropdown();
      render();
    })();
  </script>
</body>
</html>
