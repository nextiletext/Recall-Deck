<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0d1318;
      --surface: #141c24;
      --surface-card: #19232c;
      --surface-hover: #212e3a;
      --ink: #e8edf0;
      --muted: #8a9ba8;
      --line: #24323e;
      --accent: #a855f7;
      --accent-ink: #ffffff;
      --online: #10b981;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --surface-card: #ffffff;
      --surface-hover: #e2e8f0;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #9333ea;
      --accent-ink: #ffffff;
      --online: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.5;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
    }

    .brand .sub {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
      display: block;
    }

    .mode-btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .mode-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Compact 2-column Central Grid */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .portal-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 10px;
      color: var(--ink);
      text-decoration: none;
      transition: all 0.2s ease;
      min-height: 84px;
    }

    .portal-card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .portal-card .subj-title {
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1.25;
      color: var(--ink);
    }

    .portal-card .board-tag {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Full-width span for T-Level card */
    .portal-card.full-width {
      grid-column: span 2;
    }

    /* Status Banner at bottom */
    .status-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--online);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--online);
    }

    @media (max-width: 360px) {
      .link-grid {
        grid-template-columns: 1fr;
      }
      .portal-card.full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-box">
      <div class="header-row">
        <div class="brand">
          <h1>Recall Deck - RCS</h1>
          <span class="sub">GCSE Revision Portal</span>
        </div>
        <button class="mode-btn" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
      </div>

      <div class="link-grid">
        <a href="compsci.html" class="portal-card">
          <span class="subj-title">Computer Science</span>
          <span class="board-tag">OCR J277</span>
        </a>

        <a href="geography.html" class="portal-card">
          <span class="subj-title">Geography</span>
          <span class="board-tag">AQA</span>
        </a>

        <a href="dt.html" class="portal-card">
          <span class="subj-title">Design & Tech</span>
          <span class="board-tag">AQA</span>
        </a>

        <a href="science.html" class="portal-card">
          <span class="subj-title">Science</span>
          <span class="board-tag">OCR B 21st Cent</span>
        </a>

        <a href="re.html" class="portal-card">
          <span class="subj-title">Religious Ed</span>
          <span class="board-tag">WJEC Eduqas</span>
        </a>

        <a href="maths.html" class="portal-card">
          <span class="subj-title">Mathematics</span>
          <span class="board-tag">Edexcel</span>
        </a>

        <a href="psychology.html" class="portal-card">
          <span class="subj-title">Psychology</span>
          <span class="board-tag">Edexcel</span>
        </a>

        <a href="it.html" class="portal-card">
          <span class="subj-title">Information Tech</span>
          <span class="board-tag">OCR</span>
        </a>

        <a href="https://nextiletext.github.io/Recall-Deck-SE/" class="portal-card full-width">
          <span class="subj-title">Software Development</span>
          <span class="board-tag">T Level</span>
        </a>
      </div>

      <div class="status-banner">
        <span class="status-dot"></span>
        <span>To report any issues please email:
            @contact.nextile01@gmail.com</span>
      </div>
    </div>
  </div>

  <script>
    var theme = 'dark';
    function toggleTheme() {
      theme = theme === 'dark' ? 'light' : 'dark';
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeBtn').textContent = 'Dark Mode';
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeBtn').textContent = 'Light Mode';
      }
    }
  </script>
</body>
</html>
