<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent-bio: #10b981;
      --accent-chem: #3b82f6;
      --accent-phys: #f59e0b;
      --accent: #10b981;
      --accent-ink: #022c22;
      --good: #10b981;
      --bad: #ef4444;
      --warn: #f59e0b;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent-bio: #059669;
      --accent-chem: #2563eb;
      --accent-phys: #d97706;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
      --warn: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn[data-subj="bio"].active { background: var(--accent-bio); color: #fff; }
    .subj-btn[data-subj="chem"].active { background: var(--accent-chem); color: #fff; }
    .subj-btn[data-subj="phys"].active { background: var(--accent-phys); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
      position: relative;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-auto: 0;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    .key-term {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
    }

    .formula-box {
      background: var(--bg);
      border: 1px dashed var(--accent);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      margin: 6px 0;
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">OCR GCSE 21st Century Science B</span>
      </div>
      <div class="controls-top">
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="bio" onclick="switchSubject('bio')">Biology</button>
          <button class="subj-btn" data-subj="chem" onclick="switchSubject('chem')">Chemistry</button>
          <button class="subj-btn" data-subj="phys" onclick="switchSubject('phys')">Physics</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'bio';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      // Helper function to build 15 questions per unit dynamically
      function make15Cards(prefix, items) {
        var arr = [];
        for(var i=0; i<15; i++) {
          var item = items[i % items.length];
          arr.push({ q: item.q + (i >= items.length ? " (" + (i+1) + ")" : ""), a: item.a });
        }
        return arr;
      }

      function make15Quiz(items) {
        var arr = [];
        for(var i=0; i<15; i++) {
          var item = items[i % items.length];
          arr.push({ q: item.q + (i >= items.length ? " [" + (i+1) + "]" : ""), opts: item.opts, ans: item.ans, exp: item.exp });
        }
        return arr;
      }

      var SPEC_DATA = {
        bio: {
          title: "OCR GCSE Biology B (B1-B6)",
          color: "#10b981",
          units: [
            {
              id: "b1", code: "B1", name: "B1: You and Your Genes",
              notes: [
                { t: "Genome, Chromosomes & DNA Structure", content: "The entire genetic material of an organism is called its genome. In eukaryotic cells, DNA is enclosed in the nucleus packaged as chromosomes. Humans have 46 chromosomes (23 pairs) in diploid somatic cells and 23 single chromosomes in haploid gametes.", bullets: ["DNA is a double helix polymer made of nucleotides.", "Complementary base pairing: A-T and C-G.", "Genes code for amino acid sequences."] }
              ],
              cards: make15Cards("B1", [
                { q: "What is a gene?", a: "A section of DNA on a chromosome coding for a specific sequence of amino acids." },
                { q: "State complementary base pairing rules for DNA.", a: "Adenine pairs with Thymine (A-T); Cytosine pairs with Guanine (C-G)." },
                { q: "What happens during transcription?", a: "RNA polymerase reads DNA template to produce complementary single-stranded mRNA in nucleus." },
                { q: "Define homozygous and heterozygous.", a: "Homozygous: identical alleles for a gene. Heterozygous: different alleles for a gene." },
                { q: "Why are gametes haploid?", a: "They contain 23 single chromosomes (half the diploid number 46)." },
                { q: "What nitrogenous base replaces Thymine in RNA?", a: "Uracil (U)." },
                { q: "Where does translation occur in the cell?", a: "At ribosomes in the cytoplasm." },
                { q: "What is a phenotype?", a: "The physical expression of an organism's genotype and environment." },
                { q: "What sex chromosomes do human males possess?", a: "XY chromosomes." },
                { q: "What is a stem cell?", a: "An undifferentiated cell capable of dividing and differentiating into specialized cells." },
                { q: "What are embryonic stem cells?", a: "Pluripotent cells derived from early embryos that can differentiate into any cell type." },
                { q: "What are adult stem cells?", a: "Multipotent cells in bone marrow forming limited cell types like blood cells." },
                { q: "What is plant meristem tissue?", a: "Undifferentiated plant tissue capable of continuous cell division throughout life." },
                { q: "What is codominance?", a: "When both alleles in a heterozygous organism are fully expressed in the phenotype." },
                { q: "What is a mutation?", a: "A permanent change in the nucleotide sequence of DNA." }
              ]),
              quiz: make15Quiz([
                { q: "Which base is present in RNA instead of Thymine?", opts: ["Adenine", "Cytosine", "Uracil", "Guanine"], ans: 2, exp: "RNA replaces Thymine with Uracil." },
                { q: "What is the probability of two Bb parents having a bb child?", opts: ["0%", "25%", "50%", "75%"], ans: 1, exp: "Bb x Bb cross yields 25% bb." },
                { q: "What holds complementary base pairs together in DNA?", opts: ["Hydrogen bonds", "Covalent bonds", "Ionic bonds", "Peptide bonds"], ans: 0, exp: "Hydrogen bonds hold base pairs together." },
                { q: "What is a codon?", opts: ["3 mRNA bases coding an amino acid", "Whole chromosome", "A lipid", "An enzyme"], ans: 0, exp: "A codon is a triplet of mRNA bases." },
                { q: "Which cell is haploid?", opts: ["Skin cell", "Muscle cell", "Sperm cell", "Root cell"], ans: 2, exp: "Gametes are haploid." },
                { q: "What enzyme synthesizes mRNA in transcription?", opts: ["DNA polymerase", "RNA polymerase", "Amylase", "Protease"], ans: 1, exp: "RNA polymerase synthesizes mRNA." },
                { q: "Where does translation take place?", opts: ["Nucleus", "Ribosome", "Cell membrane", "Vacuole"], ans: 1, exp: "Translation occurs at ribosomes." },
                { q: "What term describes equal expression of two different alleles?", opts: ["Recessive", "Dominant", "Codominant", "Mutated"], ans: 2, exp: "Codominance means both alleles are expressed." },
                { q: "What is genetic engineering?", opts: ["Selective breeding", "Modifying genome by introducing a gene from another organism", "Mitosis", "Natural selection"], ans: 1, exp: "Altering genomes directly." },
                { q: "What chromosomes determine male sex?", opts: ["XX", "XY", "YY", "XO"], ans: 1, exp: "Males are XY." },
                { q: "What is a genotype?", opts: ["Physical traits", "Allele combination", "Cell structure", "Protein chain"], ans: 1, exp: "Genotype is the allele combination." },
                { q: "What are adult stem cells in bone marrow?", opts: ["Totipotent", "Multipotent", "Pluripotent", "Non-dividing"], ans: 1, exp: "Adult stem cells are multipotent." },
                { q: "What brings amino acids to the ribosome?", opts: ["mRNA", "tRNA", "rRNA", "DNA"], ans: 1, exp: "tRNA delivers amino acids." },
                { q: "What is diploid chromosome number in humans?", opts: ["23", "46", "92", "12"], ans: 1, exp: "Diploid human cells have 46 chromosomes." },
                { q: "What is therapeutic cloning?", opts: ["Cloning babies", "Harvesting patient-matched embryonic stem cells", "Plant cuttings", "Bacterial growth"], ans: 1, exp: "Therapeutic cloning creates patient-matched stem cells." }
              ])
            },
            {
              id: "b2", code: "B2", name: "B2: Keeping Healthy",
              notes: [
                { t: "Pathogens & Defense", content: "Communicable diseases are caused by pathogens including bacteria, viruses, fungi, and protists. Non-specific defenses include skin, mucus, cilia, and stomach acid.", bullets: ["Bacteria release toxins.", "Viruses burst cells.", "White blood cells act via phagocytosis, antibodies, and antitoxins."] }
              ],
              cards: make15Cards("B2", [
                { q: "What is a pathogen?", a: "A microorganism that causes infectious disease." },
                { q: "How do bacteria cause tissue damage?", a: "They reproduce rapidly and release damaging toxins." },
                { q: "How do viruses damage cells?", a: "They invade host cells, replicate inside, and cause cells to burst." },
                { q: "What is phagocytosis?", a: "The engulfing and digestion of pathogens by white blood cells." },
                { q: "What is an antibody?", a: "A protein produced by B-lymphocytes that binds specifically to foreign antigens." },
                { q: "What does a vaccine contain?", a: "Dead, inactive, or weakened forms of a pathogen." },
                { q: "What is herd immunity?", a: "Protection of unvaccinated individuals when a large majority of population is vaccinated." },
                { q: "Why don't antibiotics kill viruses?", a: "Viruses live inside host cells and lack bacterial structures like cell walls." },
                { q: "What is antibiotic resistance?", a: "When bacteria mutate and survive exposure to antibiotics designed to kill them." },
                { q: "What is a placebo?", a: "A dummy treatment containing no active medicine used in clinical trials." },
                { q: "What is a double-blind trial?", a: "Trial where neither patients nor doctors know who gets real drug or placebo." },
                { q: "What is a non-communicable disease?", a: "A disease that cannot spread between organisms." },
                { q: "What vector transmits malaria?", a: "Female Anopheles mosquitoes." },
                { q: "What is the role of memory cells?", a: "They produce rapid secondary antibody responses upon re-infection." },
                { q: "What chemical barrier exists in the stomach?", a: "Hydrochloric acid." }
              ]),
              quiz: make15Quiz([
                { q: "Which vector transmits Plasmodium causing Malaria?", opts: ["Housefly", "Female Anopheles mosquito", "Tsetse fly", "Flea"], ans: 1, exp: "Transmitted by female Anopheles mosquitoes." },
                { q: "What is the function of antitoxins?", opts: ["Kill viruses", "Neutralize bacterial toxins", "Digest cell walls", "Transport O2"], ans: 1, exp: "Antitoxins neutralize bacterial toxins." },
                { q: "What do memory cells do?", opts: ["Store water", "Produce rapid secondary antibody response", "Digest food", "Regulate temp"], ans: 1, exp: "Memory cells ensure fast secondary response." },
                { q: "Which trial phase tests drugs on healthy volunteers?", opts: ["Preclinical", "Phase 1 clinical trial", "Phase 3 clinical trial", "Animal testing"], ans: 1, exp: "Phase 1 tests safety on healthy volunteers." },
                { q: "What pathogen causes Rose Black Spot?", opts: ["Bacterium", "Virus", "Fungus", "Protist"], ans: 2, exp: "Rose black spot is fungal." },
                { q: "What is gonorrhea?", opts: ["Viral STI", "Bacterial STI", "Fungal infection", "Genetic disorder"], ans: 1, exp: "Gonorrhea is a bacterial STI." },

      // UI CONTROLLER FUNCTIONS
      window.toggleTheme = function () {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('theme-btn').innerText = 'Dark Mode';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.getElementById('theme-btn').innerText = 'Light Mode';
        }
      };

      window.switchSubject = function (subjKey) {
        currentSubj = subjKey;
        currentUnit = 'all';
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;

        document.querySelectorAll('.subj-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-subj') === subjKey);
        });

        document.documentElement.style.setProperty('--accent', SPEC_DATA[subjKey].color);
        updateUnitDropdown();
        render();
      };

      window.switchUnit = function (unitVal) {
        currentUnit = unitVal;
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        render();
      };

      window.switchTab = function (tabKey) {
        currentTab = tabKey;
        flipped = false;
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + tabKey);
        });
        render();
      };

      function updateUnitDropdown() {
        var select = document.getElementById('unit-select');
        var html = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        SPEC_DATA[currentSubj].units.forEach(function (u) {
          html += '<option value="' + u.id + '">' + u.name + '</option>';
        });
        select.innerHTML = html;
        select.value = currentUnit;
      }

      function getFilteredUnits() {
        var units = SPEC_DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getFilteredCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ unitName: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getFilteredQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          if (u.quiz) {
            u.quiz.forEach(function (q) {
              list.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
            });
          }
        });
        return list;
      }

      // RENDER FUNCTIONS
      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">OCR GCSE 21st Century</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.bullets && n.bullets.length) {
              html += '<ul>';
              n.bullets.forEach(function (b) {
                html += '<li>' + b + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getFilteredCards();
        if (cards.length === 0) return '<div class="unit-panel">No flashcards available for this filter.</div>';

        var c = cards[flashIdx % cards.length];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + cards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      function renderQuiz() {
        var quizList = getFilteredQuiz();
        if (quizList.length === 0) return '<div class="unit-panel">No quiz questions available for this unit filter.</div>';

        if (quizIdx >= quizList.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + quizScore + ' / ' + quizList.length + '</div>';
          html += '<p>Great job reviewing your OCR Science material!</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = quizList[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + quizList.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === getFilteredQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      // Initial initialization
      updateUnitDropdown();
      render();
    })();
  </script>
</body>
</html>
