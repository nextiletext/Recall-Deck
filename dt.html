<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - AQA GCSE Design & Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent-core: #f97316;
      --accent-mat: #eab308;
      --accent-des: #06b6d4;
      --accent: #f97316;
      --accent-ink: #ffffff;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent-core: #ea580c;
      --accent-mat: #ca8a04;
      --accent-des: #0891b2;
      --accent: #ea580c;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn[data-subj="core"].active { background: var(--accent-core); color: #fff; }
    .subj-btn[data-subj="mat"].active { background: var(--accent-mat); color: #fff; }
    .subj-btn[data-subj="des"].active { background: var(--accent-des); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">AQA GCSE Design & Technology (8552)</span>
      </div>
      <div class="controls-top">
        <a href="index.html" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="core" onclick="switchSubject('core')">Core Technical</button>
          <button class="subj-btn" data-subj="mat" onclick="switchSubject('mat')">Specialist Materials</button>
          <button class="subj-btn" data-subj="des" onclick="switchSubject('des')">Designing & Making</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'core';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var SPEC_DATA = {
        core: {
          title: "Section 3.1: Core Technical Principles",
          color: "#f97316",
          units: [
            {
              id: "dt_core",
              code: "DT1",
              name: "Unit 1: Systems, Smart Materials & Sustainability",
              notes: [
                {
                  t: "New and Emerging Technologies (AQA 3.1.1)",
                  content: "AQA requires knowledge of industry developments and their impact on work, society, and the environment:",
                  bullets: [
                    "Automation & Robotics: Modern factories use Computer Integrated Manufacturing (CIM). While this improves precision and 24/7 output, it causes de-skilling and job displacement.",
                    "Enterprise & Industry: Small scale start-ups use crowd funding (e.g. Kickstarter) and virtual marketing to bypass traditional high-street retail costs.",
                    "The 6 Rs: Rethink, Reuse, Recycle, Repair, Reduce, Refuse. Life Cycle Assessments (LCA) audit environmental impact from raw extraction through to end-of-life disposal."
                  ]
                },
                {
                  t: "Energy Generation & Storage Systems (AQA 3.1.2 & 3.1.5)",
                  content: "Understanding power generation and electronic systems:",
                  bullets: [
                    "Energy Sources: Fossil fuels (coal, gas) vs Renewables (solar PV, wind, hydro, geothermal). Nuclear provides reliable baseload power but creates radioactive waste.",
                    "Systems Architecture: Inputs (sensors like LDRs, thermistors), Process (microcontrollers like PICs), and Outputs (buzzers, LEDs, actuators).",
                    "Mechanical Devices: Motion types (Rotary, Linear, Reciprocating, Oscillating). Mechanical Advantage (MA) = Load ÷ Effort."
                  ]
                },
                {
                  t: "Smart & Modern Materials (AQA 3.1.3)",
                  content: "Materials engineered to change properties dynamically under external stimuli:",
                  bullets: [
                    "Thermochromic Pigments: Change color with temperature variations (e.g., medical thermometers, mug indicators).",
                    "Photochromic Pigments: React to UV light intensity (e.g., self-tinting eyeglass lenses).",
                    "Shape Memory Alloys (Nitinol): Nickel-titanium alloy that returns to a pre-set shape upon heating (used in dental braces and arterial stents)."
                  ]
                }
              ],
              cards: [
                { q: "What is Computer Integrated Manufacturing (CIM)?", a: "Using computers to control the entire production process and integrate all factory operations." },
                { q: "List the 6 Rs of Sustainability required by AQA.", a: "Rethink, Reuse, Recycle, Repair, Reduce, Refuse." },
                { q: "What is a Life Cycle Assessment (LCA)?", a: "An environmental audit evaluating a product's impact from raw material extraction to final disposal." },
                { q: "What is a Thermochromic pigment?", a: "A smart material that changes color in response to temperature changes." },
                { q: "What is a Photochromic pigment?", a: "A smart material that changes color when exposed to UV light." },
                { q: "What is Nitinol?", a: "A Shape Memory Alloy (SMA) made of nickel and titanium that recovers its preset shape when heated." },
                { q: "What is CAD?", a: "Computer-Aided Design: using software to create 2D/3D digital drawings." },
                { q: "What is CAM?", a: "Computer-Aided Manufacture: using computer-controlled machinery (CNC lasers, 3D printers) to make parts." },
                { q: "What is an LDR?", a: "Light Dependent Resistor: an input sensor whose resistance decreases as light level increases." },
                { q: "What is a Thermistor?", a: "A temperature-dependent resistor whose resistance changes with heat." },
                { q: "What is a finite energy resource?", a: "An energy source that cannot be replenished on a human timescale (e.g., coal, oil, natural gas)." },
                { q: "What is a renewable energy resource?", a: "An energy source replenished naturally at a rate faster than it is consumed (e.g., wind, solar)." },
                { q: "What is Just-In-Time (JIT) production?", a: "A lean production method where materials arrive at the factory exactly when needed on the assembly line." },
                { q: "What is Crowd Funding?", a: "Raising capital for a product launch from a large online audience contributing small amounts." },
                { q: "What is Planned Obsolescence?", a: "Deliberately designing a product to fail or become outdated after a specified timeframe." },
                { q: "What is Market Pull?", a: "Designing new products driven by direct consumer demand and market trends." },
                { q: "What is Technology Push?", a: "Designing products driven by scientific R&D breakthroughs without prior market demand." },
                { q: "What is Polymorph?", a: "A smart polymer granule that softens in hot water at 62°C and can be hand-molded." },
                { q: "What is Quantum Tunneling Composite (QTC)?", a: "A smart pressure-sensing material that acts as an insulator normally, but becomes a conductor when squashed." },
                { q: "What is Carbon Footprint?", a: "The total volume of greenhouse gases produced by an individual, event, or product lifecycle." },
                { q: "What is Continuous Production?", a: "24/7 automated manufacturing running non-stop for high-demand uniform goods." },
                { q: "What is Batch Production?", a: "Manufacturing a fixed quantity of identical items before retooling the machinery for another product." },
                { q: "What is One-Off Production?", a: "Manufacturing a single, bespoke item tailored specifically to an individual client's order." },
                { q: "What is Mechanical Advantage (MA)?", a: "The ratio of Load to Effort (MA = Load ÷ Effort)." },
                { q: "What is a Microcontroller (e.g., PIC chip)?", a: "A programmable integrated circuit acting as the 'brain' (process block) in electronic systems." }
              ],
              quiz: [
                { q: "Which of the 6 Rs involves fixing broken items to extend product life?", opts: ["Reduce", "Refuse", "Repair", "Recycle"], ans: 2, exp: "Repairing restores functionality, preventing premature disposal to landfill." },
                { q: "Which smart material changes color when exposed to UV sunlight?", opts: ["Thermochromic pigment", "Photochromic pigment", "Nitinol", "QTC"], ans: 1, exp: "Photochromic pigments alter optical properties when struck by ultraviolet light." },
                { q: "What happens to Nitinol when it is heated above its transition temperature?", opts: ["It melts", "It returns to its original pre-set shape", "It turns black", "It generates electricity"], ans: 1, exp: "Nitinol is an SMA that restores its preset crystalline structure upon heating." },
                { q: "What is the primary goal of Just-In-Time (JIT) production?", opts: ["Stockpiling huge raw material inventories", "Eliminating warehouse storage costs by scheduling parts to arrive precisely as needed", "Manufacturing products slowly", "Exporting goods"], ans: 1, exp: "JIT reduces lean manufacturing waste and eliminates costly raw material storage." },
                { q: "Which of the following is classified as a finite energy resource?", opts: ["Solar power", "Wind energy", "Natural Gas", "Hydroelectric power"], ans: 2, exp: "Fossil fuels like natural gas are non-renewable and exhaustible." },
                { q: "What is technology push?", opts: ["Consumer demand calling for new features", "Research and development breakthroughs enabling new product concepts", "Government sales mandates", "Lowering retail prices"], ans: 1, exp: "Tech push originates from scientific discoveries pushed out into commercial markets." },
                { q: "What does an LDR (Light Dependent Resistor) do when light levels increase?", opts: ["Resistance increases", "Resistance decreases", "Voltage drops to zero", "It melts"], ans: 1, exp: "In an LDR, higher light intensity causes electrical resistance to drop." },
                { q: "What smart material changes from an electrical insulator to a conductor under pressure?", opts: ["Thermochromic paint", "Quantum Tunneling Composite (QTC)", "Polymorph", "Photochromic film"], ans: 1, exp: "QTC contains conductive nickel particles that touch when compressed." },
                { q: "What is market pull?", opts: ["R&D labs discovering new polymers", "Consumer needs and changing market trends driving new product development", "Factory conveyor belts", "Import tariffs"], ans: 1, exp: "Market pull is driven directly by customer feedback and consumer demand." },
                { q: "What does a Life Cycle Assessment (LCA) evaluate?", opts: ["Product profit margins", "Environmental impact across all stages from raw material to disposal", "Manufacturing speed", "Packaging graphics"], ans: 1, exp: "LCA measures ecological damage throughout the complete product lifecycle." },
                { q: "Which scale of production is best suited for 1,000 identical school crest badges?", opts: ["One-off production", "Batch production", "Continuous production", "Bespoke crafting"], ans: 1, exp: "Batch production manufactures a specific batch quantity efficiently." },
                { q: "What is polymorph?", opts: ["A high-carbon steel", "A smart polymer granule that becomes moldable in 62°C water", "A ceramic tile", "A solar cell film"], ans: 1, exp: "Polymorph softens at 62°C, making it reusable for rapid prototyping." },
                { q: "What is planned obsolescence?", opts: ["Designing products for easy repair", "Deliberately designing a product to fail or become obsolete after a set time", "Recycling plastic bottles", "Building custom furniture"], ans: 1, exp: "Planned obsolescence encourages consumer repurchasing." },
                { q: "In an electronic system, what category does a buzzer belong to?", opts: ["Input", "Process", "Output", "Sensor"], ans: 2, exp: "Buzzers convert electrical signals into sound energy (Output)." },
                { q: "Which CAD feature allows designers to send digital files directly to a CNC router?", opts: ["Hand sketching", "CAM integration", "Paper plotting", "Manual drafting"], ans: 1, exp: "CAD vector files generate G-code to drive CNC CAM machinery directly." },

      window.toggleTheme = function () {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('theme-btn').innerText = 'Dark Mode';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.getElementById('theme-btn').innerText = 'Light Mode';
        }
      };

      window.switchSubject = function (subjKey) {
        currentSubj = subjKey;
        currentUnit = 'all';
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;

        document.querySelectorAll('.subj-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-subj') === subjKey);
        });

        document.documentElement.style.setProperty('--accent', SPEC_DATA[subjKey].color);
        updateUnitDropdown();
        render();
      };

      window.switchUnit = function (unitVal) {
        currentUnit = unitVal;
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        render();
      };

      window.switchTab = function (tabKey) {
        currentTab = tabKey;
        flipped = false;
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + tabKey);
        });
        render();
      };

      function updateUnitDropdown() {
        var select = document.getElementById('unit-select');
        var html = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        if (SPEC_DATA[currentSubj] && SPEC_DATA[currentSubj].units) {
          SPEC_DATA[currentSubj].units.forEach(function (u) {
            html += '<option value="' + u.id + '">' + u.name + '</option>';
          });
        }
        select.innerHTML = html;
        select.value = currentUnit;
      }

      function getFilteredUnits() {
        if (!SPEC_DATA[currentSubj]) return [];
        var units = SPEC_DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getFilteredCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          if (u.cards) {
            u.cards.forEach(function (c) {
              list.push({ unitName: u.name, q: c.q, a: c.a });
            });
          }
        });
        return list;
      }

      function getFilteredQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          if (u.quiz) {
            u.quiz.forEach(function (q) {
              list.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
            });
          }
        });
        return list;
      }

      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">AQA GCSE D&T (8552)</span></div>';
          if (u.notes) {
            u.notes.forEach(function (n) {
              html += '<div class="note-block">';
              html += '<h4>' + n.t + '</h4>';
              if (n.content) html += '<p>' + n.content + '</p>';
              if (n.bullets && n.bullets.length) {
                html += '<ul>';
                n.bullets.forEach(function (b) {
                  html += '<li>' + b + '</li>';
                });
                html += '</ul>';
              }
              html += '</div>';
            });
          }
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

        var cards = getFilteredCards();
        if (cards.length === 0) return '<div class="unit-panel">No flashcards available for this filter.</div>';

        var c = cards[flashIdx % cards.length];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + cards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      function renderQuiz() {
        var quizList = getFilteredQuiz();
        if (quizList.length === 0) return '<div class="unit-panel">No quiz questions available for this unit filter.</div>';

        if (quizIdx >= quizList.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + quizScore + ' / ' + quizList.length + '</div>';
          html += '<p>Great job revising AQA GCSE Design & Technology!</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = quizList[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + quizList.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === getFilteredQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (!main) return;
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      updateUnitDropdown();
      render();
    })();
  </script>
</body>
</html>
