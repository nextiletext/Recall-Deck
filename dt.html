<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - AQA GCSE Design & Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent-core: #f97316;
      --accent-mat: #eab308;
      --accent-des: #06b6d4;
      --accent: #f97316;
      --accent-ink: #ffffff;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent-core: #ea580c;
      --accent-mat: #ca8a04;
      --accent-des: #0891b2;
      --accent: #ea580c;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn[data-subj="core"].active { background: var(--accent-core); color: #fff; }
    .subj-btn[data-subj="mat"].active { background: var(--accent-mat); color: #fff; }
    .subj-btn[data-subj="des"].active { background: var(--accent-des); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">AQA GCSE Design & Technology (8552)</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="core" onclick="switchSubject('core')">Core Technical</button>
          <button class="subj-btn" data-subj="mat" onclick="switchSubject('mat')">Specialist Materials</button>
          <button class="subj-btn" data-subj="des" onclick="switchSubject('des')">Designing & Making</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'core';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var shuffledCards = [];
      var shuffledQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      var SPEC_DATA = {
        core: {
          title: "Section 3.1: Core Technical Principles",
          color: "#f97316",
          units: [
            {
              id: "dt_core",
              code: "DT1",
              name: "Unit 1: Systems, Smart Materials & Sustainability",
              notes: [
                {
                  t: "New and Emerging Technologies",
                  content: "Impact of modern industrial developments on society, production, and the environment:",
                  bullets: [
                    "Automation & Robotics: Modern factories use Computer Integrated Manufacturing (CIM) and flexible manufacturing systems (FMS) to increase speed and precision, though causing labor displacement.",
                    "Enterprise & Funding: Crowdfunding platform networks allow startups to raise investment capital directly from target consumers online.",
                    "The 6 Rs: Rethink, Reuse, Recycle, Repair, Reduce, Refuse. Life Cycle Assessments (LCA) audit total environmental impact from extraction through manufacturing to disposal."
                  ]
                },
                {
                  t: "Energy Generation & Systems Architecture",
                  content: "Understanding energy resources and systems:",
                  bullets: [
                    "Energy Sources: Non-renewables (fossil fuels, nuclear) vs Renewables (solar PV, wind, hydro, geothermal, biomass).",
                    "Electronic Systems: Inputs (sensors like LDRs, thermistors), Process (microcontrollers like PICs), and Outputs (buzzers, LEDs, solenoids).",
                    "Mechanical Devices: Rotary, Linear, Reciprocating, and Oscillating motion. Mechanical Advantage (MA) = Load ÷ Effort."
                  ]
                }
              ],
              cards: [
                { q: "What is Computer Integrated Manufacturing (CIM)?", a: "Using computers to control the whole production process and integrate all factory operations." },
                { q: "List the 6 Rs of Sustainability.", a: "Rethink, Reuse, Recycle, Repair, Reduce, Refuse." },
                { q: "What is a Life Cycle Assessment (LCA)?", a: "An environmental audit evaluating a product's impact from raw extraction to end disposal." },
                { q: "What is a Thermochromic pigment?", a: "A smart material that changes color in response to temperature changes." },
                { q: "What is a Photochromic pigment?", a: "A smart material that changes color when exposed to UV light." },
                { q: "What is Nitinol?", a: "A Shape Memory Alloy (SMA) made of nickel and titanium that recovers its preset shape when heated." },
                { q: "What is CAD?", a: "Computer-Aided Design: using software to produce 2D/3D digital drawings." },
                { q: "What is CAM?", a: "Computer-Aided Manufacture: using computer-controlled machinery (CNC lasers, 3D printers) to make parts." },
                { q: "What is an LDR?", a: "Light Dependent Resistor: an input sensor whose resistance drops as light level increases." },
                { q: "What is a Thermistor?", a: "A temperature-dependent resistor whose resistance changes with heat." },
                { q: "What is a finite energy resource?", a: "An energy resource that cannot be replenished on a human timescale (e.g. coal, gas, oil)." },
                { q: "What is a renewable energy resource?", a: "An energy resource replenished naturally at a rate equal to or faster than consumed." },
                { q: "What is Just-In-Time (JIT) production?", a: "A lean manufacturing method where stock arrives at the factory right when needed for assembly." },
                { q: "What is Crowd Funding?", a: "Raising capital online from a large crowd of individual backers." },
                { q: "What is Planned Obsolescence?", a: "Deliberately designing a product to break or become obsolete after a set time." },
                { q: "What is Market Pull?", a: "Designing products driven directly by consumer demand and market trends." },
                { q: "What is Technology Push?", a: "Designing products driven by scientific R&D breakthroughs without prior market request." },
                { q: "What is Polymorph?", a: "A smart polymer granule that softens in hot water at 62°C and can be hand-molded." },
                { q: "What is Quantum Tunneling Composite (QTC)?", a: "A smart pressure sensor that acts as an insulator normally, but becomes conductive when squashed." },
                { q: "What is Carbon Footprint?", a: "Total volume of greenhouse gas emissions generated by an individual, business, or product." },
                { q: "What is Continuous Production?", a: "24/7 non-stop automated manufacturing for massive quantities of identical items." },
                { q: "What is Batch Production?", a: "Manufacturing a set quantity of identical items before modifying setup for another run." },
                { q: "What is One-Off Production?", a: "Creating a single, custom item tailored specifically to one client's specification." },
                { q: "What is Mechanical Advantage (MA)?", a: "The ratio of Load force to Effort force (MA = Load ÷ Effort)." },
                { q: "What is a Microcontroller (e.g. PIC chip)?", a: "A programmable integrated circuit acting as the process unit in electronic systems." }
              ],
              quiz: [
                { q: "Which of the 6 Rs involves fixing broken items to extend product life?", opts: ["Reduce", "Refuse", "Repair", "Recycle"], ans: 2 },
                { q: "Which smart material changes color when exposed to UV sunlight?", opts: ["Thermochromic pigment", "Photochromic pigment", "Nitinol", "QTC"], ans: 1 },
                { q: "What happens to Nitinol when it is heated above its activation temperature?", opts: ["It melts into liquid", "It returns to its preset memory shape", "It turns black", "It produces electricity"], ans: 1 },
                { q: "What is the primary goal of Just-In-Time (JIT) manufacturing?", opts: ["Building huge stock inventory", "Eliminating warehouse storage costs by scheduling parts right as needed", "Slowing down output", "Exporting goods"], ans: 1 },
                { q: "Which of the following is classified as a finite energy resource?", opts: ["Solar power", "Wind energy", "Natural Gas", "Hydroelectric"], ans: 2 },
                { q: "What is technology push?", opts: ["Consumer demand demanding new features", "Research breakthroughs enabling new product concepts", "Government mandates", "Lower retail prices"], ans: 1 },
                { q: "What does an LDR do when ambient light level increases?", opts: ["Resistance increases", "Resistance decreases", "Voltage drops to zero", "It melts"], ans: 1 },
                { q: "What smart material changes from electrical insulator to conductor when compressed?", opts: ["Thermochromic paint", "Quantum Tunneling Composite (QTC)", "Polymorph", "Photochromic film"], ans: 1 },
                { q: "What is market pull?", opts: ["R&D labs discovering new materials", "Consumer needs and changing market trends driving design", "Conveyor belts", "Import tariffs"], ans: 1 },
                { q: "What does a Life Cycle Assessment (LCA) audit?", opts: ["Financial profit margin", "Total environmental impact across all stages from raw extraction to disposal", "Factory speed", "Graphics design"], ans: 1 },
                { q: "Which production method is best for making 1,000 identical enamel badges?", opts: ["One-off production", "Batch production", "Continuous production", "Hand carving"], ans: 1 },
                { q: "What is polymorph?", opts: ["High-carbon steel", "Smart polymer granule softening in 62°C water", "Ceramic tile", "Solar cell"], ans: 1 },
                { q: "What is planned obsolescence?", opts: ["Designing products for easy repair", "Deliberately designing a product to fail or become outdated after a set time", "Recycling plastic", "Handcrafted furniture"], ans: 1 },
                { q: "In an electronic system, what category does a buzzer belong to?", opts: ["Input", "Process", "Output", "Sensor"], ans: 2 },
                { q: "Which CAD feature enables sending digital files directly to a CNC router?", opts: ["Sketching", "CAM integration", "Paper plotting", "Manual drafting"], ans: 1 },
                { q: "What does CAM stand for?", opts: ["Computer-Aided Manufacture", "Centralized Assembly Methods", "Controlled Automated Metalwork", "Custom Mechanical Art"], ans: 0 },
                { q: "What is crowd funding?", opts: ["Bank loans", "Raising product capital from large online backer communities", "Government grants", "Company stock sales"], ans: 1 },
                { q: "What is the formula for Mechanical Advantage (MA)?", opts: ["MA = Effort ÷ Load", "MA = Load ÷ Effort", "MA = Distance × Force", "MA = Mass × Speed"], ans: 1 },
                { q: "What is standardization?", opts: ["Custom parts", "Using uniform component sizes across the industry (e.g. M6 bolts)", "Banning packaging", "Hand-carving wood"], ans: 1 },
                { q: "Which renewable energy source uses subterranean steam from hot rocks?", opts: ["Biomass", "Geothermal power", "Hydroelectric dam", "Tidal barrage"], ans: 1 },
                { q: "What is a main limitation of solar PV energy?", opts: ["High carbon emissions during operation", "Weather dependent output with zero generation at night", "Nuclear radiation risk", "Pollutes rivers"], ans: 1 },
                { q: "What does 'Refuse' mean in the 6 Rs?", opts: ["Refusing to work", "Declining unnecessary single-use items or excessive packaging", "Throwing items in trash", "Fixing broken tools"], ans: 1 },
                { q: "Which battery chemistry is standard in electric vehicles and smartphones?", opts: ["Lead-acid", "Lithium-ion", "Zinc-carbon", "Nickel-cadmium"], ans: 1 },
                { q: "What is automation in modern manufacturing?", opts: ["Hiring more workers", "Replacing manual human tasks with automated robotic systems", "Shutting down assembly lines", "Crafting by hand"], ans: 1 },
                { q: "What is a primary advantage of 3D printing (Additive Manufacturing)?", opts: ["Generates heavy material waste", "Creates complex geometries without specialized tooling or molds", "Slower than molding for mass volume", "Requires steel dies"], ans: 1 }
              ]
            }
          ]
        },
        mat: {
          title: "Section 3.2: Specialist Material Categories",
          color: "#eab308",
          units: [
            {
              id: "dt_materials",
              code: "DT2",
              name: "Unit 2: Papers, Boards, Timbers, Metals & Polymers",
              notes: [
                {
                  t: "Papers and Boards",

      function renderHeader() {
        var subHtml = '';
        var keys = ['core', 'mat', 'des'];
        var labels = { core: 'Core Technical', mat: 'Specialist Materials', des: 'Designing & Making' };
        keys.forEach(function (k) {
          subHtml += '<button class="subj-btn ' + (currentSubj === k ? 'active' : '') + '" data-subj="' + k + '" onclick="switchSubject(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subject-picker').innerHTML = subHtml;

        var unitOpts = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        SPEC_DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unit-select').innerHTML = unitOpts;
        document.getElementById('theme-btn').textContent = isDark ? 'Dark Mode' : 'Light Mode';
      }

      window.toggleTheme = function() {
        isDark = !isDark;
        if (!isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      function initSessionData() {
        var rawCards = [];
        var rawQuiz = [];
        var units = SPEC_DATA[currentSubj].units;
        var filtered = currentUnit === 'all' ? units : units.filter(function(u) { return u.id === currentUnit; });

        filtered.forEach(function(u) {
          u.cards.forEach(function(c) {
            rawCards.push({ unitName: u.name, q: c.q, a: c.a });
          });
          u.quiz.forEach(function(q) {
            rawQuiz.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });

        shuffledCards = shuffleArray(rawCards);
        shuffledQuiz = shuffleArray(rawQuiz);
      }

      window.switchSubject = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        flashIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        document.documentElement.style.setProperty('--accent', SPEC_DATA[s].color);
        initSessionData();
        render();
      };

      window.switchUnit = function (u) {
        currentUnit = u;
        flashIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.switchTab = function (t) {
        currentTab = t;
        flipped = false;
        if (t === 'study' || t === 'quiz') {
          initSessionData();
          flashIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0;
        }
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + t);
        });
        render();
      };

      function renderNotes() {
        var units = currentUnit === 'all' ? SPEC_DATA[currentSubj].units : SPEC_DATA[currentSubj].units.filter(function(u) { return u.id === currentUnit; });
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">AQA GCSE D&T (8552)</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.bullets && n.bullets.length) {
              html += '<ul>';
              n.bullets.forEach(function (b) {
                html += '<li>' + b + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (shuffledCards.length === 0) initSessionData();

        if (flashIdx >= shuffledCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You reviewed all <b>' + shuffledCards.length + '</b> unique flashcards for this section.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = shuffledCards[flashIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + shuffledCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      window.resetFlashcards = function () {
        flashIdx = 0;
        flipped = false;
        shuffledCards = shuffleArray(shuffledCards);
        render();
      };

      function renderQuiz() {
        if (shuffledQuiz.length === 0) initSessionData();

        if (quizIdx >= shuffledQuiz.length) {
          var pct = Math.round((quizScore / shuffledQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + shuffledQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = shuffledQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + shuffledQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === shuffledQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        shuffledQuiz = shuffleArray(shuffledQuiz);
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (!main) return;
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      initSessionData();
      render();
    })();
  </script>
