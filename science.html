<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent-bio: #10b981;
      --accent-chem: #3b82f6;
      --accent-phys: #f59e0b;
      --accent: #10b981;
      --accent-ink: #022c22;
      --good: #10b981;
      --bad: #ef4444;
      --warn: #f59e0b;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent-bio: #059669;
      --accent-chem: #2563eb;
      --accent-phys: #d97706;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
      --warn: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn[data-subj="bio"].active { background: var(--accent-bio); color: #fff; }
    .subj-btn[data-subj="chem"].active { background: var(--accent-chem); color: #fff; }
    .subj-btn[data-subj="phys"].active { background: var(--accent-phys); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
      position: relative;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-auto: 0;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">OCR GCSE 21st Century Science B</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="bio" onclick="switchSubject('bio')">Biology</button>
          <button class="subj-btn" data-subj="chem" onclick="switchSubject('chem')">Chemistry</button>
          <button class="subj-btn" data-subj="phys" onclick="switchSubject('phys')">Physics</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'bio';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var flashHits = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var activeFlashcards = [];
      var activeQuiz = [];

      var SPEC_DATA = {
        bio: {
          title: "OCR GCSE Biology B (B1-B6)",
          color: "#10b981",
          units: [
            {
              id: "b1",
              code: "B1",
              name: "B1: You and Your Genes",
              notes: [
                {
                  t: "Genome, Chromosomes & DNA Structure",
                  content: "The entire genetic material of an organism is called its genome. In eukaryotic cells, DNA is enclosed in the nucleus packaged as chromosomes. Humans have 46 chromosomes (23 pairs) in diploid somatic cells and 23 single chromosomes in haploid gametes.",
                  bullets: [
                    "DNA is a polymer made of two strands twisted into a double helix.",
                    "Each monomer is a nucleotide consisting of a phosphate group, deoxyribose sugar, and nitrogenous base.",
                    "Complementary base pairing: A-T and C-G.",
                    "A gene codes for a specific sequence of amino acids to synthesize a protein."
                  ]
                }
              ],
              cards: [
                { q: "What is a gene?", a: "A section of DNA on a chromosome that codes for a specific sequence of amino acids to synthesize a protein." },
                { q: "State the complementary base pairing rules for DNA.", a: "Adenine (A) pairs with Thymine (T); Cytosine (C) pairs with Guanine (G)." },
                { q: "What happens during transcription?", a: "RNA polymerase reads the DNA template strand in the nucleus to produce a complementary single-stranded mRNA molecule." },
                { q: "Define homozygous and heterozygous.", a: "Homozygous means two identical alleles; Heterozygous means two different alleles." },
                { q: "Why are human gametes described as haploid?", a: "Because they contain 23 single chromosomes (half the diploid number of 46)." },
                { q: "Which base is present in RNA instead of Thymine?", a: "Uracil (U)." },
                { q: "Where does translation occur inside a cell?", a: "At a ribosome located in the cytoplasm." },
                { q: "What is a phenotype?", a: "The physical characteristics expressed as a result of an organism's genotype and environment." },
                { q: "What sex chromosomes do human males possess?", a: "XY chromosomes." },
                { q: "What is a stem cell?", a: "An undifferentiated cell capable of dividing by mitosis and differentiating into specialized cell types." },
                { q: "What are embryonic stem cells?", a: "Pluripotent cells derived from early embryos that can differentiate into almost any cell type." },
                { q: "What are adult stem cells?", a: "Multipotent stem cells (e.g., in bone marrow) that can only form a limited range of specialized cell types." },
                { q: "What is plant meristem tissue?", a: "Undifferentiated plant tissue found in growing tips of roots and shoots capable of continuous division." },
                { q: "What is codominance?", a: "When both alleles in a heterozygous organism are equally expressed in the phenotype." },
                { q: "What is a gene codon?", a: "A triplet sequence of 3 bases on mRNA that codes for one specific amino acid." },
                { q: "What is a nucleotide composed of?", a: "A sugar molecule, a phosphate group, and a nitrogenous base." },
                { q: "What is a genome?", a: "The entire genetic material of an organism." },
                { q: "What type of bonds join complementary base pairs in DNA?", a: "Hydrogen bonds." },
                { q: "What sex chromosomes do human females possess?", a: "XX chromosomes." },
                { q: "What delivers specific amino acids to the ribosome during translation?", a: "tRNA (Transfer RNA) molecules with complementary anticodons." },
                { q: "What does diploid mean?", a: "Containing two full sets of chromosomes (46 in human body cells)." },
                { q: "What is a recessive allele?", a: "An allele expressed only when two copies are present in the genotype." },
                { q: "What is a dominant allele?", a: "An allele expressed even if only one copy is present." },
                { q: "What process produces haploid gametes from diploid cells?", a: "Meiosis." },
                { q: "What process produces identical diploid body cells for growth?", a: "Mitosis." }
              ],
              quiz: [
                { q: "Which nitrogenous base is present in RNA instead of Thymine?", opts: ["Adenine", "Cytosine", "Uracil", "Guanine"], ans: 2, exp: "RNA replaces Thymine with Uracil (U)." },
                { q: "If two heterozygous parents (Bb) have a child, what is the probability of the child having the recessive phenotype?", opts: ["0%", "25%", "50%", "75%"], ans: 1, exp: "A Bb x Bb cross gives 1 in 4 (25%) bb." },
                { q: "What type of bonds join complementary base pairs together in DNA?", opts: ["Hydrogen bonds", "Covalent bonds", "Ionic bonds", "Peptide bonds"], ans: 0, exp: "Hydrogen bonds hold base pairs together." },
                { q: "What is a codon?", opts: ["A triplet of bases on mRNA coding for an amino acid", "A whole chromosome", "A lipid molecule", "An enzyme"], ans: 0, exp: "A codon is 3 mRNA bases coding for 1 amino acid." },
                { q: "Which cells are haploid?", opts: ["Skin cells", "Muscle cells", "Gametes (sperm/egg)", "Root hair cells"], ans: 2, exp: "Gametes contain half the normal chromosome set." },
                { q: "What enzyme synthesizes mRNA during transcription?", opts: ["DNA polymerase", "RNA polymerase", "Amylase", "Protease"], ans: 1, exp: "RNA polymerase constructs mRNA." },
                { q: "Where does translation occur in the cell?", opts: ["Inside the nucleus", "At a ribosome in cytoplasm", "On cell membrane", "Inside vacuole"], ans: 1, exp: "Translation occurs at ribosomes." },
                { q: "What term describes alleles where both are fully expressed in the phenotype?", opts: ["Recessive", "Dominant", "Codominant", "Mutated"], ans: 2, exp: "Codominant alleles are both expressed." },
                { q: "What are plant meristems capable of?", opts: ["Photosynthesis only", "Continuous cell division and differentiation", "Antibody creation", "Respiration only"], ans: 1, exp: "Meristems divide continuously for plant growth." },
                { q: "What is genetic engineering?", opts: ["Selective breeding", "Modifying genome by introducing a gene from another organism", "Mitosis", "Natural selection"], ans: 1, exp: "Genetic engineering modifies DNA directly." },
                { q: "What is a mutation?", opts: ["A permanent change in DNA base sequence", "A temporary protein fold", "Cell death", "Respiration"], ans: 0, exp: "Mutations alter DNA nucleotide sequences." },
                { q: "What do tRNA molecules deliver to the ribosome?", opts: ["mRNA templates", "Specific amino acids", "DNA strands", "Ribosomes"], ans: 1, exp: "tRNA brings specific amino acids." },
                { q: "What does diploid mean?", opts: ["Single un-paired chromosomes", "Two complete sets of paired chromosomes", "No nucleus", "Three sets"], ans: 1, exp: "Diploid means paired sets of chromosomes." },
                { q: "What sex chromosomes do human females possess?", opts: ["XY", "XX", "YY", "XO"], ans: 1, exp: "Females carry XX chromosomes." },
                { q: "What is the function of a gene?", opts: ["Store energy", "Code for a specific amino acid sequence in a protein", "Produce glucose", "Destroy pathogens"], ans: 1, exp: "Genes carry instructions for making proteins." },
                { q: "How many chromosomes are in a normal human somatic cell?", opts: ["23", "46", "92", "12"], ans: 1, exp: "Human somatic cells contain 46 chromosomes in 23 pairs." },
                { q: "Which sugar is present in DNA nucleotides?", opts: ["Ribose", "Deoxyribose", "Glucose", "Sucrose"], ans: 1, exp: "DNA contains deoxyribose sugar." },
                { q: "What shape is a DNA molecule?", opts: ["Single straight line", "Double helix", "Triple coil", "Circular ring"], ans: 1, exp: "DNA forms a double-stranded helix." },
                { q: "What term describes the allele combination of an organism?", opts: ["Genotype", "Phenotype", "Karyotype", "Protype"], ans: 0, exp: "Genotype refers to allele combination." },
                { q: "Which stem cells can differentiate into ANY body cell type?", opts: ["Embryonic stem cells", "Adult bone marrow stem cells", "Red blood cells", "Nerve cells"], ans: 0, exp: "Embryonic stem cells are pluripotent." },
                { q: "Where in the human body are adult stem cells found?", opts: ["Bone marrow", "Hair shaft", "Nails", "Enamel"], ans: 0, exp: "Adult stem cells reside in bone marrow." },
                { q: "What is the mRNA complementary sequence for DNA triplet TAC?", opts: ["ATG", "AUG", "UAC", "GCA"], ans: 1, exp: "In RNA, T->A, A->U, C->G, so TAC becomes AUG." },
                { q: "Which cell division process creates 4 genetically non-identical daughter cells?", opts: ["Mitosis", "Meiosis", "Binary fission", "Budding"], ans: 1, exp: "Meiosis creates 4 haploid, non-identical gametes." },
                { q: "What is an allele?", opts: ["A type of cell", "A variant form of a gene", "A protein chain", "A carbohydrate"], ans: 1, exp: "Alleles are different forms of the same gene." },
                { q: "What percentage chance is there that offspring will inherit an X from their mother?", opts: ["0%", "25%", "50%", "100%"], ans: 3, exp: "Mothers are XX, so every egg cell carries an X chromosome." }
              ]
            },
            {
              id: "b2",
              code: "B2",
              name: "B2: Keeping Healthy",
              notes: [
                {
                  t: "Pathogens & Defense Systems",
                  content: "Communicable diseases are caused by pathogens (bacteria, viruses, fungi, protists). The body protects itself via non-specific barriers and specific immune responses.",
                  bullets: [
                    "Bacteria release toxins; Viruses invade cells and burst them.",
                    "White blood cells perform phagocytosis and produce specific antibodies & antitoxins.",
                    "Vaccines trigger primary immune memory without causing disease."
                  ]
                }

      // Fisher-Yates Shuffle Algorithm
      function shuffleArray(array) {
        var copy = array.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

          document.documentElement.setAttribute('data-theme', 'light');
          document.getElementById('theme-btn').innerText = 'Light Mode';

      function updateUnitDropdown() {
        var select = document.getElementById('unit-select');
        var html = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        SPEC_DATA[currentSubj].units.forEach(function (u) {
          html += '<option value="' + u.id + '">' + u.name + '</option>';
        });
        select.innerHTML = html;
        select.value = currentUnit;

      function getFilteredUnits() {
        var units = SPEC_DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function prepareActiveData() {
        var cardList = [];
        var quizList = [];
        getFilteredUnits().forEach(function (u) {
          if (u.cards) {
            u.cards.forEach(function (c) {
              cardList.push({ unitName: u.name, q: c.q, a: c.a });
            });
          }
          if (u.quiz) {
            u.quiz.forEach(function (q) {
              quizList.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
            });
          }
        });

        activeFlashcards = shuffleArray(cardList);
        activeQuiz = shuffleArray(quizList);
      }

      // RENDER FUNCTIONS
      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">OCR GCSE 21st Century</span></div>';

            if (n.bullets && n.bullets.length) {
              html += '<ul>';
              n.bullets.forEach(function (b) {

              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (!activeFlashcards || activeFlashcards.length === 0) {
          return '<div class="unit-panel">No flashcards available for this filter.</div>';
        }

        if (flashIdx >= activeFlashcards.length) {
          var pct = Math.round((flashHits / activeFlashcards.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Deck Completed! 🎉</h2>';
          html += '<div class="score-circle">' + flashHits + ' / ' + activeFlashcards.length + '</div>';
          html += '<p>You mastered <b>' + pct + '%</b> of the flashcards in this deck!</p>';
          html += '<div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">';
          html += '<button class="btn primary" onclick="restartDeck(true)">🔀 Shuffle & Restart Deck</button>';
          html += '<button class="btn" onclick="restartDeck(false)">🔄 Restart Deck (Same Order)</button>';
          html += '</div></div></div>';
          return html;
        }

        var c = activeFlashcards[flashIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + activeFlashcards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        if (hit) flashHits++;
        flipped = false;
        flashIdx++;
        render();
      };

      window.restartDeck = function (shouldShuffle) {
        if (shouldShuffle) {
          var cardList = [];
          getFilteredUnits().forEach(function (u) {
            if (u.cards) {
              u.cards.forEach(function (c) {
                cardList.push({ unitName: u.name, q: c.q, a: c.a });
              });
            }
          });
          activeFlashcards = shuffleArray(cardList);
        }
        resetStudyState();
        render();
      };

      function renderQuiz() {
        if (!activeQuiz || activeQuiz.length === 0) {
          return '<div class="unit-panel">No quiz questions available for this unit filter.</div>';
        }

        if (quizIdx >= activeQuiz.length) {
          var pct = Math.round((quizScore / activeQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed! 🏆</h2>';
          html += '<div class="score-circle">' + quizScore + ' / ' + activeQuiz.length + '</div>';
          html += '<p>Score: <b>' + pct + '%</b>. Great review of OCR Science material!</p>';
          html += '<div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">';
          html += '<button class="btn primary" onclick="resetQuiz(true)">🔀 Shuffle & Restart Quiz</button>';
          html += '<button class="btn" onclick="resetQuiz(false)">🔄 Restart Quiz</button>';
          html += '</div></div></div>';
          return html;
        }

        var q = activeQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + activeQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === activeQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function (shouldShuffle) {
        if (shouldShuffle) {
          var quizList = [];
          getFilteredUnits().forEach(function (u) {
            if (u.quiz) {
              u.quiz.forEach(function (q) {
                quizList.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
              });
            }
          });
          activeQuiz = shuffleArray(quizList);
        }
        resetQuizState();
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      // Initial initialization
      updateUnitDropdown();
      prepareActiveData();
      render();
    })();
  </script>
</body>
</html>
