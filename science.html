<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent-bio: #10b981;
      --accent-chem: #3b82f6;
      --accent-phys: #f59e0b;
      --accent: #10b981;
      --accent-ink: #022c22;
      --good: #10b981;
      --bad: #ef4444;
      --warn: #f59e0b;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent-bio: #059669;
      --accent-chem: #2563eb;
      --accent-phys: #d97706;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
      --warn: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn[data-subj="bio"].active { background: var(--accent-bio); color: #fff; }
    .subj-btn[data-subj="chem"].active { background: var(--accent-chem); color: #fff; }
    .subj-btn[data-subj="phys"].active { background: var(--accent-phys); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
      position: relative;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-auto: 0;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    .key-term {
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
    }

    .formula-box {
      background: var(--bg);
      border: 1px dashed var(--accent);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      margin: 6px 0;
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">OCR GCSE 21st Century Science B</span>
      </div>
      <div class="controls-top">
        <a href="index.html" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="bio" onclick="switchSubject('bio')">Biology</button>
          <button class="subj-btn" data-subj="chem" onclick="switchSubject('chem')">Chemistry</button>
          <button class="subj-btn" data-subj="phys" onclick="switchSubject('phys')">Physics</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'bio';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      // SPEC DATA with exact original notes and 15 flashcards + 15 practice questions per unit
      var SPEC_DATA = {
        bio: {
          title: "OCR GCSE Biology B (B1-B6)",
          color: "#10b981",
          units: [
            {
              id: "b1",
              code: "B1",
              name: "B1: You and Your Genes",
              notes: [
                {
                  t: "Genome, Chromosomes & DNA Structure",
                  content: "The entire genetic material of an organism is called its genome. In eukaryotic cells, DNA is enclosed in the nucleus packaged as chromosomes. Humans have 46 chromosomes (23 pairs) in diploid somatic cells and 23 single chromosomes in haploid gametes (sperm and egg cells).",
                  bullets: [
                    "DNA is a polymer made of two strands twisted into a double helix.",
                    "Each monomer is a nucleotide consisting of a phosphate group, a deoxyribose sugar molecule, and a nitrogenous base.",
                    "Complementary base pairing holds strands together: Adenine (A) pairs with Thymine (T) using two hydrogen bonds; Cytosine (C) pairs with Guanine (G) using three hydrogen bonds.",
                    "A gene is a section of DNA on a chromosome that codes for a specific sequence of amino acids to synthesize a particular protein."
                  ]
                },
                {
                  t: "Protein Synthesis (Transcription & Translation)",
                  content: "Proteins are formed from chains of amino acids. The order of bases in a gene determines the order of amino acids in a polypeptide chain.",
                  bullets: [
                    "Triplet Code: Every sequence of 3 bases (codon) codes for one specific amino acid.",
                    "Transcription: In the nucleus, the DNA strand unzips. RNA polymerase uses one strand as a template to synthesize a complementary single-stranded Messenger RNA (mRNA) molecule. (In RNA, Uracil 'U' replaces Thymine 'T').",
                    "Translation: mRNA leaves the nucleus via nuclear pores and binds to a ribosome in the cytoplasm. Transfer RNA (tRNA) molecules with complementary anticodons deliver specific amino acids to the ribosome. Amino acids are joined by peptide bonds to form a polypeptide chain which folds into a functional protein."
                  ]
                },
                {
                  t: "Inheritance, Alleles & Monohybrid Crosses",
                  content: "Alleles are different variants of the same gene. An individual inherits two alleles for each gene (one from each parent).",
                  bullets: [
                    "Homozygous: Having two identical alleles (e.g. BB or bb). Heterozygous: Having two different alleles (e.g. Bb).",
                    "Genotype: The combination of alleles an organism possesses. Phenotype: The physical characteristics expressed as a result of the genotype and environment.",
                    "Dominant alleles are expressed even if only one copy is present (represented by capital letters). Recessive alleles are only expressed if two copies are present (represented by lower case letters).",
                    "Codominance occurs when both alleles are equally expressed in the phenotype (e.g. ABO Blood Group AB).",
                    "Sex Determination: Females have XX chromosomes; Males have XY chromosomes. There is a 50% probability of offspring being male or female."
                  ]
                },
                {
                  t: "Stem Cells & Differentiation",
                  content: "Stem cells are undifferentiated cells capable of dividing by mitosis to reproduce themselves or differentiate into specialized cells.",
                  bullets: [
                    "Embryonic Stem Cells: Totipotent/Pluripotent; can differentiate into any cell type in the body.",
                    "Adult Stem Cells: Found in bone marrow; multipotent (can only form limited cell types like blood cells).",
                    "Meristem Tissue: Found in growing tips of plant roots and shoots; can differentiate into any plant tissue throughout the plant's entire life."
                  ]
                }
              ],
              cards: [
                { q: "What is a gene?", a: "A section of DNA on a chromosome that codes for a specific sequence of amino acids to synthesize a specific protein." },
                { q: "State the complementary base pairing rules for DNA.", a: "Adenine (A) pairs with Thymine (T); Cytosine (C) pairs with Guanine (G)." },
                { q: "What happens during transcription?", a: "RNA polymerase reads the DNA template strand in the nucleus to produce a complementary single-stranded mRNA molecule." },
                { q: "Define homozygous and heterozygous.", a: "Homozygous means possessing two identical alleles for a gene; Heterozygous means possessing two different alleles." },
                { q: "Why are human gametes described as haploid?", a: "Because they contain 23 single chromosomes (half the diploid number of 46)." },
                { q: "Which nitrogenous base is present in RNA instead of Thymine?", a: "Uracil (U)." },
                { q: "Where does translation occur inside a cell?", a: "At a ribosome located in the cytoplasm." },
                { q: "What is a phenotype?", a: "The physical characteristics expressed as a result of an organism's genotype and environment." },
                { q: "What sex chromosomes do human males possess?", a: "XY chromosomes." },
                { q: "What is a stem cell?", a: "An undifferentiated cell capable of dividing by mitosis and differentiating into specialized cell types." },
                { q: "What are embryonic stem cells?", a: "Pluripotent cells derived from early embryos that can differentiate into almost any cell type in the body." },
                { q: "What are adult stem cells?", a: "Multipotent stem cells (e.g., in bone marrow) that can only form a limited range of specialized cell types." },
                { q: "What is plant meristem tissue?", a: "Undifferentiated plant tissue found in growing tips of roots and shoots capable of continuous division." },
                { q: "What is codominance?", a: "When both alleles in a heterozygous organism are equally expressed in the phenotype." },
                { q: "What is a gene codon?", a: "A triplet sequence of 3 bases on mRNA that codes for one specific amino acid." }
              ],
              quiz: [
                { q: "Which nitrogenous base is present in RNA instead of Thymine?", opts: ["Adenine", "Cytosine", "Uracil", "Guanine"], ans: 2, exp: "RNA replaces Thymine (T) with Uracil (U), which pairs with Adenine (A)." },
                { q: "If two heterozygous parents (Bb) have a child, what is the probability of the child having the recessive phenotype?", opts: ["0%", "25%", "50%", "75%"], ans: 1, exp: "A Bb x Bb monohybrid cross yields BB, Bb, Bb, bb. 1 in 4 (25%) has the recessive genotype (bb)." },
                { q: "What type of bonds join complementary base pairs together in DNA?", opts: ["Hydrogen bonds", "Covalent bonds", "Ionic bonds", "Peptide bonds"], ans: 0, exp: "Hydrogen bonds hold complementary base pairs together." },
                { q: "What is a codon?", opts: ["A triplet of bases on mRNA coding for an amino acid", "A whole chromosome", "A lipid molecule", "A type of enzyme"], ans: 0, exp: "A codon is a sequence of three mRNA bases." },
                { q: "Which cells are haploid?", opts: ["Skin cells", "Muscle cells", "Gametes (sperm/egg)", "Root hair cells"], ans: 2, exp: "Gametes have 23 single chromosomes (haploid)." },
                { q: "What enzyme synthesizes mRNA during transcription?", opts: ["DNA polymerase", "RNA polymerase", "Amylase", "Protease"], ans: 1, exp: "RNA polymerase constructs the mRNA transcript." },
                { q: "Where does translation occur in the cell?", opts: ["Inside the nucleus", "At a ribosome in the cytoplasm", "On the cell membrane", "Inside the vacuole"], ans: 1, exp: "Ribosomes translate mRNA into proteins in the cytoplasm." },
                { q: "What term describes alleles where both are fully expressed in the phenotype?", opts: ["Recessive", "Dominant", "Codominant", "Mutated"], ans: 2, exp: "Codominance means both alleles are expressed in the phenotype." },
                { q: "What are plant meristems capable of?", opts: ["Photosynthesis only", "Continuous cell division and differentiation", "Producing antibodies", "Respiration only"], ans: 1, exp: "Meristems divide continuously to allow plant growth." },
                { q: "What is genetic engineering?", opts: ["Selective breeding over centuries", "Modifying an organism's genome by introducing a gene from another organism", "Cell division by mitosis", "Natural selection"], ans: 1, exp: "Genetic engineering alters genomes directly." },
                { q: "What is a mutation?", opts: ["A permanent change in the nucleotide sequence of DNA", "A temporary protein fold", "Cell death", "Normal respiration"], ans: 0, exp: "Mutations are alterations in DNA base sequences." },
                { q: "What do tRNA molecules deliver to the ribosome during translation?", opts: ["mRNA templates", "Specific amino acids", "DNA strands", "Ribosomes"], ans: 1, exp: "tRNA brings specific amino acids matching mRNA codons." },
                { q: "What does diploid mean?", opts: ["Having single un-paired chromosomes", "Having two complete sets of paired chromosomes", "Having no nucleus", "Having three sets of chromosomes"], ans: 1, exp: "Diploid human somatic cells have 23 pairs (46 total) of chromosomes." },
                { q: "What sex chromosomes do human females possess?", opts: ["XY", "XX", "YY", "XO"], ans: 1, exp: "Human females possess two X chromosomes (XX)." },
                { q: "What is the function of a gene?", opts: ["To store energy", "To code for a specific sequence of amino acids forming a protein", "To produce glucose", "To destroy pathogens"], ans: 1, exp: "Genes contain instructions to build specific proteins." }
              ]
            },
            {
              id: "b2",
              code: "B2",
              name: "B2: Keeping Healthy",
              notes: [
                {
                  t: "Pathogens & Disease Transmission",
                  content: "Communicable diseases are caused by pathogens—microorganisms including bacteria, viruses, fungi, and protists that infect host organisms.",

          btn.classList.toggle('active', btn.getAttribute('data-subj') === subjKey);
        });

        document.documentElement.style.setProperty('--accent', SPEC_DATA[subjKey].color);
        updateUnitDropdown();
        render();
      };

      window.switchUnit = function (unitVal) {
        currentUnit = unitVal;
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        render();
      };

      window.switchTab = function (tabKey) {
        currentTab = tabKey;
        flipped = false;
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + tabKey);
        });
        render();
      };

      function updateUnitDropdown() {
        var select = document.getElementById('unit-select');
        var html = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        SPEC_DATA[currentSubj].units.forEach(function (u) {
          html += '<option value="' + u.id + '">' + u.name + '</option>';
        });
        select.innerHTML = html;
        select.value = currentUnit;
      }

      function getFilteredUnits() {
        var units = SPEC_DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getFilteredCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ unitName: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getFilteredQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          if (u.quiz) {
            u.quiz.forEach(function (q) {
              list.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp });
            });
          }
        });
        return list;
      }

      // RENDER FUNCTIONS
      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">OCR GCSE 21st Century</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.bullets && n.bullets.length) {
              html += '<ul>';
              n.bullets.forEach(function (b) {
                html += '<li>' + b + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getFilteredCards();
        if (cards.length === 0) return '<div class="unit-panel">No flashcards available for this filter.</div>';

        var c = cards[flashIdx % cards.length];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + cards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      function renderQuiz() {
        var quizList = getFilteredQuiz();
        if (quizList.length === 0) return '<div class="unit-panel">No quiz questions available for this unit filter.</div>';

        if (quizIdx >= quizList.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + quizScore + ' / ' + quizList.length + '</div>';
          html += '<p>Great job reviewing your OCR Science material!</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = quizList[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + quizList.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === getFilteredQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      // Initial initialization
      updateUnitDropdown();
      render();
    })();
  </script>
</body>
</html>
