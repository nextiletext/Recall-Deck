<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Eduqas GCSE Religious Studies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: var(--accent-ink); }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">Eduqas GCSE Religious Studies</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subjects"></div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="setTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="setTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="setTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unitSelect">Unit:</label>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'comp1';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var DATA = {
        comp1: {
          title: "Component 1: Religious Beliefs & Practices",
          units: [
            {
              id: "rs_c1",
              name: "Christianity: Beliefs & Practices",
              notes: [
                { t: "Core Beliefs & Nature of God", content: "Christianity is monotheistic, believing in one God expressed as the Holy Trinity (Father, Son, Holy Spirit).", points: ["Attributes of God: Omnipotent (all-powerful), Omnibenevolent (all-loving), Omniscient (all-knowing), and Just.", "The Trinity: God the Father (Creator), God the Son (Jesus incarnate), and God the Holy Spirit (guiding presence).", "Creation: Genesis states God created the universe ex nihilo (out of nothing). John's Gospel highlights the Logos (Word).", "Problem of Evil: The existence of moral and natural suffering poses questions against God's loving and powerful nature."] },
                { t: "Jesus, Salvation & Practices", content: "Salvation comes through grace and faith in Jesus Christ's incarnation, crucifixion, and resurrection.", points: ["Incarnation: God taking human form in Jesus Christ ('The Word became flesh').", "Atonement & Salvation: Jesus' sacrificial death mended humanity's broken relationship with God caused by original sin.", "Sacraments: Baptism (initiation) and Eucharist/Holy Communion (commemorating the Last Supper).", "Worship & Mission: Liturgical/Non-liturgical worship, prayer, pilgrimage (Lourdes, Iona), and evangelism."] }
              ],
              cards: [
                { q: "What is meant by the Holy Trinity in Christianity?", a: "The belief in one God existing as three co-equal persons: Father, Son, and Holy Spirit." },
                { q: "What is Atonement?", a: "The restoration of the relationship between God and humanity through the sacrifice of Jesus on the cross." }
              ],
              quiz: [
                { q: "What does the term 'Omnibenevolent' mean when describing God?", opts: ["All-knowing", "All-powerful", "All-loving", "Ever-present"], ans: 2 },
                { q: "What does creation 'ex nihilo' mean?", opts: ["Creation out of existing matter", "Creation out of nothing", "Evolution by natural selection", "Creation by the angels"], ans: 1 },
                { q: "Which person of the Trinity is described as the Logos (Word) in John's Gospel?", opts: ["God the Father", "God the Son (Jesus)", "God the Holy Spirit", "The Prophet Isaiah"], ans: 1 },
                { q: "What is Original Sin?", opts: ["The first lie ever told", "The inherent human tendency to sin inherited from Adam and Eve", "A sin committed during baptism", "Breaking the Sabbath"], ans: 1 },
                { q: "Which Christian sacrament commemorates the Last Supper with bread and wine?", opts: ["Confirmation", "Holy Orders", "Eucharist / Holy Communion", "Reconciliation"], ans: 2 },
                { q: "What is Liturgical Worship?", opts: ["Spontaneous prayer without a set structure", "A formal, structured church service following a set ritual", "Silent meditation in nature", "Street evangelism"], ans: 1 },
                { q: "Which pilgrimage site is associated with healing waters and visions of Mary?", opts: ["Iona", "Lourdes", "Rome", "Jerusalem"], ans: 1 },
                { q: "What is Atonement in Christian theology?", opts: ["Paying money to the church", "Mending the broken relationship between God and humanity through Jesus", "Performing good works to earn salvation", "Building new cathedrals"], ans: 1 },
                { q: "Which attribute means God is all-powerful?", opts: ["Omniscient", "Omnipresent", "Omnipotent", "Transcendent"], ans: 2 },
                { q: "What event marks God taking human form in Jesus Christ?", opts: ["Resurrection", "Ascension", "Incarnation", "Transfiguration"], ans: 2 },
                { q: "What term describes non-physical, spontaneous worship without set prayer books?", opts: ["Liturgical", "Non-liturgical", "Sacramental", "Orthodox"], ans: 1 },
                { q: "What is the Christian duty to spread the Gospel message called?", opts: ["Pilgrimage", "Evangelism / Mission", "Atonement", "Penance"], ans: 1 },
                { q: "Which Christian group practices infant baptism to wash away original sin?", opts: ["Baptists", "Roman Catholics", "Quakers", "Pentecostals"], ans: 1 },
                { q: "Where do Christians believe the Holy Spirit resides today?", opts: ["Only in heaven", "Within believers as a guiding presence", "Exclusively inside the Vatican", "In historical scriptures only"], ans: 1 },
                { q: "What is the Problem of Evil?", opts: ["The question of why humans commit crime", "The challenge of reconciling an all-loving, all-powerful God with suffering", "The debate over evolution", "The conflict between different denominations"], ans: 1 }
              ]
            },
            {
              id: "rs_i1",
              name: "Islam: Beliefs & Practices",
              notes: [
                { t: "Articles of Faith & Nature of Allah", content: "Islam is strictly monotheistic (Tawhid). Sunni Muslims follow the 6 Articles of Faith; Shi'a follow the 5 Roots.", points: ["Tawhid: The oneness and uniqueness of Allah (Shirk is the unforgivable sin of associating partners with God).", "Nature of Allah: Omnipotent, Beneficent, Merciful, Transcendent, Immanent, and Just (Adalat in Shi'a Islam).", "Risalah (Prophethood): Adam, Ibrahim, Musa, Isa, and Muhammad (the Seal of the Prophets).", "Holy Books: The Qur'an (uncorrupted word of Allah), Torah (Tawrat), Psalms (Zabur), Gospel (Injeel)."] },
                { t: "The Five Pillars & Duties", content: "Daily life is guided by obligatory acts of worship and service to Allah.", points: ["Shahadah: Declaration of faith ('There is no god but Allah, and Muhammad is his messenger').", "Salah: Five daily prayers facing the Ka'ba in Makkah (performing Wudu purification first).", "Zakah: Obligatory 2.5% charitable giving of surplus wealth to help the poor.", "Sawm & Hajj: Fasting during Ramadan and pilgrimage to Makkah at least once in a lifetime."] }
              ],
              cards: [
                { q: "What is Tawhid?", a: "The absolute oneness and uniqueness of Allah in Islam." },
                { q: "What are the Five Pillars of Islam?", a: "Shahadah (Faith), Salah (Prayer), Zakah (Charity), Sawm (Fasting), and Hajj (Pilgrimage)." }
              ],
              quiz: [
                { q: "What is Tawhid?", opts: ["Prophethood", "The oneness and uniqueness of Allah", "Day of Judgement", "Angelic duties"], ans: 1 },
                { q: "What is considered the unforgivable sin in Islam?", opts: ["Shirk (associating partners with Allah)", "Missing Friday prayer", "Eating pork accidentally", "Not giving extra charity"], ans: 0 },

                { q: "What month do Muslims observe Sawm (fasting)?", opts: ["Dhul Hijjah", "Ramadan", "Muharram", "Shawwal"], ans: 1 },
                { q: "Direction faced by Muslims during prayer towards Makkah is called what?", opts: ["Qiblah", "Minbar", "Mihrab", "Minaret"], ans: 0 },
                { q: "Which holy book was revealed to Prophet Musa (Moses)?", opts: ["Zabur", "Injeel", "Tawrat (Torah)", "Qur'an"], ans: 2 },
                { q: "What is Greater Jihad?", opts: ["Physical warfare to defend Islam", "The personal internal struggle to live a good Muslim life", "Pilgrimage to Madinah", "Memorizing the whole Qur'an"], ans: 1 },
                { q: "What is Lesser Jihad?", opts: ["Internal struggle against sin", "Outward military defense of Islam under strict moral rules", "Giving extra charity to family", "Fasting extra days"], ans: 1 },
                { q: "Which festival marks the end of Ramadan?", opts: ["Eid-ul-Adha", "Eid-ul-Fitr", "Ashura", "Mawlid"], ans: 1 },
                { q: "Which festival commemorates Ibrahim's willingness to sacrifice his son?", opts: ["Eid-ul-Fitr", "Eid-ul-Adha", "Ashura", "Ramadan"], ans: 1 },
                { q: "What are angels (Malaikah) made from according to Islamic tradition?", opts: ["Clay", "Smokeless fire", "Light (Nur)", "Water"], ans: 2 }
              ]
            }
          ]
        },
        comp2: {
          title: "Component 2: Religious, Philosophical & Ethical Studies",
          units: [
            {
              id: "eth_t1",
              name: "Theme 1: Issues of Relationships",
              notes: [
                { t: "Relationships, Marriage & Family", content: "Explores human relationships, marriage, sexuality, and family structures through religious and secular lenses.", points: ["Human Sexuality: Heterosexuality, homosexuality, and cohabitation. Varying Christian and Islamic viewpoints on pre-marital sex.", "Marriage & Divorce: Marriage as a holy sacrament or contract. Christian views on divorce (Catholic prohibition vs Protestant allowed on grounds of adultery). Islamic views (Divorce as a last resort).", "Sexual Equality & Roles: Gender roles in worship and family. Traditional patriarchal views vs modern egalitarian perspectives."] }
              ],
              cards: [
                { q: "What is Cohabitation?", a: "A couple living together in a romantic relationship without being legally married." }
              ],
              quiz: [
                { q: "What is Cohabitation?", opts: ["Getting married in a civil ceremony", "Living together in a sexual relationship without marriage", "Divorcing legally", "Single parenting"], ans: 1 },
                { q: "Why does the Roman Catholic Church oppose divorce?", opts: ["It is forbidden in civil law", "Marriage is a lifelong sacrament sealed by God that cannot be dissolved by humans", "It costs too much money", "It prevents cohabitation"], ans: 1 },

      function renderHeader() {
        var subHtml = '';
        var keys = ['comp1', 'comp2'];
        var labels = { comp1: 'Comp 1 (Beliefs & Practices)', comp2: 'Comp 2 (Ethical Themes)' };
        keys.forEach(function (k) {
          subHtml += '<button class="subj-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = isDark ? 'Dark Mode' : 'Light Mode';
      }

      window.toggleTheme = function() {
        isDark = !isDark;
        if (!isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + t);
        });
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ unitName: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">Eduqas GCSE RS</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        if (cards.length === 0) return '<div class="unit-panel">No flashcards available for this filter.</div>';

        var c = cards[qIdx % cards.length];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (qIdx + 1) + ' of ' + cards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        if (e) e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderQuiz() {
        var quiz = getQuiz();
        if (quiz.length === 0) return '<div class="unit-panel">No quiz questions available for this unit filter.</div>';

        if (quizIdx >= quiz.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + quizScore + ' / ' + quiz.length + '</div>';
          html += '<p>Fantastic work revising Eduqas GCSE Religious Studies!</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = quiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + quiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (!main) return;
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
