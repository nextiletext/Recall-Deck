<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Eduqas GCSE Religious Studies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #059669;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: var(--accent-ink); }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">Eduqas GCSE Religious Studies</span>
      </div>
      <div class="controls-top">
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="chris" onclick="switchSubject('chris')">Christianity</button>
          <button class="subj-btn" data-subj="islam" onclick="switchSubject('islam')">Islam</button>
          <button class="subj-btn" data-subj="theme" onclick="switchSubject('theme')">Philosophical Themes</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'chris';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var sessionCards = [];
      var sessionQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      function shuffleQuizQuestion(q) {
        var correctText = q.opts[q.ans];
        var shuffledOpts = shuffleArray(q.opts);
        var newAnsIndex = shuffledOpts.indexOf(correctText);
        return {
          unitName: q.unitName,
          q: q.q,
          opts: shuffledOpts,
          ans: newAnsIndex,
          exp: q.exp
        };
      }

      var SPEC_DATA = {
        chris: {
          title: "Christian Beliefs & Practices",
          color: "#00c896",
          units: [
            {
              id: "c1",
              code: "C1",
              name: "Christianity: Beliefs & Teachings",
              notes: [
                {
                  t: "Nature of God & The Trinity",
                  content: "Christians believe in one God (monotheism) who exists as three persons: Father, Son, and Holy Spirit.",
                  bullets: [
                    "Omnipotence: All-powerful creator of the universe.",
                    "Omnibenevolence: All-loving, demonstrated through Jesus' sacrifice (John 3:16).",
                    "Omniscient & Omnipresent: All-knowing and present everywhere.",
                    "The Trinity: God the Father (Creator), God the Son (Jesus the Redeemer), God the Holy Spirit (Guide and comforter present in the world)."
                  ]
                },
                {
                  t: "Creation, Afterlife & Salvation",
                  content: "Key beliefs regarding origin, destiny, and redemption.",
                  bullets: [
                    "Creation: Genesis 1 (God created world in 6 days out of nothing - ex nihilo). John 1 states the Word (Jesus) was present at creation.",
                    "Afterlife: Belief in resurrection of the body or soul, Judgment Day by Jesus, Heaven (eternal paradise with God) and Hell (separation from God).",
                    "Salvation: Deliverance from sin, achieved through grace (unearned gift from God) or works (following God's laws). Jesus' atonement pays the price for human sin."
                  ]
                }
              ],
              cards: [
                { q: "What is monotheism?", a: "Belief in one single God." },
                { q: "Define God's omnipotence.", a: "God is all-powerful." },
                { q: "Define God's omnibenevolence.", a: "God is all-loving." },
                { q: "What are the three persons of the Holy Trinity?", a: "Father, Son, and Holy Spirit." },
                { q: "What does 'creation ex nihilo' mean?", a: "Creation out of nothing." },
                { q: "What role did 'The Word' play in creation according to John 1?", a: "Jesus was present with God and involved in creating the universe." },
                { q: "What is the Incarnation?", a: "God becoming human flesh in the person of Jesus Christ." },
                { q: "What is atonement in Christianity?", a: "Restoring the broken relationship between God and humanity through Jesus' death." },
                { q: "What is salvation by grace?", a: "Salvation given freely as an unearned gift from God through faith." },
                { q: "What is salvation by works?", a: "Earning salvation through obeying God's laws and doing good deeds." },
                { q: "What is Resurrection?", a: "Rising from the dead, as Jesus did on the third day after crucifixion." },
                { q: "What is the Christian concept of Heaven?", a: "A state or place of eternal peace and presence with God after death." },
                { q: "What is the Christian concept of Hell?", a: "Eternal separation from God's presence and love." },
                { q: "What is the Problem of Evil?", a: "The contradiction between an all-powerful, all-loving God and the existence of evil and suffering." },
                { q: "What is moral evil?", a: "Suffering caused by free human actions and choices (e.g., murder, theft)." },
                { q: "What is natural evil?", a: "Suffering caused by natural processes (e.g., earthquakes, tsunamis)." },
                { q: "What was Jesus' Crucifixion?", a: "Jesus' execution on a wooden cross by the Romans to pay for human sins." },
                { q: "What is the Ascension?", a: "Jesus rising into Heaven 40 days after his resurrection." },
                { q: "What is original sin?", a: "The tendency to sin inherited from Adam and Eve's disobedience in Genesis." },
                { q: "What does Grace mean in Christian theology?", a: "God's unconditional, unearned love and favor towards humanity." },
                { q: "What is Purgatory in Catholic belief?", a: "A state of cleansing and purification for souls before entering Heaven." },
                { q: "What is General Revelation?", a: "God revealing himself through nature, conscience, and reason." },
                { q: "What is Special Revelation?", a: "God revealing himself directly through miracles, visions, or scripture." },
                { q: "What is the Law in the Old Testament?", a: "The 613 commandments given to Moses, including the Ten Commandments." },
                { q: "What is the Gospel?", a: "The 'Good News' of Jesus Christ recorded in the New Testament." }
              ],
              quiz: [
                { q: "What term describes the belief in one God?", opts: ["Polytheism", "Monotheism", "Atheism", "Agnosticism"], ans: 1, exp: "Monotheism is the belief in a single God." },
                { q: "Which person of the Trinity is known as the Redeemer?", opts: ["The Father", "The Son (Jesus)", "The Holy Spirit", "The Creator"], ans: 1, exp: "Jesus the Son redeemed humanity through his sacrifice." },
                { q: "What does 'ex nihilo' mean in Genesis creation accounts?", opts: ["Out of chaos", "Out of nothing", "Out of water", "Out of light"], ans: 1, exp: "Ex nihilo means creation out of nothing." },
                { q: "Which term refers to God taking human form in Jesus?", opts: ["Resurrection", "Atonement", "Incarnation", "Transfiguration"], ans: 2, exp: "Incarnation means God becoming flesh." },
                { q: "What is salvation by grace?", opts: ["Earning entry to heaven by good deeds", "Unearned gift of God's forgiveness through faith", "Paying money to the church", "Following dietary rules"], ans: 1, exp: "Grace is an unearned gift of divine love." },
                { q: "What type of evil is caused by human choices?", opts: ["Natural evil", "Moral evil", "Cosmic evil", "Physical evil"], ans: 1, exp: "Moral evil results from human free will and actions." },
                { q: "What event marks Jesus returning to Heaven 40 days post-resurrection?", opts: ["Crucifixion", "Ascension", "Baptism", "Epiphany"], ans: 1, exp: "The Ascension is Jesus returning to Heaven." },
                { q: "Which Christian denomination believes in Purgatory?", opts: ["Quakers", "Roman Catholics", "Baptists", "Methodists"], ans: 1, exp: "Catholicism teaches Purgatory cleanses souls before Heaven." },
                { q: "What does Atonement mean?", opts: ["Creating the world", "Restoring the relationship between God and humanity", "Judging non-believers", "Baptizing infants"], ans: 1, exp: "Atonement repairs the breach between God and mankind." },
                { q: "What Bible verse states 'For God so loved the world that he gave his one and only Son'?", opts: ["Genesis 1:1", "John 3:16", "Exodus 20:3", "Matthew 5:7"], ans: 1, exp: "John 3:16 highlights God's love through Christ." },
                { q: "What term describes God as all-knowing?", opts: ["Omnipotent", "Omnipresent", "Omniscient", "Omnibenevolent"], ans: 2, exp: "Omniscient means all-knowing." },
                { q: "Which event represents the ultimate sacrifice for human sin in Christian theology?", opts: ["The Last Supper", "Jesus' Crucifixion", "The Temptation in the Desert", "The Wedding at Cana"], ans: 1, exp: "The Crucifixion paid the debt of sin." },
                { q: "What is the primary role of the Holy Spirit?", opts: ["Creating physical matter", "Guiding, comforting, and inspiring believers", "Judging souls at death", "Writing scripture"], ans: 1, exp: "The Holy Spirit acts as a guide and helper." },
                { q: "What is original sin derived from?", opts: ["The Tower of Babel", "Adam and Eve's disobedience in Eden", "The crucifixion", "The golden calf"], ans: 1, exp: "Original sin stems from the Fall of Man in Genesis." },
                { q: "What type of revelation occurs through observing nature?", opts: ["Special Revelation", "General Revelation", "Direct Revelation", "Scriptural Revelation"], ans: 1, exp: "General revelation is experienced through the natural world." },
                { q: "What does the word 'Gospel' mean?", opts: ["Holy Law", "Good News", "Divine Truth", "Sacred Story"], ans: 1, exp: "Gospel translates to 'Good News'." },
                { q: "What is the Inconsistent Triad?", opts: ["Father, Son, and Spirit", "Omnipotence, Omnibenevolence, and the existence of evil", "Faith, Hope, and Charity", "Heaven, Hell, and Purgatory"], ans: 1, exp: "The Inconsistent Triad frames the problem of evil." },
                { q: "What is the second coming of Jesus known as?", opts: ["Eucharist", "Parousia", "Pentecost", "Annunciation"], ans: 1, exp: "Parousia is Christ's expected return." },
                { q: "According to Christian belief, who will judge all human souls?", opts: ["Moses", "Jesus Christ", "Saint Peter", "The Angels"], ans: 1, exp: "Jesus acts as the divine judge of humanity." },
                { q: "What is the Christian belief in the bodily rising of the dead?", opts: ["Reincarnation", "Resurrection", "Transmigration", "Evolution"], ans: 1, exp: "Resurrection is rising bodily or spiritually after death." },
                { q: "Which term describes God as present everywhere?", opts: ["Omniscient", "Omnipresent", "Omnipotent", "Transcendent"], ans: 1, exp: "Omnipresent means present everywhere." },
                { q: "What attribute means God is beyond space and time?", opts: ["Immanent", "Transcendent", "Omnibenevolent", "Personal"], ans: 1, exp: "Transcendence means beyond physical existence." },
                { q: "What attribute means God is actively involved in the world?", opts: ["Transcendent", "Immanent", "Unreachable", "Deistic"], ans: 1, exp: "Immanence means God is active within creation." },
                { q: "What is the term for God's merciful willingness to forgive sin?", opts: ["Justice", "Grace", "Judgment", "Karma"], ans: 1, exp: "Grace reflects divine mercy and undeserved favor." },
                { q: "Which Christian creed outlines key doctrines about the Trinity?", opts: ["The Nicene Creed", "The Magna Carta", "The 95 Theses", "The Ten Commandments"], ans: 0, exp: "The Nicene Creed codifies belief in the Trinity." }
              ]
            }
          ]
        },
        islam: {
          title: "Islamic Beliefs & Practices",
          color: "#10b981",
          units: [
            {
              id: "i1",
              code: "I1",
              name: "Islam: Beliefs, Teachings & Practices",

      function initSessionData() {
        var rawCards = [];
        var rawQuiz = [];

        var units = getFilteredUnits();
        units.forEach(function(u) {
          if (u.cards) {
            u.cards.forEach(function(c) {
              rawCards.push({ unitName: u.name, q: c.q, a: c.a });
            });
          }
          if (u.quiz) {
            u.quiz.forEach(function(q) {
              rawQuiz.push(shuffleQuizQuestion({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans, exp: q.exp }));
            });
          }
        });

        sessionCards = shuffleArray(rawCards);
        sessionQuiz = shuffleArray(rawQuiz);
      }

      window.toggleTheme = function () {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('theme-btn').innerText = 'Dark Mode';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.getElementById('theme-btn').innerText = 'Light Mode';
        }
      };

      window.switchSubject = function (subjKey) {
        currentSubj = subjKey;
        currentUnit = 'all';
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;

        document.querySelectorAll('.subj-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-subj') === subjKey);
        });

        document.documentElement.style.setProperty('--accent', SPEC_DATA[subjKey].color);
        updateUnitDropdown();
        initSessionData();
        render();
      };

      window.switchUnit = function (unitVal) {
        currentUnit = unitVal;
        flashIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        initSessionData();
        render();
      };

      window.switchTab = function (tabKey) {
        currentTab = tabKey;
        flipped = false;
        if (tabKey === 'study' || tabKey === 'quiz') {
          initSessionData();
          flashIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0;
        }
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + tabKey);
        });
        render();
      };

      function updateUnitDropdown() {
        var select = document.getElementById('unit-select');
        if (!select) return;
        var html = '<option value="all">All Units (' + currentSubj.toUpperCase() + ')</option>';
        if (SPEC_DATA[currentSubj] && SPEC_DATA[currentSubj].units) {
          SPEC_DATA[currentSubj].units.forEach(function (u) {
            html += '<option value="' + u.id + '">' + u.name + '</option>';
          });
        }
        select.innerHTML = html;
        select.value = currentUnit;
      }

      function getFilteredUnits() {
        if (!SPEC_DATA[currentSubj]) return [];
        var units = SPEC_DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">Eduqas GCSE RS</span></div>';
          if (u.notes) {
            u.notes.forEach(function (n) {
              html += '<div class="note-block">';
              html += '<h4>' + n.t + '</h4>';
              if (n.content) html += '<p>' + n.content + '</p>';
              if (n.bullets && n.bullets.length) {
                html += '<ul>';
                n.bullets.forEach(function (b) {
                  html += '<li>' + b + '</li>';
                });
                html += '</ul>';
              }
              html += '</div>';
            });
          }
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (sessionCards.length === 0) initSessionData();

        if (flashIdx >= sessionCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You have reviewed all <b>' + sessionCards.length + '</b> unique flashcards for this topic.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = sessionCards[flashIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + sessionCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      window.resetFlashcards = function () {
        flashIdx = 0;
        flipped = false;
        initSessionData();
        render();
      };

      function renderQuiz() {
        if (sessionQuiz.length === 0) initSessionData();

        if (quizIdx >= sessionQuiz.length) {
          var pct = Math.round((quizScore / sessionQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + sessionQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = sessionQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + sessionQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === sessionQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        initSessionData();
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (!main) return;
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      updateUnitDropdown();
      initSessionData();
      render();
    })();
  </script>
</body>
</html>
