<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Eduqas GCSE Religious Studies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0d1318;
      --surface: #141c24;
      --surface-card: #19232c;
      --ink: #e8edf0;
      --muted: #8a9ba8;
      --line: #24323e;
      --accent: #00c896;
      --accent-ink: #0d1318;
      --good: #4fc596;
      --bad: #f0707a;
      --track: #26333d;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --surface-card: #ffffff;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #a8480c;
      --accent-ink: #ffffff;
      --good: #17744f;
      --bad: #b4262f;
      --track: #dde3e7;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .top-box {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; letter-spacing: -0.02em; margin: 0; }
    .brand .sub { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; margin-top: 4px; display: block; }
    
    .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pill-picker { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 30px; padding: 4px; gap: 4px; }
    .pill-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
      border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .pill-btn.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

    .mode-btn {
      font-family: var(--body); font-size: 0.85rem; padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--ink); }

    .nav-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 2px; flex-wrap: wrap;
    }
    .tabs { display: flex; gap: 4px; overflow-x: auto; }
    .tabs button {
      background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
      font: 500 0.95rem var(--body); padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    .unit-select-wrap { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    select {
      font: 400 0.85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; max-width: 320px;
    }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .unit-title-header { font-family: var(--display); font-size: 1.4rem; color: var(--accent); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .unit-sub-tag { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; text-transform: uppercase; }

    .cognito-card {
      background: var(--surface-card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
      border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
    }
    .cognito-card h3 { font-family: var(--display); font-size: 1.1rem; margin: 0; color: var(--ink); }
    .cognito-card p { margin: 0; font-size: 0.95rem; color: var(--ink); line-height: 1.6; }
    .cognito-card ul { margin: 4px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 0.92rem; display: flex; flex-direction: column; gap: 6px; }

    .flashcard {
      background: var(--surface-card); border: 1px solid var(--line); border-radius: 8px; padding: 32px 24px;
      min-height: 280px; display: flex; flex-direction: column; gap: 18px; cursor: pointer; user-select: none;
    }
    .topic-tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .q-text { font-family: var(--display); font-weight: 500; font-size: 1.35rem; line-height: 1.3; margin: 0; }
    .ans-text { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; color: var(--ink); }
    .card-hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      font: 600 1rem var(--body); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface-card); color: var(--ink); cursor: pointer; text-align: center;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: var(--bad); }
    .btn.hit { color: var(--good); border-color: var(--good); }

    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt { display: flex; gap: 10px; text-align: left; width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; cursor: pointer; }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt.right { border-color: var(--good); background: rgba(79, 197, 150, 0.1); }
    .opt.wrong { border-color: var(--bad); background: rgba(240, 112, 122, 0.1); }
  </style>
</head>

      function renderHeader() {
        var subHtml = '';
        var keys = ['comp1', 'comp2'];
        var labels = { comp1: 'Component 1 (Beliefs & Practices)', comp2: 'Component 2 (Ethical Themes)' };
        keys.forEach(function (k) {
          subHtml += '<button class="pill-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var navHtml = '';
        var tabs = [
          { id: 'notes', label: 'Detailed Notes' },
          { id: 'study', label: 'Flashcards' },
          { id: 'quiz', label: 'Practice Quiz' }
        ];
        tabs.forEach(function (t) {
          navHtml += '<button aria-selected="' + (tab === t.id) + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
        });
        document.getElementById('tabs').innerHTML = navHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
      }

      window.toggleTheme = function() {
        theme = theme === 'dark' ? 'light' : 'dark';
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ topic: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ topic: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderNotes() {
        var html = '<div class="panel">';
        html += '<h2 style="font-family:var(--display); font-size:1.3rem; margin:0;">' + DATA[currentSubj].title + ' — Revision Guide</h2>';
        getFilteredUnits().forEach(function (u) {
          html += '<div style="margin-top:20px;">';
          html += '<div class="unit-title-header"><span>' + u.name + '</span><span class="unit-sub-tag">Eduqas GCSE RS</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="cognito-card">';
            html += '<h3>' + n.t + '</h3>';
            html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        if (cards.length === 0) return '<div class="panel">No flashcards available for this unit.</div>';
        var c = cards[qIdx % cards.length];
        var html = '<div class="flashcard" onclick="flipCard()">';
        html += '<div class="topic-tag"><span>' + c.topic + '</span><span>Card ' + (qIdx + 1) + ' / ' + cards.length + '</span></div>';
        html += '<div class="q-text">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="ans-text">' + c.a + '</div>';
        } else {
          html += '<div class="card-hint">Click card to reveal detailed answer</div>';
        }
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">Missed it</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">Got it</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderQuiz() {
        var quiz = getQuiz();
        if (quiz.length === 0) return '<div class="panel">No quiz questions available for this unit.</div>';
        if (quizIdx >= quiz.length) {
          var html = '<div class="panel" style="text-align:center; padding:32px;">';
          html += '<h2>Quiz Complete!</h2>';
          html += '<p style="font-size:1.1rem; margin:12px 0;">Your Score: <b>' + quizScore + ' / ' + quiz.length + '</b></p>';
          html += '<button class="btn primary" style="max-width:200px; margin:0 auto;" onclick="resetQuiz()">Try Again</button>';
          html += '</div>';
          return html;
        }

        var q = quiz[quizIdx];
        var html = '<div class="panel">';
        html += '<div class="topic-tag"><span>' + q.topic + '</span><span>Question ' + (quizIdx + 1) + ' / ' + quiz.length + '</span></div>';
        html += '<div class="q-text">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">' + opt + '</button>';
        });
        html += '</div>';
        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:12px;" onclick="nextQuiz()">Next Question</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
