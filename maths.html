<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Edexcel GCSE Maths</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #2563eb;
      --accent-ink: #ffffff;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #1d4ed8;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">Edexcel GCSE Maths (1MA1)</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" onclick="setSubj('tier1')">Edexcel GCSE Maths</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="setTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="setTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="setTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unitSelect">Unit:</label>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'tier1';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var shuffledCards = [];
      var shuffledQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      function shuffleQuizQuestion(q) {
        var correctText = q.opts[q.ans];
        var shuffledOpts = shuffleArray(q.opts);
        var newAnsIndex = shuffledOpts.indexOf(correctText);
        return {
          unitName: q.unitName,
          q: q.q,
          opts: shuffledOpts,
          ans: newAnsIndex
        };
      }

      var DATA = {
        tier1: {
          title: "Edexcel GCSE Maths Core Topics",
          units: [
            {
              id: "m1",
              name: "1. Number & Calculation",
              notes: [
                {
                  t: "Indices & Standard Form",
                  content: "Rules of indices govern powers: a^m × a^n = a^(m+n), a^m ÷ a^n = a^(m-n), (a^m)^n = a^(m×n), a^0 = 1, a^(-n) = 1/a^n, a^(1/n) = ⁿ√a.",
                  points: [
                    "Standard Form: Expressed as A × 10^n where 1 ≤ A < 10 and n is an integer.",
                    "Worked Example (Standard Form): (3 × 10^4) × (5 × 10^6) = 15 × 10^10 = 1.5 × 10^11.",
                    "Worked Example (Negative Indices): 8^(-2/3) = 1 / (8^(2/3)) = 1 / (³√8)² = 1 / (2²) = 1/4."
                  ]
                },
                {
                  t: "Surds & Exact Calculations",
                  content: "Surds are irrational roots that cannot be written as exact fractions. Rules: √(ab) = √a × √b, √(a/b) = √a / √b.",
                  points: [
                    "Simplifying Surds: Find the largest square factor. E.g., √72 = √(36 × 2) = 6√2.",
                    "Rationalising Denominators: Multiply numerator and denominator by surd. E.g., 6 / √3 = (6√3) / 3 = 2√3."
                  ]
                }
              ],
              cards: [
                { q: "What is a rational number?", a: "A number that can be expressed as a fraction a/b where a and b are integers." },
                { q: "What is an irrational number?", a: "A number that cannot be written as a fraction of integers (e.g. π, √2)." },
                { q: "What is a surd?", a: "An unsimplified root of a number that results in an irrational value." },
                { q: "What is the rule for a^0?", a: "Any non-zero number raised to the power of 0 equals 1." },
                { q: "What does a^(-n) mean?", a: "1 / (a^n) — the reciprocal of a^n." },
                { q: "What does a^(1/n) mean?", a: "The nth root of a (ⁿ√a)." },
                { q: "Standard form format constraint for A × 10^n?", a: "1 ≤ A < 10, and n must be an integer." },
                { q: "What is a prime number?", a: "An integer greater than 1 with exactly two factors: 1 and itself." },
                { q: "What is HCF?", a: "Highest Common Factor — the largest factor shared by two or more numbers." },
                { q: "What is LCM?", a: "Lowest Common Multiple — the smallest multiple shared by two or more numbers." },
                { q: "What is the value of 27^(2/3)?", a: "(³√27)² = 3² = 9." },
                { q: "Simplify √50 in exact surd form.", a: "√(25 × 2) = 5√2." },
                { q: "Rationalise 10 / √5.", a: "(10√5) / 5 = 2√5." },
                { q: "What is a truncating error bound?", a: "Cutting off digits without rounding; bound is from value to value + 1 in last kept digit." },
                { q: "What is error interval for x rounded to 1 d.p. as 4.3?", a: "4.25 ≤ x < 4.35." },
                { q: "What is a reciprocal?", a: "The value obtained by dividing 1 by the number (1/x)." },
                { q: "What is prime factor decomposition?", a: "Expressing a number as the product of its prime factors (e.g., 12 = 2² × 3)." },
                { q: "Simplify (2 × 10^3) × (4 × 10^5) in standard form.", a: "8 × 10^8." },
                { q: "Simplify (6 × 10^7) ÷ (3 × 10^2) in standard form.", a: "2 × 10^5." },
                { q: "What is 4^(-1)?", a: "1/4 or 0.25." },
                { q: "Simplify √12 + √27.", a: "2√3 + 3√3 = 5√3." },
                { q: "What is upper bound of 15 rounded to nearest integer?", a: "15.5." },
                { q: "What is lower bound of 15 rounded to nearest integer?", a: "14.5." },
                { q: "Convert 0.333... recurring into a fraction.", a: "1/3." },
                { q: "Convert 0.1666... recurring into a fraction.", a: "1/6." }
              ],
              quiz: [
                { q: "Simplify 8^(-2/3):", opts: ["-4", "1/4", "4", "1/8"], ans: 1 },
                { q: "Express 0.00045 in standard form:", opts: ["4.5 × 10^(-4)", "45 × 10^(-5)", "4.5 × 10^4", "0.45 × 10^(-3)"], ans: 0 },
                { q: "Simplify √72 in exact surd form:", opts: ["3√8", "6√2", "2√18", "36√2"], ans: 1 },
                { q: "Rationalise the denominator of 6 / √3:", opts: ["2√3", "3√6", "6√3", "2"], ans: 0 },
                { q: "What is the value of 16^(3/4)?", opts: ["6", "8", "12", "64"], ans: 1 },
                { q: "Calculate (4 × 10^5) × (3 × 10^4) in standard form:", opts: ["12 × 10^9", "1.2 × 10^10", "1.2 × 10^9", "12 × 10^20"], ans: 1 },
                { q: "What is the value of 5^0?", opts: ["0", "1", "5", "Undefined"], ans: 1 },
                { q: "Simplify √50 + √18:", opts: ["√68", "8√2", "15√2", "2√8"], ans: 1 },
                { q: "Number x is rounded to 1 decimal place as 7.4. What is the error interval?", opts: ["7.35 ≤ x < 7.45", "7.35 < x ≤ 7.45", "7.30 ≤ x < 7.50", "7.39 ≤ x < 7.41"], ans: 0 },
                { q: "Express 64^(-1/2) as a fraction:", opts: ["-32", "1/8", "-1/8", "8"], ans: 1 },
                { q: "Find HCF of 24 and 36:", opts: ["6", "12", "72", "3"], ans: 1 },
                { q: "Find LCM of 12 and 15:", opts: ["3", "30", "60", "180"], ans: 2 },
                { q: "Express 0.777... as a fraction in simplest form:", opts: ["7/10", "7/9", "77/100", "7/99"], ans: 1 },
                { q: "Simplify 27^(4/3):", opts: ["81", "36", "9", "243"], ans: 0 },
                { q: "Rationalise 14 / √7:", opts: ["2√7", "7√2", "14√7", "2"], ans: 0 },
                { q: "Which of the following is an irrational number?", opts: ["√16", "0.25", "√3", "22/7"], ans: 2 },
                { q: "Write 0.0000038 in standard form:", opts: ["3.8 × 10^(-6)", "3.8 × 10^(-5)", "38 × 10^(-7)", "0.38 × 10^(-5)"], ans: 0 },
                { q: "What is reciprocal of 0.2?", opts: ["5", "2", "0.5", "-0.2"], ans: 0 },
                { q: "A boundary value problem has length L = 8.4cm (1 d.p.). Lower bound is:", opts: ["8.35", "8.3", "8.4", "8.39"], ans: 0 },
                { q: "Simplify √18 / √2:", opts: ["3", "9", "√9", "√16"], ans: 0 },
                { q: "Evaluate 9^(-1.5):", opts: ["1/27", "-27", "1/81", "27"], ans: 0 },
                { q: "Which is prime factor decomposition of 60?", opts: ["2² × 3 × 5", "2 × 30", "4 × 15", "2³ × 5"], ans: 0 },
                { q: "Calculate (8 × 10^8) ÷ (2 × 10^(-3)) in standard form:", opts: ["4 × 10^11", "4 × 10^5", "4 × 10^(-24)", "16 × 10^11"], ans: 0 },
                { q: "Express recurring decimal 0.232323... as fraction:", opts: ["23/99", "23/100", "23/90", "2/9"], ans: 0 },
                { q: "Estimate value of √48 to nearest integer:", opts: ["7", "6", "8", "5"], ans: 0 }
              ])
            },
            {
              id: "m2",
              name: "2. Algebra & Graphs",
              notes: [
                {
                  t: "Quadratics: Factoring, Completing Square & Formula",
                  content: "Quadratic equations take form ax² + bx + c = 0. Solved via factoring, completing the square, or quadratic formula: x = (-b ± √(b² - 4ac)) / (2a).",
                  points: [
                    "Completing the Square: x² + bx + c = (x + b/2)² - (b/2)² + c.",
                    "Worked Example: Solve x² - 6x + 2 = 0 by completing square: (x - 3)² - 9 + 2 = 0 => (x - 3)² = 7 => x = 3 ± √7."
                  ]
                },
                {
                  t: "Linear Graphs & Parallel/Perpendicular Lines",
                  content: "y = mx + c where m is gradient and c is y-intercept. Parallel lines have m1 = m2. Perpendicular lines have m1 × m2 = -1.",
                  points: [
                    "Worked Example: Line L1 has y = 3x + 2. Find perpendicular line passing through (6, 1): Perpendicular gradient = -1/3. Equation: y - 1 = -1/3(x - 6) => y = -1/3x + 3."
                  ]
                }

      function updateUnitDropdown() {
        var select = document.getElementById('unitSelect');
        if (!select) return;
        var html = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          html += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        select.innerHTML = html;
        select.value = currentUnit;
      }

      function initSessionData() {
        var rawCards = [];
        var rawQuiz = [];

        var units = DATA[currentSubj].units;
        var filtered = currentUnit === 'all' ? units : units.filter(function(u) { return u.id === currentUnit; });

        filtered.forEach(function(u) {
          if (u.cards) {
            u.cards.forEach(function(c) {
              rawCards.push({ unitName: u.name, q: c.q, a: c.a });
            });
          }
          if (u.quiz) {
            u.quiz.forEach(function(q) {
              rawQuiz.push(shuffleQuizQuestion({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans }));
            });
          }
        });

        shuffledCards = shuffleArray(rawCards);
        shuffledQuiz = shuffleArray(rawQuiz);
      }

      window.toggleTheme = function() {
        isDark = !isDark;
        if (!isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.getElementById('themeBtn').textContent = 'Light Mode';
        } else {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('themeBtn').textContent = 'Dark Mode';
        }
      };

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        updateUnitDropdown();
        initSessionData();
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        if (t === 'study' || t === 'quiz') {
          initSessionData();
          qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0;
        }
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + t);
        });
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">Edexcel GCSE Maths</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (shuffledCards.length === 0) initSessionData();

        if (qIdx >= shuffledCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You have reviewed all <b>' + shuffledCards.length + '</b> unique flashcards for this selection.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = shuffledCards[qIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (qIdx + 1) + ' of ' + shuffledCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        if (e) e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      window.resetFlashcards = function () {
        qIdx = 0;
        flipped = false;
        shuffledCards = shuffleArray(shuffledCards);
        render();
      };

      function renderQuiz() {
        if (shuffledQuiz.length === 0) initSessionData();

        if (quizIdx >= shuffledQuiz.length) {
          var pct = Math.round((quizScore / shuffledQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + shuffledQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = shuffledQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + shuffledQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === shuffledQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        initSessionData();
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (!main) return;
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      document.addEventListener('DOMContentLoaded', function () {
        updateUnitDropdown();
        initSessionData();
        render();
      });
    })();
  </script>
