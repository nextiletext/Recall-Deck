<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Edexcel GCSE Psychology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #a855f7;
      --accent-ink: #ffffff;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #9333ea;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .explanation {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    .explanation b { color: var(--accent); }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">Edexcel GCSE Psychology (1PS0)</span>
      </div>
      <div class="controls-top">
        <div class="subject-picker" id="subject-picker">
          <button class="subj-btn active" data-subj="mem" onclick="switchSubject('mem')">Memory</button>
          <button class="subj-btn" data-subj="dev" onclick="switchSubject('dev')">Development</button>
          <button class="subj-btn" data-subj="soc" onclick="switchSubject('soc')">Social Influence</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="switchTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="switchTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="switchTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unit-select">Unit:</label>
        <select id="unit-select" onchange="switchUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'mem';
      var currentUnit = 'all';
      var currentTab = 'notes';
      var flipped = false;
      var flashIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var sessionCards = [];
      var sessionQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      function shuffleQuizQuestion(q) {
        var correctText = q.opts[q.ans];
        var shuffledOpts = shuffleArray(q.opts);
        var newAnsIndex = shuffledOpts.indexOf(correctText);
        return {
          unitName: q.unitName,
          q: q.q,
          opts: shuffledOpts,
          ans: newAnsIndex,
          exp: q.exp
        };
      }

      var SPEC_DATA = {
        mem: {
          title: "Topic 1: Development of Memory",
          color: "#a855f7",
          units: [
            {
              id: "psy_mem",
              code: "PSY1",
              name: "Unit 1: Memory Models & Key Studies",
              notes: [
                {
                  t: "Atkinson & Shiffrin (1968) Multi-Store Model of Memory (MSM)",
                  content: "The MSM explains memory as a linear flow of information through three separate structural stores:",
                  bullets: [
                    "Sensory Register (SR): High capacity, very brief duration (< 0.5s). Information enters via senses; requires attention to move to STM.",
                    "Short-Term Memory (STM): Limited capacity (7 ± 2 items), duration of ~18-30 seconds. Encodes acoustically. Rehearsal transfers data to LTM.",
                    "Long-Term Memory (LTM): Unlimited capacity, potentially lifelong duration. Encodes semantically. Information is retrieved back into STM.",
                    "Evaluation: (+) Supported by brain damage cases (e.g. HM, who could form no new LTM but retained normal STM). (-) Oversimplifies memory by treating STM and LTM as single unified stores."
                  ]
                },
                {
                  t: "Barlett (1932) Reconstructive Memory & Schema Theory",
                  content: "Memory is active and reconstructive rather than an exact recording of events.",
                  bullets: [
                    "Schemas: Mental frameworks of knowledge and expectations built from past experiences.",
                    "Reconstructive Process: When recalling information, we fill in missing details using schemas, leading to assimilation (changing details to fit expectations), levelling (omitting details), and sharpening (adding details).",
                    "Core Study - Bartlett 'War of the Ghosts': Participants read a Native American folk tale and recalled it over time. Recalls became shorter, more westernized (e.g., 'canoes' changed to 'boats'), and rationalized.",
                    "Evaluation: (+) Explains eyewitness testimony inaccuracies. (-) Lacked standardized procedures and strict scientific controls."
                  ]
                },
                {
                  t: "Peterson & Peterson (1959) Trigram Study",
                  content: "Investigated the duration of short-term memory without rehearsal.",
                  bullets: [
                    "Procedure: Participants were shown 3-consonant trigrams (e.g., CPJ) and asked to count backwards in 3s from a given number to prevent rehearsal. Recalled after delays of 3, 6, 9, 12, 15, or 18 seconds.",
                    "Findings: 80% recall after 3 seconds, but drops to under 10% after 18 seconds.",
                    "Conclusion: Short-term memory duration is strictly limited to around 18-30 seconds without active rehearsal.",
                    "Evaluation: (+) Highly controlled laboratory experiment. (-) Low ecological validity (trigrams do not reflect everyday memory tasks)."
                  ]
                }
              ],
              cards: [
                { q: "What is the capacity of Short-Term Memory (STM)?", a: "7 ± 2 items (Miller, 1956)." },
                { q: "What is the duration of Short-Term Memory without rehearsal?", a: "18 to 30 seconds (Peterson & Peterson, 1959)." },
                { q: "How is information encoded in Short-Term Memory?", a: "Primarily acoustically (by sound)." },
                { q: "How is information encoded in Long-Term Memory?", a: "Primarily semantically (by meaning)." },
                { q: "What is a schema?", a: "A mental framework of knowledge and expectations built from past experience." },
                { q: "What does Bartlett's Reconstructive Memory theory state?", a: "Memory is an active reconstruction process influenced by schemas, not a direct recording." },
                { q: "What is assimilation in reconstructive memory?", a: "Changing details in a memory so they fit existing cultural expectations or schemas." },
                { q: "What is levelling in reconstructive memory?", a: "Omitting confusing or unfamiliar details when recalling a story or event." },
                { q: "What is sharpening in reconstructive memory?", a: "Adding or exaggerating details to make a recalled story make more sense." },
                { q: "What was the main finding of Peterson & Peterson (1959)?", a: "STM duration drops to less than 10% after 18 seconds without rehearsal." },
                { q: "Why were participants asked to count backwards in Peterson & Peterson's study?", a: "To prevent verbal rehearsal of the consonant trigrams." },
                { q: "What is retrograde amnesia?", a: "Inability to recall memories formed before the brain injury occurred." },
                { q: "What is anterograde amnesia?", a: "Inability to create new long-term memories after the brain injury occurred." },
                { q: "Which brain structure is critical for consolidating long-term memories?", a: "The hippocampus." },
                { q: "What is maintenance rehearsal?", a: "Repeating information continuously to keep it in STM or transfer it to LTM." },
                { q: "What is semantic memory?", a: "Memory for general knowledge, facts, and concepts about the world." },
                { q: "What is episodic memory?", a: "Memory for personal events and specific experiences tied to a time and place." },
                { q: "What is procedural memory?", a: "Unconscious memory for motor skills and actions (e.g., riding a bike)." },
                { q: "What is ecological validity?", a: "The extent to which research findings can be generalized to real-life real-world settings." },
                { q: "What is standardisation in psychological research?", a: "Keeping procedures identical for all participants to eliminate extraneous variables." },
                { q: "What happened to patient HM?", a: "Had his hippocampus removed, leading to severe anterograde amnesia while keeping STM intact." },
                { q: "What is acoustic encoding?", a: "Processing and storing information as sounds." },
                { q: "What is visual encoding?", a: "Processing and storing information as visual images." },
                { q: "What is decay in memory loss?", a: "The fading away of a memory trace over time due to disuse." },
                { q: "What is displacement in short-term memory?", a: "Loss of older information in STM because new incoming items exceed its 7±2 capacity." }
              ],
              quiz: [
                { q: "What is the estimated capacity of Short-Term Memory according to Miller?", opts: ["1-2 items", "7 ± 2 items", "15-20 items", "Unlimited"], ans: 1, exp: "Miller identified the magic number 7 ± 2 for STM capacity." },
                { q: "What type of encoding is predominantly used in Long-Term Memory?", opts: ["Acoustic", "Visual", "Semantic", "Tactile"], ans: 2, exp: "LTM encodes information primarily through meaning (semantics)." },
                { q: "Why did Peterson & Peterson make participants count backwards in their study?", opts: ["To measure mathematical skill", "To prevent verbal rehearsal", "To test concentration", "To induce amnesia"], ans: 1, exp: "Counting backwards prevented maintenance rehearsal." },
                { q: "What term describes memory loss for events that occurred AFTER a brain injury?", opts: ["Retrograde amnesia", "Anterograde amnesia", "Proactive interference", "Displacement"], ans: 1, exp: "Anterograde amnesia prevents the formation of new LTMs post-injury." },
                { q: "In Bartlett's 'War of the Ghosts', what happened to the recalled story?", opts: ["It became longer and more detailed", "It stayed 100% accurate", "It became shorter and westernised to fit schemas", "It was completely forgotten in 10 minutes"], ans: 2, exp: "Participants reconstructed the story to align with British cultural schemas." },
                { q: "What is the duration of the Sensory Register?", opts: ["Less than half a second", "18-30 seconds", "24 hours", "Lifetime"], ans: 0, exp: "The sensory register holds raw sensory input for under 0.5 seconds." },
                { q: "Which memory store requires active attention for information to enter it?", opts: ["Long-Term Memory", "Short-Term Memory", "Procedural Memory", "Sensory Register"], ans: 1, exp: "Paying attention transfers sensory information into STM." },
                { q: "What is procedural memory responsible for?", opts: ["Recalling personal birthdays", "Knowing capital cities", "Motor skills like riding a bike", "Remembering phone numbers"], ans: 2, exp: "Procedural memory stores motor skills and subconscious physical actions." },
                { q: "Which part of the brain was damaged in patient HM?", opts: ["Cerebellum", "Hippocampus", "Visual cortex", "Amydala"], ans: 1, exp: "The hippocampus was removed, preventing long-term memory formation." },
                { q: "What is displacement in memory?", opts: ["Fading over time", "New items pushing older items out of limited-capacity STM", "Brain injury causing memory loss", "Forgetting due to stress"], ans: 1, exp: "Displacement occurs when incoming items exceed the 7±2 limit." },
                { q: "What is semantic memory?", opts: ["Memory for life events", "Memory for motor actions", "Memory for facts, concepts, and general knowledge", "Memory for sounds"], ans: 2, exp: "Semantic memory stores factual world knowledge." },
                { q: "Which of the following is a weakness of Peterson & Peterson's study?", opts: ["Lacked control over variables", "Low ecological validity due to artificial trigram tasks", "Sample size was too large", "No quantitative data was collected"], ans: 1, exp: "Trigram counting tasks do not reflect how we use memory in real life." },
                { q: "What is assimilation in reconstructive memory?", opts: ["Omitting details", "Adding new stories", "Altering details to fit familiar cultural norms", "Repeating text verbatim"], ans: 2, exp: "Assimilation alters details to conform to existing mental schemas." },
                { q: "What transfers information from STM to LTM according to the Multi-Store Model?", opts: ["Sensory perception", "Rehearsal", "Forgetting", "Retrieval"], ans: 1, exp: "Maintenance and elaborative rehearsal transfer data to LTM." },
                { q: "What is retrograde amnesia?", opts: ["Inability to form new memories", "Inability to recall memories prior to brain damage", "Forgetting names of strangers", "Loss of motor skills"], ans: 1, exp: "Retrograde amnesia affects pre-existing memories formed before injury." },
                { q: "What is the main strength of laboratory memory experiments?", opts: ["High ecological validity", "High control over extraneous variables", "Natural participant behavior", "No equipment needed"], ans: 1, exp: "Lab experiments allow precise control over variables to establish cause and effect." },
                { q: "What happens to unrehearsed data in STM over time?", opts: ["It decays or gets displaced", "It automatically enters LTM", "It turns into procedural memory", "It remains preserved forever"], ans: 0, exp: "Unrehearsed STM traces decay within ~30 seconds or get displaced." },
                { q: "Which memory store has an unlimited capacity?", opts: ["Sensory Register", "Short-Term Memory", "Long-Term Memory", "Working Memory"], ans: 2, exp: "LTM is theoretically unlimited in duration and capacity." },
                { q: "What is episodic memory?", opts: ["General facts", "Personal experiences and life events", "Riding a bicycle", "Counting numbers"], ans: 1, exp: "Episodic memory handles personal life events tied to time and context." },
                { q: "What does schema theory explain?", opts: ["Why STM holds 7 items", "How past experiences and expectations active distort recall", "How brain surgery works", "Why we forget trigrams"], ans: 1, exp: "Schemas organize knowledge and influence active memory reconstruction." },

        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">Edexcel GCSE Psychology</span></div>';
          if (u.notes) {
            u.notes.forEach(function (n) {
              html += '<div class="note-block">';
              html += '<h4>' + n.t + '</h4>';
              if (n.content) html += '<p>' + n.content + '</p>';
              if (n.bullets && n.bullets.length) {
                html += '<ul>';
                n.bullets.forEach(function (b) {
                  html += '<li>' + b + '</li>';
                });
                html += '</ul>';
              }
              html += '</div>';
            });
          }
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (sessionCards.length === 0) initSessionData();

        if (flashIdx >= sessionCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You have reviewed all <b>' + sessionCards.length + '</b> unique flashcards for this topic.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = sessionCards[flashIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (flashIdx + 1) + ' of ' + sessionCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event, false)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event, true)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e, hit) {
        if (e) e.stopPropagation();
        flipped = false;
        flashIdx++;
        render();
      };

      window.resetFlashcards = function () {
        flashIdx = 0;
        flipped = false;
        initSessionData();
        render();
      };

      function renderQuiz() {
        if (sessionQuiz.length === 0) initSessionData();

        if (quizIdx >= sessionQuiz.length) {
          var pct = Math.round((quizScore / sessionQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + sessionQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = sessionQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + sessionQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectQuizOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<div class="explanation"><b>Explanation:</b> ' + q.exp + '</div>';
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuizQ()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectQuizOpt = function (idx) {
        quizSelected = idx;
        if (idx === sessionQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuizQ = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        initSessionData();
        render();
      };

      function render() {
        var main = document.getElementById('view');
        if (!main) return;
        if (currentTab === 'notes') main.innerHTML = renderNotes();
        else if (currentTab === 'study') main.innerHTML = renderStudy();
        else if (currentTab === 'quiz') main.innerHTML = renderQuiz();
      }

      updateUnitDropdown();
      initSessionData();
      render();
    })();
  </script>
</body>
</html>
