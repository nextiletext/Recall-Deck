<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - Edexcel GCSE Maths</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-card: #18222d;
      --surface-hover: #1f2c3a;
      --ink: #f0f4f8;
      --muted: #8a99a8;
      --line: #263545;
      --accent: #2563eb;
      --accent-ink: #ffffff;
      --good: #10b981;
      --bad: #ef4444;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --accent: #1d4ed8;
      --accent-ink: #ffffff;
      --good: #059669;
      --bad: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      transition: background 0.2s, color 0.2s;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .controls-top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-btn {
      font-family: var(--body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface-card);
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subject-picker {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .subj-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .subj-btn.active { background: var(--accent); color: #fff; }

    .theme-toggle {
      background: var(--surface-card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font: 600 0.95rem var(--body);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 6px 6px 0 0;
    }

    nav button[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .unit-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-selector label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    select {
      font: 500 0.85rem var(--mono);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* FLASHCARD VIEW */
    .card-container {
      perspective: 1000px;
      min-height: 320px;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-q {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.45rem;
      line-height: 1.35;
      color: var(--ink);
    }

    .card-a {
      border-top: 1px dashed var(--line);
      padding-top: 16px;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.6;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card-hint {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .btn {
      font: 600 0.95rem var(--body);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:hover { background: var(--surface-hover); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    .btn.miss:hover { background: rgba(239,68,68,0.15); }
    .btn.hit { color: var(--good); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .btn.hit:hover { background: rgba(16,185,129,0.15); }

    /* REVISION NOTES VIEW */
    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .unit-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit-title {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--line);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .unit-spec-tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    .note-block {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-block h4 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
    }

    .note-block p {
      font-size: 0.95rem;
      color: var(--ink);
    }

    .note-block ul {
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-block li {
      font-size: 0.93rem;
      color: var(--ink);
    }

    /* QUIZ VIEW */
    .quiz-container {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .quiz-q {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      width: 100%;
      font: 500 0.95rem var(--body);
      color: var(--ink);
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .opt.right {
      border-color: var(--good);
      background: rgba(16, 185, 129, 0.12);
      color: var(--good);
    }

    .opt.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.12);
      color: var(--bad);
    }

    .opt-idx {
      font-family: var(--mono);
      font-size: 0.8rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .score-summary {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .score-circle {
      font-family: var(--display);
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--accent);
      line-height: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Recall Deck</h1>
        <span class="subtitle">Edexcel GCSE Maths (1MA1)</span>
      </div>
      <div class="controls-top">
        <a href="https://nextiletext.github.io/Recall-Deck" class="back-btn">← Back to Portal</a>
        <div class="subject-picker" id="subjects"></div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Dark Mode</button>
      </div>
    </header>

    <div class="nav-bar">
      <nav role="tablist" id="tabs">
        <button id="tab-notes" aria-selected="true" onclick="setTab('notes')">Detailed Notes</button>
        <button id="tab-study" aria-selected="false" onclick="setTab('study')">Flashcards</button>
        <button id="tab-quiz" aria-selected="false" onclick="setTab('quiz')">Practice Quiz</button>
      </nav>

      <div class="unit-selector">
        <label for="unitSelect">Unit:</label>
        <select id="unitSelect" onchange="setUnit(this.value)"></select>
      </div>
    </div>

    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'tier1';
      var currentUnit = 'all';
      var tab = 'notes';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;
      var isDark = true;

      var sessionCards = [];
      var sessionQuiz = [];

      function shuffleArray(array) {
        var arr = array.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      function shuffleQuizQuestion(q) {
        var correctText = q.opts[q.ans];
        var shuffledOpts = shuffleArray(q.opts);
        var newAnsIndex = shuffledOpts.indexOf(correctText);
        return {
          unitName: q.unitName,
          q: q.q,
          opts: shuffledOpts,
          ans: newAnsIndex
        };
      }

      var DATA = {
        tier1: {
          title: "Edexcel GCSE Maths Core Topics",
          units: [
            {
              id: "m1",
              name: "1. Number & Calculation",
              notes: [
                {
                  t: "Indices & Standard Form",
                  content: "Rules of indices govern powers: a^m × a^n = a^(m+n), a^m ÷ a^n = a^(m-n), (a^m)^n = a^(m×n), a^0 = 1, a^(-n) = 1/a^n, a^(1/n) = ⁿ√a.",
                  points: [
                    "Standard Form: Expressed as A × 10^n where 1 ≤ A < 10 and n is an integer.",
                    "Worked Example (Standard Form): Multiply (3 × 10^4) × (5 × 10^6) = 15 × 10^10 = 1.5 × 10^11.",
                    "Worked Example (Negative Indices): 8^(-2/3) = 1 / (8^(2/3)) = 1 / (³√8)² = 1 / (2²) = 1/4."
                  ]
                },
                {
                  t: "Surds & Exact Calculations",
                  content: "Surds are irrational roots that cannot be written as exact fractions. Rules: √(ab) = √a × √b, √(a/b) = √a / √b.",
                  points: [
                    "Simplifying Surds: Find the largest square factor. E.g., √72 = √(36 × 2) = 6√2.",
                    "Rationalising Denominators: Multiply top and bottom by surd. E.g., 6 / √3 = (6√3) / 3 = 2√3."
                  ]
                }
              ],
              cards: [
                { q: "What is a rational number?", a: "A number that can be expressed as a fraction a/b where a and b are integers." },
                { q: "What is an irrational number?", a: "A number that cannot be written as a fraction of integers (e.g., π, √2)." },
                { q: "What is a surd?", a: "An unsimplified root of a number that results in an irrational value." },
                { q: "What is the rule for a^0?", a: "Any non-zero number raised to the power of 0 equals 1." },
                { q: "What does a^(-n) mean?", a: "1 / (a^n) — the reciprocal of a^n." },
                { q: "What does a^(1/n) mean?", a: "The nth root of a (ⁿ√a)." },
                { q: "Standard form format constraint for A × 10^n?", a: "1 ≤ A < 10, and n must be an integer." },
                { q: "What is a prime number?", a: "A integer greater than 1 with exactly two factors: 1 and itself." },
                { q: "What is HCF?", a: "Highest Common Factor — the largest factor shared by two or more numbers." },
                { q: "What is LCM?", a: "Lowest Common Multiple — the smallest multiple shared by two or more numbers." }
              ],
              quiz: [
                { q: "Simplify 8^(-2/3):", opts: ["-4", "1/4", "4", "1/8"], ans: 1 },
                { q: "Express 0.00045 in standard form:", opts: ["4.5 × 10^(-4)", "45 × 10^(-5)", "4.5 × 10^4", "0.45 × 10^(-3)"], ans: 0 },
                { q: "Simplify √72 in exact surd form:", opts: ["3√8", "6√2", "2√18", "36√2"], ans: 1 },
                { q: "Rationalise the denominator of 6 / √3:", opts: ["2√3", "3√6", "6√3", "2"], ans: 0 },
                { q: "What is the value of 16^(3/4)?", opts: ["6", "8", "12", "64"], ans: 1 }
              ]
            },
            {
              id: "m2",
              name: "2. Algebra & Graphs",
              notes: [
                {
                  t: "Quadratics: Factoring, Completing Square & Formula",
                  content: "Quadratic equations take the form ax² + bx + c = 0. Solved via factoring, completing the square, or quadratic formula: x = (-b ± √(b² - 4ac)) / (2a).",
                  points: [
                    "Completing the Square: x² + bx + c = (x + b/2)² - (b/2)² + c.",
                    "Worked Example: Solve x² - 6x + 2 = 0 by completing square: (x - 3)² - 9 + 2 = 0 => (x - 3)² = 7 => x = 3 ± √7."
                  ]
                },
                {
                  t: "Linear Graphs & Parallel/Perpendicular Lines",
                  content: "y = mx + c where m is gradient and c is y-intercept. Parallel lines have equal gradients (m1 = m2). Perpendicular lines have gradients m1 × m2 = -1.",
                  points: [
                    "Worked Example: Line L1 has equation y = 3x + 2. Find perpendicular line passing through (6, 1): Perpendicular gradient = -1/3. Equation: y - 1 = -1/3(x - 6) => y = -1/3x + 3."
                  ]
                }
              ],
              cards: [
                { q: "What is gradient m in y = mx + c?", a: "The rate of change / steepness of the line: Change in y / Change in x." },
                { q: "Condition for two lines to be parallel?", a: "They must have identical gradients (m1 = m2)." },
                { q: "Condition for two lines to be perpendicular?", a: "Their gradients must be negative reciprocals (m1 × m2 = -1)." },
                { q: "What is an identity ≡?", a: "An equation true for all values of the variable." },
                { q: "What is the quadratic formula?", a: "x = (-b ± √(b² - 4ac)) / (2a)." },
                { q: "What is the turning point form of a quadratic?", a: "y = a(x - h)² + k, where (h, k) is the turning point." },
                { q: "What does factorising mean?", a: "Writing an algebraic expression as a product of its factors in brackets." },
                { q: "What is simultaneous equations elimination method?", a: "Scaling and adding/subtracting equations to eliminate one variable." },
                { q: "What is an inequality?", a: "A mathematical statement comparing expressions using <, >, ≤, or ≥." },
                { q: "What is an arithmetic sequence nth term?", a: "a + (n - 1)d, where a is first term and d is common difference." }
              ],
              quiz: [
                { q: "Find the gradient perpendicular to y = 2x + 5:", opts: ["2", "-2", "1/2", "-1/2"], ans: 3 },
                { q: "Solve x² - 9 = 0:", opts: ["x = 3", "x = 9", "x = ±3", "x = ±9"], ans: 2 },
                { q: "Turning point of y = (x - 4)² + 7:", opts: ["(-4, 7)", "(4, 7)", "(4, -7)", "(-4, -7)"], ans: 1 },
                { q: "Nth term of sequence 5, 9, 13, 17...:", opts: ["4n + 1", "5n + 4", "4n + 5", "n + 4"], ans: 0 },
                { q: "Factorise x² - 5x + 6:", opts: ["(x - 2)(x - 3)", "(x + 2)(x + 3)", "(x - 1)(x - 6)", "(x + 1)(x - 6)"], ans: 0 }
              ]
            },
            {
              id: "m3",
              name: "3. Ratio, Proportion & Rates of Change",
              notes: [
                {
                  t: "Compound Interest & Growth/Decay",
                  content: "Compound amount = Principal × (Multiplier)^n. Multiplier = 1 ± (percentage / 100).",
                  points: [
                    "Worked Example: £4000 invested at 3% compound interest per annum for 4 years. Multiplier = 1.03. Amount = 4000 × (1.03)⁴ = £4502.04."
                  ]
                },
                {
                  t: "Direct & Inverse Proportion",
                  content: "Direct: y ∝ x => y = kx. Inverse: y ∝ 1/x => y = k/x. Find constant k first using initial conditions.",
                  points: [
                    "Worked Example: y is inversely proportional to x². When x = 3, y = 4. Find y when x = 2: y = k/x² => 4 = k/9 => k = 36. Thus y = 36/x² = 36/4 = 9."
                  ]
                }
              ],
              cards: [
                { q: "What is direct proportion?", a: "As one variable increases, the other increases at a constant multiplier rate (y = kx)." },
                { q: "What is inverse proportion?", a: "As one variable increases, the other decreases proportionally (y = k/x)." },
                { q: "What is a percentage multiplier for 15% increase?", a: "1.15" },
                { q: "What is a percentage multiplier for 8% decrease?", a: "0.92" },
                { q: "Formula for speed?", a: "Speed = Distance / Time." },
                { q: "Formula for density?", a: "Density = Mass / Volume." },
                { q: "Formula for pressure?", a: "Pressure = Force / Area." },
                { q: "What is unit rate?", a: "A rate simplified to a quantity per single unit (e.g. miles per 1 hour)." },
                { q: "How to convert m/s to km/h?", a: "Multiply by 3.6 (or ×3600 / 1000)." },
                { q: "What is compound growth formula?", a: "Total = Principal × (1 + r/100)^n." }
              ],
              quiz: [
                { q: "£5000 invested at 4% compound interest for 3 years:", opts: ["£5600.00", "£5624.32", "£5608.00", "£5400.00"], ans: 1 },
                { q: "If y ∝ 1/x and y=6 when x=2, find y when x=4:", opts: ["3", "12", "1.5", "8"], ans: 0 },
                { q: "Convert 15 m/s to km/h:", opts: ["45 km/h", "54 km/h", "60 km/h", "30 km/h"], ans: 1 },
                { q: "A map scale is 1:25000. 4cm on map is how many km?", opts: ["1 km", "10 km", "0.1 km", "4 km"], ans: 0 },
                { q: "Mass = 120g, Volume = 15cm³. Density = ?", opts: ["8 g/cm³", "1800 g/cm³", "0.125 g/cm³", "105 g/cm³"], ans: 0 }
              ]
            },
            {
              id: "m4",
              name: "4. Geometry & Trigonometry",
              notes: [
                {
                  t: "Right-Angled Trigonometry & Pythagoras",
                  content: "Pythagoras: a² + b² = c² (c = hypotenuse). SOH CAH TOA: sin θ = Opp/Hyp, cos θ = Adj/Hyp, tan θ = Opp/Adj.",
                  points: [
                    "Non-Right-Angled Triangles: Sine Rule: a / sin A = b / sin B. Cosine Rule: a² = b² + c² - 2bc cos A. Area = 1/2 ab sin C."
                  ]
                },
                {
                  t: "Circle Theorems",
                  content: "Core circle rules: 1. Angle at centre is twice angle at circumference. 2. Angle in semicircle is 90°. 3. Angles in same segment are equal. 4. Opposite angles in cyclic quadrilateral sum to 180°. 5. Alternate segment theorem."
                }
              ],
              cards: [
                { q: "What is Pythagoras' Theorem?", a: "a² + b² = c² in a right-angled triangle where c is the hypotenuse." },
                { q: "What does SOH stand for?", a: "Sin(θ) = Opposite / Hypotenuse." },
                { q: "What does CAH stand for?", a: "Cos(θ) = Adjacent / Hypotenuse." },
                { q: "What does TOA stand for?", a: "Tan(θ) = Opposite / Adjacent." },
                { q: "Sine Rule formula?", a: "a / sin(A) = b / sin(B) = c / sin(C)." },
                { q: "Cosine Rule formula for side a?", a: "a² = b² + c² - 2bc cos(A)." },
                { q: "Area of non-right-angled triangle?", a: "Area = 1/2 a b sin(C)." },
                { q: "Circle Theorem: Angle in a semicircle?", a: "Always 90 degrees." },
                { q: "Circle Theorem: Cyclic quadrilateral opposite angles?", a: "Add up to 180 degrees." },
                { q: "Circle Theorem: Tangent and radius angle?", a: "Meet at exactly 90 degrees." }
              ],
              quiz: [
                { q: "In a right triangle, opp=3, adj=4. Hypotenuse = ?", opts: ["5", "6", "7", "25"], ans: 0 },
                { q: "Exact value of sin(30°)?", opts: ["1/2", "√3/2", "1/√2", "1"], ans: 0 },
                { q: "Exact value of cos(60°)?", opts: ["1/2", "√3/2", "0", "1"], ans: 0 },
                { q: "Angle at centre of circle is 70°. Angle at circumference = ?", opts: ["140°", "35°", "70°", "90°"], ans: 1 },
                { q: "Opposite angle in cyclic quad to 110° is:", opts: ["70°", "110°", "90°", "250°"], ans: 0 }
              ]
            },
            {
              id: "m5",
              name: "5. Probability",
              notes: [
                {
                  t: "Independent Events & Tree Diagrams",
                  content: "P(A and B) = P(A) × P(B) for independent events. P(A or B) = P(A) + P(B) for mutually exclusive events.",
                  points: [
                    "Tree Diagrams: Multiply probabilities along branches; add probabilities across vertical outcomes.",
                    "Worked Example: Bag with 5 red, 3 blue marbles. Pick two without replacement. P(both Red) = (5/8) × (4/7) = 20/56 = 5/14."
                  ]
                }
              ],
              cards: [
                { q: "What are mutually exclusive events?", a: "Events that cannot happen at the same time (P(A and B) = 0)." },
                { q: "What are independent events?", a: "Events where the outcome of one does not affect the probability of the other." },
                { q: "What is conditional probability?", a: "The probability of an event occurring given that another event has already occurred." },
                { q: "Rule for P(A or B) for mutually exclusive events?", a: "P(A) + P(B)." },
                { q: "Rule for P(A and B) for independent events?", a: "P(A) × P(B)." },
                { q: "What must total sum of probabilities equal?", a: "Exactly 1." },
                { q: "What is relative frequency?", a: "Experimental probability = Number of successful trials / Total number of trials." },
                { q: "What is a Venn diagram in probability?", a: "A diagram showing overlapping set relationships between different events." },
                { q: "What does P(A') mean?", a: "The probability of event A NOT occurring (1 - P(A))." },
                { q: "What is sample space?", a: "The set of all possible outcomes of a probability experiment." }
              ],
              quiz: [
                { q: "If P(Red) = 0.35, find P(Not Red):", opts: ["0.65", "0.35", "0.50", "0.75"], ans: 0 },
                { q: "Two fair dice rolled. P(getting double 6) =", opts: ["1/6", "1/12", "1/36", "1/18"], ans: 2 },
                { q: "Bag has 4 red, 6 blue. Pick 2 without replacement. P(2 Red):", opts: ["16/100", "12/90", "12/100", "4/10"], ans: 1 },
                { q: "Relative frequency of 15 heads in 50 coin flips:", opts: ["0.15", "0.30", "0.50", "0.60"], ans: 1 },
                { q: "P(A) = 0.4, P(B) = 0.5 (independent). P(A and B) =", opts: ["0.9", "0.2", "0.1", "0.45"], ans: 1 }
              ]
            },
            {
              id: "m6",
              name: "6. Statistics",
              notes: [
                {
                  t: "Averages, Range & Grouped Frequency Tables",
                  content: "Mean = Σfx / Σf (using midpoints for grouped tables). Median = middle value. Mode = most frequent value. Range = Max - Min.",
                  points: [
                    "Cumulative Frequency & Box Plots: Interquartile Range (IQR) = Upper Quartile (Q3) - Lower Quartile (Q1). Outliers = values > Q3 + 1.5×IQR."
                  ]
                }
              ],
              cards: [
                { q: "How to calculate Mean from grouped table?", a: "Sum of (Frequency × Midpoint) divided by Total Frequency (Σfx / Σf)." },
                { q: "What is Median?", a: "The middle value when data is ordered sequentially." },
                { q: "What is Mode?", a: "The value that appears most frequently in a dataset." },
                { q: "What is Range?", a: "Difference between the maximum and minimum values." },
                { q: "What is Interquartile Range (IQR)?", a: "Upper Quartile (Q3) minus Lower Quartile (Q1)." },
                { q: "What five values form a Box Plot?", a: "Minimum, Lower Quartile (Q1), Median (Q2), Upper Quartile (Q3), Maximum." },
                { q: "What is a histogram frequency density formula?", a: "Frequency Density = Frequency / Class Width." },
                { q: "What does a scatter graph show?", a: "Relationship/correlation between two bivariate quantitative variables." },
                { q: "What is a line of best fit?", a: "A straight line drawn on a scatter graph representing the general trend." },
                { q: "What is extrapolation?", a: "Estimating values outside the range of collected data (unreliable)." }
              ],
              quiz: [
                { q: "Find mean of 3, 7, 8, 10, 12:", opts: ["8", "7.5", "8.0", "10"], ans: 0 },
                { q: "Histogram class width = 5, frequency = 20. Frequency Density =", opts: ["100", "4", "0.25", "25"], ans: 1 },
                { q: "Q1 = 14, Q3 = 26. IQR =", opts: ["12", "20", "40", "14"], ans: 0 },
                { q: "Median position formula for n values:", opts: ["(n + 1)/2", "n/2", "n + 1", "(n - 1)/2"], ans: 0 },
                { q: "Modal class of intervals 0-5 (f=3), 5-10 (f=8), 10-15 (f=4):", opts: ["0-5", "5-10", "10-15", "8"], ans: 1 }
              ]
            }
          ]
        }
      };

      function renderHeader() {
        var subHtml = '';
        var keys = ['tier1'];
        var labels = { tier1: 'Edexcel GCSE Maths' };
        keys.forEach(function (k) {
          subHtml += '<button class="subj-btn ' + (currentSubj === k ? 'active' : '') + '" onclick="setSubj(\'' + k + '\')">' + labels[k] + '</button>';
        });
        document.getElementById('subjects').innerHTML = subHtml;

        var unitOpts = '<option value="all">All Units (' + DATA[currentSubj].title + ')</option>';
        DATA[currentSubj].units.forEach(function (u) {
          unitOpts += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        document.getElementById('unitSelect').innerHTML = unitOpts;
        document.getElementById('themeBtn').textContent = isDark ? 'Dark Mode' : 'Light Mode';
      }

      function initSessionData() {
        var rawCards = [];
        var rawQuiz = [];

        var units = DATA[currentSubj].units;
        var filtered = currentUnit === 'all' ? units : units.filter(function(u) { return u.id === currentUnit; });

        filtered.forEach(function(u) {
          if (u.cards) {
            u.cards.forEach(function(c) {
              rawCards.push({ unitName: u.name, q: c.q, a: c.a });
            });
          }
          if (u.quiz) {
            u.quiz.forEach(function(q) {
              rawQuiz.push(shuffleQuizQuestion({ unitName: u.name, q: q.q, opts: q.opts, ans: q.ans }));
            });
          }
        });

        sessionCards = shuffleArray(rawCards);
        sessionQuiz = shuffleArray(rawQuiz);
      }

      window.toggleTheme = function() {
        isDark = !isDark;
        if (!isDark) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        renderHeader();
      };

      window.setSubj = function (s) {
        currentSubj = s;
        currentUnit = 'all';
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0; flipped = false;
        initSessionData();
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        if (t === 'study' || t === 'quiz') {
          initSessionData();
          qIdx = 0; quizIdx = 0; quizSelected = null; quizScore = 0;
        }
        document.querySelectorAll('nav button').forEach(function (btn) {
          btn.setAttribute('aria-selected', btn.id === 'tab-' + t);
        });
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function renderNotes() {
        var units = getFilteredUnits();
        var html = '<div class="notes-container">';
        units.forEach(function (u) {
          html += '<div class="unit-panel">';
          html += '<div class="unit-title"><span>' + u.name + '</span><span class="unit-spec-tag">Edexcel GCSE Maths</span></div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-block">';
            html += '<h4>' + n.t + '</h4>';
            if (n.content) html += '<p>' + n.content + '</p>';
            if (n.points && n.points.length) {
              html += '<ul>';
              n.points.forEach(function (pt) {
                html += '<li>' + pt + '</li>';
              });
              html += '</ul>';
            }
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      function renderStudy() {
        if (sessionCards.length === 0) initSessionData();

        if (qIdx >= sessionCards.length) {
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Flashcards Completed!</h2>';
          html += '<p>You have reviewed all <b>' + sessionCards.length + '</b> unique flashcards for this unit selection.</p>';
          html += '<button class="btn primary" onclick="resetFlashcards()">Restart Flashcards</button>';
          html += '</div></div>';
          return html;
        }

        var c = sessionCards[qIdx];
        var html = '<div class="card-container">';
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="card-head"><span>' + c.unitName + '</span><span>Card ' + (qIdx + 1) + ' of ' + sessionCards.length + '</span></div>';
        html += '<div class="card-body">';
        html += '<div class="card-q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="card-a">' + c.a + '</div>';
        }
        html += '</div>';
        html += '<div class="card-hint">' + (flipped ? '✓ Tap card to flip back' : '💡 Tap card to reveal answer') + '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">❌ Need Practice</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">✅ Got It!</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        if (e) e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      window.resetFlashcards = function () {
        qIdx = 0;
        flipped = false;
        initSessionData();
        render();
      };

      function renderQuiz() {
        if (sessionQuiz.length === 0) initSessionData();

        if (quizIdx >= sessionQuiz.length) {
          var pct = Math.round((quizScore / sessionQuiz.length) * 100);
          var html = '<div class="quiz-container"><div class="score-summary">';
          html += '<h2>Quiz Completed!</h2>';
          html += '<div class="score-circle">' + pct + '%</div>';
          html += '<p>You scored <b>' + quizScore + ' out of ' + sessionQuiz.length + '</b> correct.</p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Restart Quiz</button>';
          html += '</div></div>';
          return html;
        }

        var q = sessionQuiz[quizIdx];
        var html = '<div class="quiz-container">';
        html += '<div class="quiz-header"><span>' + q.unitName + '</span><span>Question ' + (quizIdx + 1) + ' of ' + sessionQuiz.length + '</span></div>';
        html += '<div class="quiz-q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">';
          html += '<span class="opt-idx">' + String.fromCharCode(65 + idx) + '</span>';
          html += '<span>' + opt + '</span>';
          html += '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question →</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === sessionQuiz[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0; quizSelected = null; quizScore = 0;
        initSessionData();
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (!main) return;
        if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      initSessionData();
      render();
    })();
  </script>
</body>
</html>
